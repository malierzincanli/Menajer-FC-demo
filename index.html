function runQuickSim(maxWeeks){
  clearTimers();clearUiTimers();mdx();TUT.stop(false);
  if(G.spon===null)G.spon=1;

  const startCash=G.cash;
  let played=0,wCnt=0,dCnt=0,lCnt=0,injCnt=0,redCnt=0,crisisCnt=0;
  const highlights=[],incidents=[];
  let stopReason=null;

  for(let step=0;step<maxWeeks;step++){
    skipEliminatedCupWeeks();
    if(G.wk>=G.cal.length)break;

    ensureMinSquad(G.cid,true);
    autoPickBestXI(true);
    const n=nx();
    const os=(n.op*3+G.wk+G.season)%4;
    if(G.asstStyle&&canSeeOppStyle())G.sty=counterStyle(os);

    const dc=diffCfg();
    const homeBonus=(n.home&&G.fans>=35&&!hm('prot'))?2.5:-2.5;
    const d=tstr(G.cid)-(tstr(n.op)+dc.aiBoost)+homeBonus;
    const ad=adv(G.sty,os);
    const advMult=G.scen==='tactician'?0.16:0.08;
    let lf=C(1.28*Math.exp(d/20)*(1+advMult*ad),0.20,4.2);
    let la=C(1.28*Math.exp(-d/20)*(1-advMult*ad),0.20,4.2);
    if(n.home&&!hm('prot')){
      la*=Math.max(0.88,1-G.fac[3]*0.02);
      if(G.fans>85){lf*=1.06;la*=0.94}
    }
    if(hm('split'))lf*=0.90;
    if(hm('hype'))lf*=1.08;
    if(hm('prot')&&n.home){lf*=0.92;la*=1.06}
    if(G.trn===0)lf+=0.08;
    if(G.trn===1)la=Math.max(0.15,la-0.08);
    if(G.trn===2)DB.pl.forEach(x=>{if(x.c===G.cid)x.k=Math.min(100,x.k+6)});

    lf=C(lf*(1+(Math.random()-0.50)*0.12),0.20,4.4);
    la=C(la*(1+(Math.random()-0.50)*0.12),0.20,4.4);

    let simRedPlayer=null;
    const redChance=hm('disc')?0.02:(0.045+G.agg*0.025);
    const validXi=G.xi.filter(id=>id!==null&&id!==undefined);
    if(Math.random()<redChance&&validXi.length){
      simRedPlayer=DB.pl[P(validXi)];
      lf*=0.85;la*=1.15;redCnt++;
      if(simRedPlayer)incidents.push(`Kırmızı Kart: ${simRedPlayer.n} (1 maç ceza)`);
    }

    const gf=poi(lf),ga=poi(la);
    const r=gf>ga?1:gf<ga?-1:0;
    const pen=(n.t!=='l'&&r===0)?simPenShootout():null;
    const penTag=pen?` (Pen: ${pen.my}-${pen.op})`:'';
    const cupOk=r>0||(pen&&pen.won);
    played++;
    if(r>0)wCnt++;else if(r===0)dCnt++;else lCnt++;
    recordMatchStats(gf,ga,CN(n.op));

    /* Gerçek Sezon İstatistik Takibi: apps, g, ast, ratSum, ratCnt */
    const xiPl=validXi.map(id=>DB.pl[id]).filter(Boolean);
    const attPool=xiPl.filter(x=>x.p>=2);
    const simRat={};
    xiPl.forEach(x=>{
      const baseR=6.3+(r>0?0.55:r<0?-0.45:0.1)+(Math.random()-0.45)*0.7+(ga===0&&x.p<=1?0.45:0)-(ga>=2&&x.p<=1?0.35:0);
      simRat[x.id]=C(baseR,4.8,8.8);
    });
    for(let g=0;g<gf;g++){
      const z=P(attPool.length?attPool:xiPl);
      if(z){
        z.g=(z.g||0)+1;
        simRat[z.id]=C((simRat[z.id]||6.6)+0.9,5.0,9.8);
        const aPool=xiPl.filter(q=>q.id!==z.id&&q.p>=1);
        if(aPool.length&&Math.random()<0.78){
          const aP=P(aPool);
          aP.ast=(aP.ast||0)+1;
          simRat[aP.id]=C((simRat[aP.id]||6.6)+0.5,5.0,9.6);
        }
      }
    }
    if(simRedPlayer&&simRat[simRedPlayer.id]!==undefined)simRat[simRedPlayer.id]=C(simRat[simRedPlayer.id]-1.3,3.5,6.5);
    xiPl.forEach(x=>{
      x.apps=(x.apps||0)+1;
      x.ratSum=(x.ratSum||0)+ +(simRat[x.id]||6.5).toFixed(1);
      x.ratCnt=(x.ratCnt||0)+1;
    });

    const prevTb=JSON.stringify(G.tb);
    if(n.t==='l'){
      G.fx[n.r].forEach(([h,a])=>{
        if(h===G.cid||a===G.cid)res(h,a,h===G.cid?gf:ga,h===G.cid?ga:gf);
        else{const[x,y]=sim(h,a);res(h,a,x,y)}
      });
      const old=JSON.parse(prevTb);
      G.fx[n.r].forEach(([h,a])=>{
        if(h!==G.cid&&a!==G.cid){
          const x=G.tb[h].gf-old[h].gf,y=G.tb[a].gf-old[a].gf;
          [[h,x],[a,y]].forEach(([cid,gl])=>{
            for(let i=0;i<gl;i++){
              const fs=DB.pl.filter(q=>q.c===cid&&q.p>=2);
              if(fs.length){const z=P(fs);z.g=(z.g||0)+1}
            }
          });
        }
      });
      highlights.push(`H${n.r+1} Lig: ${CN(G.cid)} ${gf}-${ga} ${CN(n.op)}`);
    }else if(n.t==='e'){
      if(cupOk){
        G.eurR++;G.xp+=20;
        const mult=ecoInf();
        if(G.eurR===3){
          const gross=Math.round(35*mult),net=+(gross*0.75).toFixed(1);
          G.eurWon=1;G.stats.euroCups++;G.cash+=net;
          G.fans=C(G.fans+15,0,100);G.board=C(G.board+15,0,100);G.med=C(G.med+12,0,100);G.xp+=60;
          highlights.push(`AVRUPA ŞAMPİYONU: ${CN(G.cid)} ${gf}-${ga}${penTag} ${CN(n.op)} (+${net} M net)`);
        }else{
          const rew=Math.round((G.eurR===1?8:12)*mult);G.cash+=rew;
          highlights.push(`Avrupa Kupası Tur Geçildi: ${CN(G.cid)} ${gf}-${ga}${penTag} ${CN(n.op)} (+${rew} M)`);
        }
      }else{G.euro=0;highlights.push(`Avrupa'ya Veda: ${CN(G.cid)} ${gf}-${ga}${penTag} ${CN(n.op)}`)}
    }else{
      if(cupOk){
        G.cr++;G.xp+=15;
        if(G.cr===3){G.stats.natCups++;G.fans=C(G.fans+12,0,100);G.xp+=40;highlights.push(`KUPA ŞAMPİYONU: ${CN(G.cid)} ${gf}-${ga}${penTag} ${CN(n.op)}`)}
        else highlights.push(`Kupa Turu Geçildi: ${CN(G.cid)} ${gf}-${ga}${penTag} ${CN(n.op)}`);
      }else{G.cup=0;highlights.push(`Kupadan Elendin: ${CN(G.cid)} ${gf}-${ga}${penTag} ${CN(n.op)}`)}
    }

    const cp=G.cap!==null&&validXi.includes(G.cap);
    G.xp+=r>0?10:r===0?3:0;
    while(G.xp>=30){G.xp-=30;G.sp++}
    G.strk=r<0?G.strk+1:0;
    G.board=C(G.board+r*3,0,100);
    G.fans=C(G.fans+r*3,0,100);
    G.sq=C(G.sq+r*2+(cp&&r<0?1:0),0,100);

    if(n.home){
      G.cash+=homeTicketRevenue(true);
      if(G.tp===0)G.fans=C(G.fans+1,0,100);
      if(G.tp===2&&fill()<60)G.fans=C(G.fans-1,0,100);
    }
    if(r>0){
      G.cash+=matchWinGross()-winBonusAmount();
      if(G.spon===1)G.cash+=1.3*ecoInf()*leagueTvMult(clubLeague(G.cid));
    }else if(r===0){
      G.cash+=matchDrawGross();
    }

    if(r>0&&Math.random()<0.5)G.med=C(G.med+1,0,100);
    else if(r<0){G.board=C(G.board-1,0,100);if(Math.random()<0.5)G.med=C(G.med-1,0,100)}

    const dueIdx=G.later.findIndex(l=>l.w<=0);
    if(dueIdx>=0){
      const it=G.later.splice(dueIdx,1)[0];
      const fuFn=FU[it.id];
      if(fuFn){
        G.evPid=it.pid;
        const evData=fuFn(it.pid);
        const opt=evData[1][Math.random()<0.55?0:1];
        ap(opt[1]);crisisCnt++;
        incidents.push(`Kriz Zinciri: ${evData[0].slice(0,48)}... (${opt[0]})`);
      }
    }else if(Math.random()<0.34){
      G.evPid=undefined;
      const evData=P(EV2);
      const opt=evData[1][Math.random()<0.5?0:1];
      ap(opt[1]);crisisCnt++;
      incidents.push(`Kulüp Olayı: ${evData[0].slice(0,46)}... (${opt[0]})`);
    }

    const injRed=G.fac[2]*0.01+G.stf[2]*0.012;
    const playedIds=new Set(validXi);
    DB.pl.filter(x=>x.c===G.cid).forEach(x=>{
      if(playedIds.has(x.id)){
        x.bnStrk=0;
        if(x.prom>0){x.prom--;if(x.prom===0)x.m=C(x.m+8,0,100)}
        if(x.injRisk===1){
          x.injRisk=0;
          if(Math.random()<0.35){x.i=R(3,4);injCnt++;incidents.push(`İğne Riski Patladı: ${x.n} (${x.i} hafta sakat)`)}
        }
        const loss=R(18,24)+G.agg*2;
        x.k=Math.max(10,Math.round(x.k-loss));
        x.m=C(x.m+r*(cp?3:4),0,100);
        x.f=C(x.f+r*4,0,100);
        const risk=(x.k<52?0.07+0.03*G.agg:x.k<68?0.025+0.015*G.agg:0.012)-injRed+(x.tp===3?0.035:0);
        if(!x.i&&Math.random()<Math.max(0.004,risk)){x.i=R(1,3);injCnt++;incidents.push(`Sakatlık: ${x.n} (${x.i} hafta)`)}
      }else{
        if(x.sus>0)x.sus--;
        if(!x.i)x.bnStrk=(x.bnStrk||0)+1;
        x.m=C(x.m-(x.tp===1?2:1),0,100);
        if(x.prom>0&&!x.i){x.prom=0;x.m=C(x.m-12,0,100)}
      }
    });
    if(simRedPlayer)simRedPlayer.sus=1;

    if(G.ult){
      const earned=r>0?3:r===0?1:0;
      G.ult.pts+=earned;G.ult.left--;
      if(G.ult.pts>=G.ult.need){
        G.ult=null;G.board=C(G.board+14,0,100);
        highlights.push('Yönetim ültimatomu başarıyla aşıldı (+14 Yönetim).');
      }else if(G.ult.left<=0){
        return fired(`Hızlı simülasyonda yönetim ültimatomu başarısız oldu (${G.ult.pts}/${G.ult.need} puan). Görevine son verildi.`);
      }
    }

    const sc=scenCfg();
    if(G.sq<10)return fired('Soyunma odası isyan etti! Yönetim görevine son verdi.');
    if(G.board<sc.fireTh&&!G.ult)return fired('Yönetim güveni kritik eşiğin altına indi. Görevden alındın.');
    if(G.board<sc.ultTh&&!G.ult){
      G.ult={left:3,pts:0,need:6};
      advanceWeekInternals(playedIds,true);
      stopReason='ultimatum';
      break;
    }

    advanceWeekInternals(playedIds,true);
    if(G.wk>=G.cal.length)break;
  }

  save();
  const curRank=rank().indexOf(G.cid)+1;
  const cashDiff=G.cash-startCash;
  const topClubScorer=DB.pl.filter(x=>x.c===G.cid).sort((a,b)=>(b.g||0)-(a.g||0))[0];
  const cupTxt=G.cr===3?'Kupa Şampiyonu':G.cup?`${G.cr}/3 Tur Geçildi`:'Elendi';
  const seasonDone=G.wk>=G.cal.length;

  S(`
    <div class="ed-card">
      <div class="ed-accent ${stopReason==='ultimatum'?'':'sim'}"></div>
      <div class="ed-mast">
        <strong>SPOR MANŞET</strong>
        <span>SEZON ${G.season} · SİMÜLASYON RAPORU</span>
      </div>
      <div class="ed-body">
        <div class="ed-kicker ${stopReason==='ultimatum'?'':'sim'}">
          ${stopReason==='ultimatum'?`${ico('alert',12)} ACİL DURAKLATMA · YÖNETİM ÜLTİMATOMU`:`${ico('fast',12)} HIZLI KARİYER ÖZETİ`}
        </div>
        <div class="ed-hl">
          ${stopReason==='ultimatum'
            ?'Yönetim Kurulu Acil Toplandı: 3 Maçta 6 Puan Şartı!'
            :`${played} Maç Tamamlandı · ${wCnt}G ${dCnt}B ${lCnt}M`}
        </div>

        <div class="g2" style="margin:10px 0">
          <div class="c2" style="margin:0"><span class="lbl">Güncel Lig Sırası</span><div class="big">${curRank}. Sıra</div></div>
          <div class="c2" style="margin:0"><span class="lbl">Kasa Değişimi</span><div class="big" style="color:${cashDiff>=0?'var(--ok)':'var(--bad)'}">${cashDiff>=0?'+':''}${cashDiff.toFixed(1)} M</div></div>
          <div class="c2" style="margin:0"><span class="lbl">En Golcü Oyuncu</span><div style="font-weight:800;font-size:14px">${topClubScorer?`${E(topClubScorer.n)} (${topClubScorer.g||0})`:'-'}</div></div>
          <div class="c2" style="margin:0"><span class="lbl">Kupa / Avrupa</span><div style="font-weight:800;font-size:13px">${cupTxt}${G.euro?` · Avr ${G.eurR}/3`:''}</div></div>
        </div>

        <div class="c2" style="margin:8px 0">
          <span class="lbl">${ico('alert',12)} Sakatlık / Ceza / Kriz Özeti</span>
          <div class="row" style="flex-wrap:wrap;margin-bottom:4px">
            <span class="pill ${injCnt?'neg':'pos'}">Sakatlık: ${injCnt}</span>
            <span class="pill ${redCnt?'neg':'pos'}">Kırmızı Kart: ${redCnt}</span>
            <span class="pill ${crisisCnt?'neu':'pos'}">Kriz/Olay: ${crisisCnt}</span>
          </div>
          ${incidents.slice(-5).map(s=>`<div class="m" style="padding:2px 0">• ${E(s)}</div>`).join('')||'<div class="m">Önemli bir disiplin veya sakatlık krizi yaşanmadı.</div>'}
        </div>

        <span class="lbl" style="margin-top:8px">Öne Çıkan Sonuçlar</span>
        <div class="c2" style="max-height:140px;overflow-y:auto">
          ${highlights.slice(-8).reverse().map(h=>`<div class="m" style="padding:3px 0;border-bottom:1px solid var(--b)">${E(h)}</div>`).join('')||'<div class="m">Maç oynanmadı.</div>'}
        </div>

        <button style="margin-top:10px" onclick="${seasonDone?'endSeason':'render'}()">
          ${ico('play',14)} ${seasonDone?'Sezon Sonu Raporuna Geç':'Kariyere Devam Et'}
        </button>
      </div>
    </div>
  `);
}

function advanceWeekInternals(playedIds,silent=false){
  G.mods.forEach(m=>{if(m.id!=='prot')m.w--});
  if(hm('media'))G.fans=C(G.fans+1,0,100);
  if(hm('unrest'))G.sq=C(G.sq-2,0,100);
  G.mods=G.mods.filter(m=>m.w>0);
  G.later.forEach(l=>l.w--);

  const inc=weeklyBaseIncome();
  const exp=wageBill()+staffUpkeep()+facUpkeep()+ffpWageTax();
  G.cash+=inc-exp;

  if(G.cash<-15)G.board=C(G.board-3,0,100);
  if(G.cash<-30&&!G.ffpApplied){
    G.ffpApplied=1;
    G.tb[G.cid].pen=(G.tb[G.cid].pen||0)+3;
    const msg='Finansal Fair Play Cezası: Kasa -30 M altına düştüğü için -3 Lig Puanı kesildi!';
    G.news=[msg,...(G.news||[])].slice(0,6);
    if(!silent)toast(msg,'bad',4200);
  }

  const recBase=14+G.fac[0]*1.5+G.stf[0]*1.5+(G.trn===2?7:0);
  DB.pl.filter(x=>x.c===G.cid).forEach(x=>{
    if(x.i)x.i--;
    const rested=playedIds&&!playedIds.has(x.id)?6:0;
    x.k=Math.min(100,Math.round(x.k+recBase+rested));
    if(x.a<=22&&playedIds&&playedIds.has(x.id)&&x.o<(x.pot||85)){
      x.xp=(x.xp||0)+2;
      if(x.xp>=10){
        x.xp-=10;x.o=Math.min(94,x.o+1);getAttrs(x);
        G.growthAlerts=[`Parlayan Genç: ${x.n} maç tecrübesiyle OVR ${x.o-1} → ${x.o} (Pot ${x.pot})`,...(G.growthAlerts||[])].slice(0,3);
      }
    }
  });
  fixXI(silent);

  G.wk++;G.inM=0;G.tk=0;G.ins=-1;G.capCall=-1;G.mktRef=0;G.dlOfferDone=0;
  G.microObjs=genMicroObjs();
  skipEliminatedCupWeeks();
  if(win())runAITransfers();
  const curIt=G.cal[G.wk];
  if(curIt&&curIt[0]==='l'&&curIt[1]===11)genMkt();
}

/* ==================== 60 FPS HTML5 CANVAS 2D LIVE MATCH RENDERER ==================== */
const MatchCanvas={
  rafId:null,
  myPos:[],
  opPos:[],
  bx:50,by:50,bz:0,
  trail:[],
  netRipple:{side:0,t:0},
  reset(){
    this.myPos=BXY.map(([x,y])=>({x,y}));
    this.opPos=BXY.map(([x,y])=>({x:100-x,y:100-y}));
    this.bx=50;this.by=50;this.bz=0;
    this.trail=[];
    this.netRipple={side:0,t:0};
  },
  triggerRipple(side){this.netRipple={side,t:1.0}},
  kickBall(z=1.0){this.bz=Math.max(this.bz,z)},
  start(){
    this.stop();
    if(typeof requestAnimationFrame==='undefined')return;
    const loop=()=>{this.draw();this.rafId=requestAnimationFrame(loop)};
    this.rafId=requestAnimationFrame(loop);
  },
  stop(){if(this.rafId){cancelAnimationFrame(this.rafId);this.rafId=null}},
  draw(){
    const cv=$('pitch-cv');
    const M=G&&G.m;
    if(!cv||!M)return;
    const dpr=Math.min(2,window.devicePixelRatio||1);
    const rect=cv.getBoundingClientRect();
    const W=Math.max(260,Math.round(rect.width||360));
    const H=215;
    if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){
      cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
    }
    const ctx=cv.getContext('2d');if(!ctx)return;
    ctx.save();ctx.scale(dpr,dpr);

    const padX=14,padY=10,pw=W-padX*2,ph=H-padY*2;
    const px=v=>padX+(v/100)*pw;
    const py=v=>padY+(v/100)*ph;

    const stripes=10;
    for(let i=0;i<stripes;i++){
      ctx.fillStyle=i%2===0?'#1b733d':'#1f7f44';
      ctx.fillRect((W/stripes)*i,0,(W/stripes)+1,H);
    }

    if(M.focus===1){
      ctx.fillStyle='rgba(250,204,21,0.14)';
      ctx.fillRect(padX,padY,pw,ph*0.24);
      ctx.fillRect(padX,padY+ph*0.76,pw,ph*0.24);
    }else if(M.focus===2){
      ctx.fillStyle='rgba(56,189,248,0.14)';
      ctx.fillRect(padX+pw*0.20,padY+ph*0.30,pw*0.66,ph*0.40);
    }else if(M.focus===3){
      ctx.fillStyle='rgba(16,185,129,0.20)';
      ctx.fillRect(padX+pw*0.78,padY+ph*0.16,pw*0.22,ph*0.68);
    }

    ctx.strokeStyle='rgba(255,255,255,0.68)';
    ctx.lineWidth=1.4;
    ctx.strokeRect(padX,padY,pw,ph);
    ctx.beginPath();ctx.moveTo(W/2,padY);ctx.lineTo(W/2,padY+ph);ctx.stroke();
    ctx.beginPath();ctx.arc(W/2,H/2,ph*0.16,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(W/2,H/2,2.2,0,Math.PI*2);ctx.fill();
    ctx.strokeRect(padX,padY+ph*0.21,pw*0.15,ph*0.58);
    ctx.strokeRect(padX,padY+ph*0.35,pw*0.055,ph*0.30);
    ctx.strokeRect(padX+pw-pw*0.15,padY+ph*0.21,pw*0.15,ph*0.58);
    ctx.strokeRect(padX+pw-pw*0.055,padY+ph*0.35,pw*0.055,ph*0.30);

    const drawGoal=(isRight)=>{
      const gx=isRight?padX+pw:padX-8;
      const gy=padY+ph*0.38,gh=ph*0.24,gw=8;
      const rip=(this.netRipple.t>0&&((isRight&&this.netRipple.side===1)||(!isRight&&this.netRipple.side===-1)))?Math.sin(this.netRipple.t*28)*3.5*this.netRipple.t:0;
      ctx.fillStyle='rgba(255,255,255,0.16)';
      ctx.strokeStyle='#f8fafc';ctx.lineWidth=2;
      ctx.beginPath();
      if(isRight){ctx.moveTo(gx,gy);ctx.quadraticCurveTo(gx+gw+rip,gy+gh/2,gx+gw,gy+gh);ctx.lineTo(gx,gy+gh)}
      else{ctx.moveTo(gx+gw,gy);ctx.quadraticCurveTo(gx+rip,gy+gh/2,gx,gy+gh);ctx.lineTo(gx+gw,gy+gh)}
      ctx.closePath();ctx.fill();ctx.stroke();
    };
    drawGoal(false);drawGoal(true);
    if(this.netRipple.t>0)this.netRipple.t=Math.max(0,this.netRipple.t-0.025);

    if(M.isNight){
      const vig=ctx.createRadialGradient(W/2,H/2,ph*0.28,W/2,H/2,W*0.66);
      vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(4,10,18,0.46)');
      ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);
      [[0,0],[W,0],[0,H],[W,H]].forEach(([fx,fy])=>{
        const lg=ctx.createRadialGradient(fx,fy,2,fx,fy,85);
        lg.addColorStop(0,'rgba(255,250,210,0.22)');lg.addColorStop(1,'rgba(255,250,210,0)');
        ctx.fillStyle=lg;ctx.fillRect(0,0,W,H);
      });
    }

    const now=Date.now()*0.0025;
    const slots=SLOTS[G.f]||SLOTS['4-3-3'];
    const planShift=M.plan===0?-9:M.plan===2?10:0;
    const opShift=M.os===0?9:M.os===2?-10:M.os===3?-4:2;
    const sh=(M.bx-50)*0.28;
    const lerpRate=M.paused?0.05:0.14;

    const [myC1,myC2]=clubColors(G.cid);
    const [opC1,opC2]=clubColors(M.n.op);
    let carX=M.bx,carY=M.by;

    for(let i=0;i<11;i++){
      const wX=Math.sin(now+i*1.3)*1.4;
      const wY=Math.cos(now*0.9+i*1.7)*1.6;
      const sl=slots[i]||{x:50,y:50,pos:2};
      const tMyX=sl.pos===0?5.5:C((100-sl.y)*0.72+5+planShift+sh+wX,8,92);
      const tMyY=C(sl.x+wY,8,92);
      if(!this.myPos[i])this.myPos[i]={x:tMyX,y:tMyY};
      this.myPos[i].x+=(tMyX-this.myPos[i].x)*lerpRate;
      this.myPos[i].y+=(tMyY-this.myPos[i].y)*lerpRate;

      const bp=BXY[i]||[50,50];
      const opFwdExtra=(M.os===3&&i>=8)?8:0;
      const tOpX=i===0?94.5:C(100-bp[0]-opShift-opFwdExtra+sh-wX,8,92);
      const tOpY=C(100-bp[1]-wY,8,92);
      if(!this.opPos[i])this.opPos[i]={x:tOpX,y:tOpY};
      this.opPos[i].x+=(tOpX-this.opPos[i].x)*lerpRate;
      this.opPos[i].y+=(tOpY-this.opPos[i].y)*lerpRate;

      if(M.carrier&&M.carrier.team==='my'&&M.carrier.idx===i&&M.xi[i]!==null){carX=this.myPos[i].x;carY=this.myPos[i].y}
      if(M.carrier&&M.carrier.team==='op'&&M.carrier.idx===i){carX=this.opPos[i].x;carY=this.opPos[i].y}
    }

    const targetBX=M.inBuildup?M.bx:C(carX+(M.carrier&&M.carrier.team==='my'?2.4:-2.4),3,97);
    const targetBY=M.inBuildup?M.by:carY;
    const distMove=Math.hypot(targetBX-this.bx,targetBY-this.by);
    if(distMove>14)this.bz=Math.max(this.bz,Math.min(1.0,distMove/36));
    this.bx+=(targetBX-this.bx)*(M.inBuildup?0.24:0.20);
    this.by+=(targetBY-this.by)*(M.inBuildup?0.24:0.20);
    if(this.bz>0)this.bz=Math.max(0,this.bz-0.065);

    this.trail.push({x:this.bx,y:this.by});
    if(this.trail.length>12)this.trail.shift();

    if(this.trail.length>2){
      for(let i=1;i<this.trail.length;i++){
        const a=(i/this.trail.length)*0.48;
        ctx.strokeStyle=`rgba(254,240,138,${a.toFixed(2)})`;
        ctx.lineWidth=1.5+(i/this.trail.length)*2.2;
        ctx.beginPath();ctx.moveTo(px(this.trail[i-1].x),py(this.trail[i-1].y));ctx.lineTo(px(this.trail[i].x),py(this.trail[i].y));ctx.stroke();
      }
    }

    const drawPlayer=(xPct,yPct,c1,c2,num,isCarrier,stamina,isGK)=>{
      const cx=px(xPct),cy=py(yPct);
      ctx.fillStyle='rgba(0,0,0,0.34)';ctx.beginPath();ctx.ellipse(cx,cy+6.5,6.5,3,0,0,Math.PI*2);ctx.fill();
      if(isCarrier){
        const pulse=9.5+Math.sin(now*3.5)*2;
        ctx.strokeStyle='rgba(250,204,21,0.92)';ctx.lineWidth=2.2;
        ctx.beginPath();ctx.arc(cx,cy,pulse,0,Math.PI*2);ctx.stroke();
      }
      if(stamina!==null){
        const stCol=stamina<52?'#ef4444':stamina<70?'#f59e0b':'#34d399';
        ctx.strokeStyle=stCol;ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(cx,cy,9.2,Math.PI*0.18,Math.PI*(0.18+0.64*(C(stamina,0,100)/100)));ctx.stroke();
      }
      ctx.fillStyle=isGK?'#f59e0b':c1;ctx.strokeStyle=isGK?'#111827':c2;ctx.lineWidth=1.8;
      ctx.beginPath();ctx.arc(cx,cy,7.2,0,Math.PI*2);ctx.fill();ctx.stroke();
      ctx.fillStyle=isGK?'#111827':'#ffffff';
      ctx.font='900 7.5px -apple-system,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(String(num),cx,cy+0.5);
    };

    for(let i=0;i<11;i++){
      const isOpCar=M.carrier&&M.carrier.team==='op'&&M.carrier.idx===i;
      drawPlayer(this.opPos[i].x,this.opPos[i].y,opC1,opC2,i+1,isOpCar,null,i===0);
    }
    for(let i=0;i<11;i++){
      const pid=M.xi[i];if(pid===null||pid===undefined)continue;
      const pl=DB.pl[pid];
      const isMyCar=M.carrier&&M.carrier.team==='my'&&M.carrier.idx===i;
      drawPlayer(this.myPos[i].x,this.myPos[i].y,myC1,myC2,pl?pl.no:(i+1),isMyCar,pl?pl.k:100,i===0);
    }

    const bpx=px(this.bx),bpy=py(this.by);
    const lift=this.bz*10,br=4.2+this.bz*2.2;
    ctx.fillStyle='rgba(0,0,0,0.42)';ctx.beginPath();ctx.ellipse(bpx+1.5,bpy+3.5,4.2,2.2,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffffff';ctx.strokeStyle='#111827';ctx.lineWidth=1.4;
    ctx.beginPath();ctx.arc(bpx,bpy-lift,br,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.restore();
  }
};

    S(`
      <div class="ed-card">

function derbyChoice(st){
  SFX.tap();G.derby.stance=st;
  if(st===1){addRep('med',2);G.mods=G.mods.filter(m=>m.id!=='hype');G.mods.push({id:'hype',w:1})}
  else if(st===2){G.med=C(G.med+2,0,100)}
  else if(st===3){G.fans=C(G.fans+3,0,100);addRep('ply',1)}
  play();
}

function addLog(tag,text){const M=G.m;if(!M)return;M.log.push({m:M.min,tag,text})}
function adjRating(pid,delta){
  const M=G.m;if(!M||pid===null||pid===undefined)return;
  if(M.ratings[pid]===undefined)M.ratings[pid]=6.5;
  M.ratings[pid]=+C(M.ratings[pid]+delta,1.0,10.0).toFixed(1);
}

function showPitchBanner(title,sub,cls='goal',dur=1200){
  const M=G.m;if(!M)return;

}

function showLowerThirdGoal(isMyGoal,scorer,assist,min){
  const el=$('lt-goal');if(!el)return;

      ${clubCrestSVG(cid,26)}

        <div style="font-size:10px;font-weight:900;letter-spacing:.08em;color:${isMyGoal?'#4ade80':'#fca5a5'}">${isMyGoal?'GOOOOL!':'GOL YEDİN'} · ${min}’</div>
        <div style="font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${E(scorer)}${assist?` <span style="opacity:.78;font-weight:600;font-size:11.5px">(Asist: ${E(assist)})</span>`:''}</div>

function triggerGoalCinematic(isMyGoal,label,assistName='',isLate=false){
  const M=G.m;if(!M)return;
  M.bx=isMyGoal?96:4;M.by=50;
  MatchCanvas.triggerRipple(isMyGoal?1:-1);
  M.slowMoUntil=Date.now()+700;
  showLowerThirdGoal(isMyGoal,label,assistName,M.min);
  const title=isMyGoal?(isLate?'SON DAKİKA GOLÜ!':'GOOOOL!'):'GOL YEDİN';
  showPitchBanner(title,label,isMyGoal?'goal':'concede',1050);
  const pt=$('pt-wrap');
  if(pt){
    pt.classList.remove('shake');void pt.offsetWidth;pt.classList.add('shake');
    addUiTo(()=>{const p2=$('pt-wrap');if(p2)p2.classList.remove('shake')},480);
  }
  if(isMyGoal&&G.sq<40)addLog('kart',`Soyunma odası gergin: ${label} gol sonrası kutlama yerine arkadaşlarıyla tartıştı!`);
  if(!M.paused&&!M.inMg&&!M.inHt&&M.min<90&&M.min!==45){
    go();
    addTo(()=>{if(G&&G.m&&!G.m.paused&&!G.m.inMg&&!G.m.inHt&&G.m.min<90&&G.m.min!==45)go()},720);
  }
}

function cancelBuildUp(){
  const M=G&&G.m;if(!M||!M.inBuildup)return;
  clearTimers();M.inBuildup=false;M.banner=null;
  addLog('taktik','Atak duraklatma sırasında kesildi.');
}

function startBuildUp(isMyAttack){
  const M=G.m;if(!M||M.inBuildup)return;
  clearTimers();M.inBuildup=true;
  SFX.swell();MatchCanvas.kickBall(0.8);
  const title=M.focus===1?'CEZA SAHASINA ORTA!':(isMyAttack?'TEHLİKELİ ATAK!':'RAKİP TEHLİKELİ GELİYOR!');
  const subTxt=isMyAttack?`${CN(G.cid)} ceza sahasına yüklendi...`:`${CN(M.n.op)} kaleye sokuluyor...`;
  M.banner={title,sub:subTxt,cls:'buildup',until:Date.now()+1250};
  M.carrier={team:isMyAttack?'my':'op',idx:P([8,9,10])};
  let step=0;
  const startX=isMyAttack?Math.max(58,M.bx):Math.min(42,M.bx);
  const targetX=isMyAttack?91:9;
  addIv(()=>{
    if(!G||!G.m||!G.m.inBuildup)return;
    step++;const u=step/5;
    M.bx=startX+(targetX-startX)*u;
    M.by=M.focus===1?(isMyAttack?18+u*30:82-u*30):50+Math.sin(step*1.1)*12;
    updateMatchUI();
  },200);

  addTo(()=>{
    if(!G||!G.m||!G.m.inBuildup)return;
    clearTimers();M.inBuildup=false;M.banner=null;
    const roll=Math.random();
    if(isMyAttack){
      const scorerObj=pickScorerObj();
      const assisterObj=pickAssisterObj(scorerObj?scorerObj.id:null);
      M.sh++;M.xgF=+(M.xgF+(roll<0.56?R(22,40)/100:R(10,22)/100)).toFixed(2);
      SFX.kick();MatchCanvas.kickBall(1.0);
      if(roll<0.56){
        M.sotF++;
        if(scorerObj){if(scorerObj.tp===4)M.fl.wk=1;scorerObj.g=(scorerObj.g||0)+1;adjRating(scorerObj.id,1.1)}
        if(assisterObj){assisterObj.ast=(assisterObj.ast||0)+1;adjRating(assisterObj.id,0.5)}
        M.gf++;M.evMarks.push({m:M.min,type:'gf'});SFX.goal();
        const isLate=M.min>=85;if(isLate)M.fl.late=1;
        const sName=scorerObj?scorerObj.n:'Golcü';
        const aName=assisterObj?assisterObj.n.split(' ').pop():'';
        addLog('gol',`${sName} ağları sarstı!${aName?` (Asist: ${aName})`:''}`);
        triggerGoalCinematic(true,sName,aName,isLate);
      }else if(roll<0.74){
        SFX.post();if(scorerObj)adjRating(scorerObj.id,0.3);
        showPitchBanner('DİREKTEN DÖNDÜ!',scorerObj?scorerObj.n:'','post',1050);
        addLog('direk',`${scorerObj?scorerObj.n:'Forvet'} şutu üst direkten döndü!`);
        M.mo=C(M.mo+4,8,92);updateMatchUI();schedulePostBuildupResume();
      }else{
        M.sotF++;SFX.save();
        showPitchBanner('KALECİ KURTARDI!',`${CN(M.n.op)} kalecisi çeldi`,'save',1050);
        addLog('kurt',`${scorerObj?scorerObj.n:'Hücum'} vuruşunu rakip kaleci parmak ucuyla çıkardı.`);
        updateMatchUI();schedulePostBuildupResume();
      }
    }else{
      const gk=getMyGK();
      M.sa++;M.xgA=+(M.xgA+(roll<0.56?R(20,38)/100:R(9,22)/100)).toFixed(2);
      SFX.kick();MatchCanvas.kickBall(1.0);
      if(roll<0.56){
        M.sotA++;M.ga++;M.evMarks.push({m:M.min,type:'ga'});
        if(gk)adjRating(gk.id,-0.4);
        M.xi.forEach(id=>{const p=id!==null?DB.pl[id]:null;if(p&&p.p===1)adjRating(p.id,-0.3)});
        SFX.concede();addLog('yenilen',`${CN(M.n.op)} gol buldu.`);
        triggerGoalCinematic(false,CN(M.n.op),'',false);
      }else if(roll<0.74){
        SFX.post();showPitchBanner('DİREKTEN DÖNDÜ!',`${CN(M.n.op)} direğe takıldı!`,'post',1050);
        addLog('direk',`${CN(M.n.op)} şutu direkten oyun alanına döndü!`);
        updateMatchUI();schedulePostBuildupResume();
      }else{
        M.sotA++;SFX.save();if(gk)adjRating(gk.id,0.6);
        showPitchBanner('KALECİ KURTARDI!',gk?gk.n:'Müthiş Refleks','save',1050);
        addLog('kurt',`${gk?gk.n:'Kalecin'} tehlikeli şutu harika kurtardı!`);
        M.mo=C(M.mo+4,8,92);updateMatchUI();schedulePostBuildupResume();
      }
    }
    if(M.min===45){clearTimers();SFX.whistle();return halftime()}
    if(M.min>=90){clearTimers();SFX.whistle();return fin2()}
  },1200);
}

function schedulePostBuildupResume(){
  addTo(()=>{if(G&&G.m&&!G.m.paused&&!G.m.inMg&&!G.m.inHt&&G.m.min<90&&G.m.min!==45)go()},700);
}

function handleRedCard(p,reasonTxt){
  const M=G.m;if(!M||!p)return;
  M.rc++;M.fl.red=1;M.ba-=0.24;M.bd+=0.20;
  M.redIds.push(p.id);adjRating(p.id,-1.5);
  const idx=M.xi.indexOf(p.id);
  const wasGK=(idx===0||p.p===0);
  if(idx>=0)M.xi[idx]=null;
  M.evMarks.push({m:M.min,type:'rc'});
  SFX.card();addLog('kart-r',`${p.n} ${reasonTxt} (1 maç ceza)!`);
  if(wasGK){
    cancelBuildUp();clearTimers();M.paused=true;M.gkRedAlert=true;
    toast(`KALECİ KIRMIZI KART: ${p.n} atıldı! Hemen kaleye oyuncu almalısın.`,'bad',4200);
    updateMatchUI();openSub(undefined,true);
  }else{showPitchBanner('KIRMIZI KART',p.n,'card',1300)}
}

function issueYellowCard(p){
  const M=G.m;if(!M||!p)return;
  M.yellowIds=M.yellowIds||[];
  if(M.yellowIds.includes(p.id)){handleRedCard(p,'ikinci sarı karttan KIRMIZI gördü')}
  else{
    M.yellowIds.push(p.id);M.yc++;adjRating(p.id,-0.5);
    M.evMarks.push({m:M.min,type:'yc'});SFX.card();
    addLog('kart',`${p.n} sarı kart gördü.`);
  }
}

function pickWeightedMiniGame(prevType,plan,focus){
  const weights={dt:9,cnt:9,ref:15,save:16,corner:9,press:8,kart:10,opp:9,wall:12,offside:12,dribble:9,kdist:8};
  if(G.ins===1||focus===1){weights.corner+=10;weights.kdist+=8}
  if(G.ins===2||G.sty===0||plan===2){weights.press+=10}
  if(G.agg===2){weights.kart+=14}
  if(G.sty===3){weights.cnt+=8;weights.dribble+=6}
  if(prevType&&weights[prevType])weights[prevType]=Math.max(1,Math.floor(weights[prevType]*0.15));
  const entries=Object.entries(weights);
  const total=entries.reduce((s,[,w])=>s+w,0);
  let r=Math.random()*total;
  for(const [k,w] of entries){r-=w;if(r<=0)return k}
  return 'dt';
}

function buildOtherGames(n){
  if(n.t!=='l')return[];
  const rk=rank();
  const keySet=new Set([...rk.slice(0,4),...rk.slice(-3)]);
  return G.fx[n.r].filter(([h,a])=>h!==G.cid&&a!==G.cid).map(([h,a])=>{
    const[fg,ag]=sim(h,a);
    const events=[];
    for(let i=0;i<fg;i++)events.push({m:R(4,89),side:'h'});
    for(let i=0;i<ag;i++)events.push({m:R(4,89),side:'a'});
    events.sort((x,y)=>x.m-y.m);
    return{h,a,hg:0,ag:0,fg,agFinal:ag,events,important:keySet.has(h)||keySet.has(a)};
  });
}

function play(){
  clearTimers();clearUiTimers();mdx();
  const n=nx(),os=(n.op*3+G.wk+G.season)%4,sc=scoutInfo(n.op);
  const dc=diffCfg();
  const homeBonus=(n.home&&G.fans>=35&&!hm('prot'))?2.5:-2.5;
  const d=tstr(G.cid)-(tstr(n.op)+dc.aiBoost)+homeBonus;
  const ad=adv(G.sty,os);
  const advMult=G.scen==='tactician'?0.16:0.08;

  G.inM=1;
  if(G.trn===2)DB.pl.forEach(x=>{if(x.c===G.cid)x.k=Math.min(100,x.k+6)});

  let lf=C(1.28*Math.exp(d/20)*(1+advMult*ad),0.20,4.2);
  let la=C(1.28*Math.exp(-d/20)*(1-advMult*ad),0.20,4.2);

  if(n.home&&!hm('prot')){
    la*=Math.max(0.88,1-G.fac[3]*0.02);
    if(G.fans>85){lf*=1.06;la*=0.94}
  }
  if(hm('split'))lf*=0.90;
  if(hm('hype'))lf*=1.08;
  if(hm('prot')&&n.home){lf*=0.92;la*=1.06}

  const isDerby=n.t==='l'&&(rank().indexOf(n.op)<4||DB.clubs[n.op].s>=78);
  const isNight=(n.t==='e'||isDerby);
  let startMo=50;
  const matchXI=G.xi.slice();
  const ratings={};
  matchXI.forEach(id=>{if(id!==null&&id!==undefined)ratings[id]=6.5});

  MatchCanvas.reset();

  const M=G.m={
    n,os,isNight,xi:matchXI,playedIds:matchXI.filter(id=>id!==null&&id!==undefined),redIds:[],yellowIds:[],
    ratings,otherGames:buildOtherGames(n),tickerText:'',
    min:0,gf:0,ga:0,xgF:0,xgA:0,sotF:0,sotA:0,log:[],bx:50,by:50,carrier:{team:'my',idx:6},
    sub:0,yc:hm('disc')?-1:0,rc:0,fl:{},gkRedAlert:false,
    ba:(G.trn===0?0.12:0)+0.05*G.agg,
    bd:G.trn===1?-0.12:0,
    lf,la,ps:0,sh:0,sa:0,mo:startMo,banner:null,
    speed:SETTINGS.defaultSpeed||1,paused:false,plan:1,ctrlTab:0,inMg:false,inHt:false,inBuildup:false,lateAutoSlow:false,
    focus:0,weakFocus:sc.recFocus,weakName:sc.weakName,hitWeak:false,
    shoutCd:0,shoutBoost:0,shoutCalm:0,shoutWaste:0,
    subsUsed:[],momHist:[{m:0,v:startMo}],evMarks:[],penRes:null,
    mgCombo:0,perfectMg:0,slowMoUntil:0,tacticSwitched:false,trailDown:false
  };
  if(G.derby&&G.derby.stance===3&&n.home){M.la*=0.92;M.mo=59;M.momHist[0].v=59;addLog('taktik','Tribün atmosferi rakibi baskı altına aldı (-%8 rakip hücum).')}
  if(G.ins===0){M.la*=0.85;M.yc+=1}
  else if(G.ins===1)M.ba+=0.20;
  else if(G.ins===2)M.ba+=0.28;
  else if(G.ins===3){M.la*=0.88;M.lf*=0.95}

  if(G.capCall===0){M.ba+=0.14;addLog('taktik','Kaptan soyunma odasında takımı ateşledi (+Hücum).')}
  else if(G.capCall===1){M.yc=Math.max(-2,M.yc-1);M.bd-=0.08;addLog('taktik','Kaptan disiplin konuşması yaptı (-Kart riski).')}

  const cntMg=R(4,5);
  const mins=[13,27,41,57,72,83].sort(()=>Math.random()-0.5).slice(0,cntMg).sort((a,b)=>a-b);
  const sch=[];let prevT=null;
  for(let j=0;j<cntMg;j++){
    const pick=pickWeightedMiniGame(prevT,M.plan,M.focus);
    prevT=pick;sch.push({m:mins[j]+R(-3,3),t:pick});
  }
  M.sch=sch.sort((a,b)=>a.m-b.m);

  const attTxt=n.home?` · Seyirci: ${Math.round(stadiumCap()*fill()/100).toLocaleString('tr-TR')}`:'';
  addLog('taktik',`Maç başladı${attTxt}. Rakip zaafı: ${sc.weakName}.`);

  const tCls=n.t==='e'?'euro':isDerby?'derby':'';
  const tTitle=n.t==='e'?'AVRUPA KUPASI GECESİ':isDerby?'DERBİ ATMOSFERİ':'SAHAYA ÇIKIŞ · İLK 11';
  const slots=SLOTS[G.f]||SLOTS['4-3-3'];
  const xiCards=M.xi.map((pid,idx)=>{
    const p=pid!==null?DB.pl[pid]:null;if(!p)return'';
    return`<div class="tunnel-p">${jerseySVG(G.cid,p.no||idx+1,false,slots[idx]&&slots[idx].pos===0)}<div style="margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${E(p.n.split(' ').pop())}</div><span style="opacity:.75;font-size:9px">${slots[idx]?slots[idx].role:PN[p.p]} · ${p.o}</span></div>`;
  }).join('');

  S(`
    <div class="tunnel-card ${tCls}" onclick="startKickoffNow()">
      <div class="r">
        <span class="bd">${ico(n.t==='e'?'globe':isDerby?'flame':'ball',12)} ${tTitle}</span>
        <span class="bd">Diziliş: ${G.f}</span>
      </div>
      <div class="r" style="margin:10px 0 6px;justify-content:center;gap:14px">
        <div class="row">${clubCrestSVG(G.cid,34)} <b>${E(CN(G.cid))}</b></div>
        <span style="font-weight:900;opacity:.75">VS</span>
        <div class="row"><b>${E(CN(n.op))}</b> ${clubCrestSVG(n.op,34)}</div>
      </div>
      <div class="tunnel-grid">${xiCards}</div>
      <div class="m" style="text-align:center;color:rgba(255,255,255,.78);margin-top:4px">Santra vuruşu başlamak üzere...</div>
    </div>
  `);

  let started=false;
  window.startKickoffNow=()=>{
    if(started||!G||!G.m)return;
    started=true;clearTimers();SFX.whistle();
    buildMatchUI();updateMatchUI();go();
  };
  addTo(()=>window.startKickoffNow(),1400);
}

function go(){
  clearTimers();
  const M=G.m;
  if(!M||M.paused||M.inMg||M.inHt||M.inBuildup||M.min>=90)return;
  let ms=M.speed===2?170:M.speed===1.5?260:400;
  if(M.slowMoUntil&&Date.now()<M.slowMoUntil)ms=Math.round(ms*2.2);
  M.iv=addIv(tick,ms);
}

function setSpeed(sp){
  SFX.tap();const M=G.m;if(!M)return;
  if(M.inBuildup)cancelBuildUp();
  if(sp===0)M.paused=!M.paused;
  else{M.speed=sp;M.paused=false}
  if(M.paused)clearTimers();else go();
  updateMatchUI();
}
function setCtrlTab(t){SFX.tap();if(!G||!G.m)return;G.m.ctrlTab=t;updateMatchUI()}
function setPlan(p){SFX.tap();const M=G.m;if(!M||M.plan===p)return;M.plan=p;addLog('taktik',`Oyun planı: ${PLANS[p].full}`);updateMatchUI()}
function setFocus(f){
  SFX.tap();const M=G.m;if(!M||M.focus===f)return;
  M.focus=f;G.lastFocus=f;const hit=f===M.weakFocus;if(hit)M.hitWeak=true;
  addLog('taktik',`Atak yönü: ${FOCUS[f].full}${hit?' (Rakip zaafı yakalandı!)':''}`);
  updateMatchUI();
}
function shout(k){
  const M=G.m;if(!M||M.shoutCd>0)return;
  if(k===2&&(M.min<75||M.gf<=M.ga))return;
  SFX.tap();M.shoutCd=15;
  if(k===0){
    M.shoutBoost=10;
    M.xi.forEach(id=>{if(id===null)return;const p=DB.pl[id];if(p)p.k=Math.max(10,p.k-2.5)});
    addLog('taktik','Kenar talimatı: "BASTIRIN!" (Momentum +, Kondisyon -)');
  }else if(k===1){M.shoutCalm=15;addLog('taktik','Kenar talimatı: "SAKİNLEŞİN!" (Kart riski azaldı)')}
  else{M.shoutWaste=15;G.fans=C(G.fans-1,0,100);addLog('taktik','Kenar talimatı: "ZAMAN GEÇİR!" (Tempo düştü)')}
  updateMatchUI();
}

function renderSparklineSVG(M){
  const W=300,H=40,mid=H/2;
  const ptsArr=M.momHist.map(pt=>`${((pt.m/90)*W).toFixed(1)},${(H-((C(pt.v,5,95)/100)*H)).toFixed(1)}`);
  const lastX=((M.momHist[M.momHist.length-1]?.m||0)/90)*W;
  const areaPts=`0,${mid} ${ptsArr.join(' ')} ${lastX.toFixed(1)},${mid}`;
  const marks=M.evMarks.map(ev=>{
    const x=(ev.m/90)*W;
    const col=ev.type==='gf'?'#4ade80':ev.type==='ga'?'#f87171':'#ef4444';
    const cy=ev.type==='gf'?7:ev.type==='ga'?H-7:mid;
    if(ev.type==='rc')return`<rect x="${(x-2.5).toFixed(1)}" y="${(cy-4).toFixed(1)}" width="5" height="8" rx="1" fill="#ef4444" stroke="#fff" stroke-width=".7"/>`;
    if(ev.type==='yc')return`<rect x="${(x-2).toFixed(1)}" y="${(cy-3.5).toFixed(1)}" width="4" height="7" rx="1" fill="#facc15" stroke="#111" stroke-width=".6"/>`;
    return`<circle cx="${x.toFixed(1)}" cy="${cy}" r="3.2" fill="${col}" stroke="#0b1410" stroke-width="1"/>`;
  }).join('');
  return`<svg class="spark-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <line x1="0" y1="${mid}" x2="${W}" y2="${mid}" stroke="rgba(255,255,255,.22)" stroke-dasharray="3 3" stroke-width="1"/>
    <line x1="${W/2}" y1="0" x2="${W/2}" y2="${H}" stroke="rgba(255,255,255,.1)" stroke-width="1"/>
    <polygon points="${areaPts}" fill="${clubCol(G.cid)}" opacity=".32"/>
    <polyline points="${ptsArr.join(' ')}" fill="none" stroke="#4ade80" stroke-width="1.8" stroke-linejoin="round"/>
    ${marks}
  </svg>`;
}

function tick(){
  const M=G.m;if(!M||M.inBuildup||M.inMg||M.inHt)return;
  M.min++;
  if(M.gf<M.ga)M.trailDown=true;
  if(M.shoutCd>0)M.shoutCd--;
  if(M.shoutBoost>0)M.shoutBoost--;
  if(M.shoutCalm>0)M.shoutCalm--;
  if(M.shoutWaste>0)M.shoutWaste--;

  if(M.min>=82&&Math.abs(M.gf-M.ga)<=1&&!M.lateAutoSlow&&M.speed>1){
    M.lateAutoSlow=true;M.speed=1;
    addLog('taktik','82\'+ Kritik dakikalar! Heyecan için maç hızı otomatik 1x\'e çekildi.');
    toast('Kritik dakikalar! Maç hızı 1x\'e çekildi.','warn',2200);
    go();
  }

  if(M.otherGames&&M.otherGames.length){
    M.otherGames.forEach(g=>{
      g.events.forEach(ev=>{
        if(ev.m===M.min){
          if(ev.side==='h')g.hg++;else g.ag++;
          if(g.important){
            const txt=`CANLI SKOR: ${CN(g.h)} ${g.hg} - ${g.ag} ${CN(g.a)}`;
            M.tickerText=txt;addLog('skor',txt);
          }
        }
      });
    });
  }

  if(M.min%10===0){
    const drain=(M.plan===2?2.35:M.plan===0?1.55:1.95)+G.agg*0.15;
    M.xi.forEach(id=>{if(id===null||id===undefined)return;const p=DB.pl[id];if(p)p.k=Math.max(10,p.k-drain)});
  }
  if(G.ins===2&&M.min===46){
    M.ba-=0.35;
    M.xi.forEach(id=>{if(id===null||id===undefined)return;const p=DB.pl[id];if(p)p.k=Math.max(10,p.k-3)});
  }

  if(M.min===60&&!M.tacticSwitched){
    M.tacticSwitched=true;
    if(M.ga>M.gf){M.os=2;M.la-=0.10;M.ba-=0.14;addLog('taktik','Rakip hoca skoru korumak için 5\'li savunmaya çekildi!')}
    else if(M.gf>M.ga){M.os=0;M.la+=0.18;M.ba+=0.10;addLog('taktik','Rakip hoca 3\'lüye döndü, risk alıp hücuma yükleniyor!')}
    else{M.os=3;M.la+=0.08;addLog('taktik','Rakip hoca kontra atak düzenine geçti.')}
  }

  if(M.min===22||M.min===68){
    const activePl=M.xi.filter(id=>id!==null&&id!==undefined).map(id=>DB.pl[id]).filter(Boolean);
    const leader=activePl.find(x=>x.tp===0),selfish=activePl.find(x=>x.tp===1),worker=activePl.find(x=>x.tp===2);
    if(M.min===22&&leader){M.mo=C(M.mo+5,8,92);adjRating(leader.id,0.3);addLog('taktik',`Lider ${leader.n} sahada takımı topladı ve tempoyu yükseltti.`)}
    else if(M.min===68&&selfish&&Math.random()<0.6){M.ba-=0.04;adjRating(selfish.id,-0.2);addLog('taktik',`Bencil ${selfish.n} boş arkadaşına pas vermeyip kendi vurdu.`)}
    else if(worker){M.bd-=0.05;adjRating(worker.id,0.4);addLog('taktik',`Çalışkan ${worker.n} geriye koşup kritik bir top kaptı.`)}
  }

  if(M.min%18===0&&M.shoutCalm===0&&Math.random()<(0.10+G.agg*0.07+(G.ins===0?0.06:0)-(hm('disc')?0.08:0))){
    const activePl=M.xi.filter(id=>id!==null&&id!==undefined).map(id=>DB.pl[id]).filter(Boolean);
    if(activePl.length)issueYellowCard(P(activePl));
  }

  if(M.min===85){
    const closeScore=Math.abs(M.gf-M.ga)<=1;
    SFX.whistle();
    showPitchBanner('SON 5 DAKİKA',`${M.gf} - ${M.ga}`,closeScore?'concede':'goal',1400);
    addLog('taktik',closeScore?'Son 5 dakika! Nefesler tutuldu!':'Son 5 dakikaya girildi.');
  }

  const activeCount=M.xi.filter(id=>id!==null&&id!==undefined).length;
  const miss=Math.max(0,11-activeCount);
  const missA=Math.max(0.42,1-miss*0.11),missD=1+miss*0.14;
  const noGkPen=(M.xi[0]===null||M.xi[0]===undefined)?0.45:0;

  const cp=G.cap!==null&&M.xi.includes(G.cap);
  const cb=cp?(M.gf<M.ga?0.12:0.03)+(DB.pl[G.cap].tp===0?0.04:0):0;
  const sqComeback=(G.sq>80&&M.gf<M.ga)?0.26:0;
  const planA=M.plan===0?-0.42:M.plan===2?0.36:0;
  const planD=M.plan===0?-0.44:M.plan===2?0.32:0;
  const focusA=M.focus===0?0:(M.focus===M.weakFocus?0.28:0.02);
  const shoutA=M.shoutBoost>0?0.26:0;
  const wasteMod=M.shoutWaste>0?0.48:1;

  const a=Math.max(0.08,(M.lf+M.ba+cb+sqComeback+planA+focusA+shoutA)*wasteMod*missA);
  const b=Math.max(0.08,(M.la+M.bd+planD+noGkPen)*wasteMod*missD);

  M.ps+=a/(a+b+0.01);
  if(Math.random()<a/28){M.sh++;M.xgF=+(M.xgF+R(4,12)/100).toFixed(2);if(Math.random()<0.42)M.sotF++}
  if(Math.random()<b/28){M.sa++;M.xgA=+(M.xgA+R(4,12)/100).toFixed(2);if(Math.random()<0.42)M.sotA++}

  M.mo=C(M.mo*0.85+(50+(a-b)*20)*0.15,8,92);
  if(M.min%5===0)M.momHist.push({m:M.min,v:Math.round(M.mo)});

  const u=Math.random()<a/76,v=Math.random()<b/76;
  if(u)return startBuildUp(true);
  else if(v)return startBuildUp(false);

  updatePossessionVisual(M,a>=b);
  updateMatchUI();

  if(M.min===45){clearTimers();SFX.whistle();return halftime()}
  const e=M.sch[0];
  if(e&&M.min>=e.m){
    M.sch.shift();
    let mgType=e.t;
    if(M.plan===2&&Math.random()<0.35)mgType='press';
    else if(M.focus===1&&Math.random()<0.35)mgType=P(['corner','kdist']);
    if(mgType==='kart'&&M.shoutCalm>0&&Math.random()<0.65){
      addLog('taktik','Takım sakin kaldı, kart krizi önlendi.');updateMatchUI();
    }else{clearTimers();return MG.launch(mgType,false)}
  }
  if(M.min>=90){clearTimers();SFX.whistle();fin2()}
}

function doGkSub(outId,gkInId){
  SFX.tap();const M=G.m;if(!M)return;
  const idx=M.xi.indexOf(outId);if(idx>=0)M.xi[idx]=null;
  M.xi[0]=gkInId;M.ratings[gkInId]=6.5;
  if(!M.playedIds.includes(gkInId))M.playedIds.push(gkInId);
  M.sub++;M.subsUsed.push(outId);M.gkRedAlert=false;
  addLog('deg',`Acil Kaleci Değişikliği: ${DB.pl[outId].n} çıktı, ${DB.pl[gkInId].n} kaleye geçti.`);
  closeSub();
}
function moveFieldToGK(pid){
  SFX.tap();const M=G.m;if(!M)return;
  const idx=M.xi.indexOf(pid);if(idx>=0)M.xi[idx]=null;
  M.xi[0]=pid;M.gkRedAlert=false;
  addLog('taktik',`Zorunlu Hamle: ${DB.pl[pid].n} eldivenleri giyip kaleye geçti!`);
  closeSub();
}
function doSub(outId,inId){
  SFX.tap();const M=G.m,t=DB.pl[outId],y=DB.pl[inId];
  const idx=M.xi.indexOf(outId);
  if(idx>=0){
    const slot=SLOTS[G.f][idx]||{pos:t.p};
    const diff=(eff(y)*slotFit(y,slot)-eff(t)*slotFit(t,slot))/55;
    M.xi[idx]=inId;M.ratings[inId]=6.5;
    if(!M.playedIds.includes(inId))M.playedIds.push(inId);
    M.sub++;M.subsUsed.push(outId);
    if(slot.pos===3){M.lf=C(M.lf+diff*1.15,0.18,5.0);M.la=C(M.la-diff*0.15,0.18,5.0)}
    else if(slot.pos===2){M.lf=C(M.lf+diff*0.65,0.18,5.0);M.la=C(M.la-diff*0.55,0.18,5.0)}
    else{M.la=C(M.la-diff*1.15,0.18,5.0);M.lf=C(M.lf+diff*0.15,0.18,5.0)}
    const tag=diff>=0.04?'taze güç kattı':diff<=-0.08?'mevki uyumsuzluğu yarattı':'dengeli hamle';
    addLog('deg',`${t.n} (${Math.round(t.k)}%) → ${y.n} (${Math.round(y.k)}%, ${tag}).`);
  }
  closeSub();
}
function closeSub(){
  mdx();
  if(G&&G.m){G.m.paused=!!G.m._wasPaused;delete G.m._wasPaused;updateMatchUI();if(!G.m.paused)go()}
}

function penResolveSave(saved,targetCol=1,diveCol=1){

  const tx=[74,150,226][targetCol],kx=diveCol>=0?[78,150,222][diveCol]:150;
  S(`${mh()}
    <div class="mg-card">
      ${penHeaderHTML()}

  if(finished){G.m.penRes={my:P.myScore,op:P.opScore,won:P.myScore>P.opScore};addTo(()=>fin2(true),1100)}

  demoMode:false,
  demoIdx:0,
  locked:false,
  actor:null,

  pickActor(type){
    const meta=this.META[type]||this.META.dt;
    const pool=(!this.demoMode&&G&&G.m)
      ?G.m.xi.filter(id=>id!==null&&id!==undefined).map(id=>DB.pl[id]).filter(Boolean)
      :DB.pl.filter(x=>x.c===G.cid);
    ensureSetPieces();
    if(type==='dt'&&G.setPieces&&G.setPieces.fk!==null){const sp=pool.find(p=>p.id===G.setPieces.fk);if(sp)return sp}
    if(type==='corner'&&G.setPieces&&G.setPieces.ck!==null){const sp=pool.find(p=>p.id===G.setPieces.ck);if(sp)return sp}
    const matched=pool.filter(x=>meta.pos.includes(x.p)).sort((a,b)=>b.o-a.o);
    if(matched.length)return type==='kart'?P(matched):matched[0];
    return pool[0]||null;
  },

  startDemo(){
    clearTimers();clearUiTimers();mdx();TUT.stop(false);
    this.demoMode=true;this.demoIdx=0;G.inM=1;
    this.launch(this.ORDER[0],true);
  },
  exitDemo(){
    clearTimers();clearUiTimers();this.demoMode=false;
    if(G&&G._practiceOnly){G=null;menu();return}
    if(G){G.inM=0;render()}else menu();
  },
  nextDemo(){
    clearTimers();this.demoIdx++;
    if(this.demoIdx>=this.ORDER.length){
      SFX.ok();toast('Tüm 12 mini oyun tamamlandı!','ok');
      return this.exitDemo();
    }
    this.launch(this.ORDER[this.demoIdx],true);
  },

  launch(type,isDemo){
    clearTimers();clearUiTimers();
    this.demoMode=!!isDemo;this.locked=false;
    if(G&&G.m){G.m.inMg=true;G.m.banner=null}
    const meta=this.META[type]||this.META.dt;
    const actor=this.pickActor(type);
    this.actor=actor;
    const att=actor?getAttrs(actor):null;
    const keyStat=att?({dt:`ŞUT ${att.sut}`,cnt:`PAS ${att.pas}`,ref:`DEF ${att.def}`,save:`DEF ${att.def}`,corner:`PAS ${att.pas}`,press:`HIZ ${att.hiz}`,kart:`FİZ ${att.fiz}`,opp:`PAS ${att.pas}`,wall:`FİZ ${att.fiz}`,offside:`DEF ${att.def}`,dribble:`DRİ ${att.dri}`,kdist:`PAS ${att.pas}`}[type]||''):'';
    const minPrefix=(!this.demoMode&&G&&G.m)?`${G.m.min}’ · `:'';
    const actorHtml=actor?`
      <div class="mg-actor">
        ${jerseySVG(G.cid,actor.no||10,false,actor.p===0)}
        <div style="text-align:left">
          <div style="font-size:10.5px;opacity:.75;font-weight:800;text-transform:uppercase">${meta.role}</div>
          <div style="font-size:14px;font-weight:900">${E(actor.n)} <span style="opacity:.85;font-size:12px">(#${actor.no||10} · ${keyStat})</span></div>
        </div>
      </div>`:'';

    S(`${mh()}
      <div class="mg-card">
        <div class="mg-flash">
          <div class="mg-flash-ic" style="background:${meta.col}">${ico(meta.ic,34)}</div>
          <div class="big" style="font-size:22px;letter-spacing:.03em">${minPrefix}${meta.title}</div>
          ${actorHtml}
          <div style="font-size:13px;opacity:.85;font-weight:700">${meta.sub}</div>
        </div>
      </div>
    `);
    addTo(()=>{
      if(!G||!G.inM)return;
      const fn=this['play_'+type];
      if(fn)fn.call(this);else this.resumeMatch();
    },720);
  },

  finish(ok,headline,detail,onApply,extraVisual='',isPerfect=false){
    if(this.locked)return;
    this.locked=true;clearTimers();
    if(ok===true)SFX.ok();else if(ok===false)SFX.bad();

    let comboBadge='';
    if(!this.demoMode){
      if(onApply)onApply();
      if(G&&G.m){
        if(this.actor){
          if(ok===true)adjRating(this.actor.id,isPerfect?0.8:0.5);
          else if(ok===false)adjRating(this.actor.id,-0.3);
        }
        if(ok===true){
          G.m.mgCombo=(G.m.mgCombo||0)+1;
          if(isPerfect){
            G.m.perfectMg=(G.m.perfectMg||0)+1;
            const xpGain=G.m.mgCombo>=2?6:4;
            G.xp+=xpGain;
            let spTxt='';
            if(G.m.mgCombo>=3){G.sp++;spTxt=' · +1 ⭐ Kombo Bonusu!'}
            while(G.xp>=30){G.xp-=30;G.sp++}
            comboBadge=`<div style="margin-top:6px"><span class="pill pos">${ico('star',11)} MÜKEMMEL! +${xpGain} XP${spTxt}</span> <span class="pill neu">${G.m.mgCombo}x Kombo</span></div>`;
          }else if(G.m.mgCombo>=2){
            comboBadge=`<div style="margin-top:6px"><span class="pill neu">${ico('zap',11)} ${G.m.mgCombo}x Kombo Serisi</span></div>`;
          }
        }else if(ok===false)G.m.mgCombo=0;
      }
    }else if(isPerfect){
      comboBadge=`<div style="margin-top:6px"><span class="pill pos">${ico('star',11)} MÜKEMMEL VURUŞ!</span></div>`;
    }

    const bg=ok===true?'#065f46':ok===false?'#7f1d1d':'#1e3a8a';
    const ic=ok===true?'check':ok===false?'x':'zap';
    S(`${mh()}
      <div class="mg-card" style="border-color:${bg}">
        ${extraVisual}
        <div style="text-align:center;padding:12px 6px">
          <div style="display:inline-flex;align-items:center;justify-content:center;width:54px;height:54px;border-radius:16px;background:${bg};margin-bottom:8px">${ico(ic,28)}</div>
          <div class="big" style="font-size:22px">${E(headline)}</div>
          <div style="font-size:13px;opacity:.85;margin-top:4px">${E(detail)}</div>
          ${comboBadge}
          ${this.demoMode?`
            <div class="g2" style="margin-top:14px">
              <button class="x center" style="margin:0" onclick="MG.launch('${this.ORDER[this.demoIdx]}',true)">${ico('refresh',13)} Tekrar Dene</button>
              <button style="margin:0" onclick="MG.nextDemo()">${this.demoIdx<this.ORDER.length-1?'Sonraki ('+(this.demoIdx+2)+'/'+this.ORDER.length+')':'Bitir'}</button>

  resumeMatch(){

    G.m.inMg=false;buildMatchUI();updateMatchUI();

  /* 1) SÜRÜKLE-BIRAK DURAN TOP (dt) — Anlık eğri önizleme + animasyonlu top uçuşu + pointerCapture/cancel */
  play_dt(){
    const aObj=getAttrs(this.actor);
    const dc=diffCfg();
    const sutBonus=(aObj.sut-70)*0.008;
    const goalPad=C(Math.round((aObj.sut-65)*0.32),0,8);
    const keeperBias=P([-1,1]);
    const keeperX=150+keeperBias*24;
    const hasWall=Math.random()<0.65;
    const wallX=keeperBias<0?175:85;
    const [opC1,opC2]=clubColors(G&&G.m?G.m.n.op:1);
    let dragging=false,pts=[],done=false;
    const dur=Math.round(5600*dc.mgTimeMult);

    S(`${mh()}
      <div class="mg-card">
        ${mgTopBar(`ŞUT ${aObj.sut} · ${aObj.sut>=82?'Geniş Hedef':'Standart Hedef'}`,'Falso için eğri çek')}
        <div class="mg-cmd">Topun üzerinden kaleye sürükle-bırak!</div>
        <div class="mg-timer"><i id="mg-dt-tm" style="width:100%;transition:width ${dur}ms linear,background-position ${dur}ms linear"></i></div>
        <div class="mg-svg-wrap" id="mg-dt-wrap">
          <svg id="mg-dt-svg" viewBox="0 0 300 192" width="100%" height="192" style="display:block">
            <rect x="12" y="76" width="276" height="106" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
            <path d="M110 76 A40 24 0 0 0 190 76" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
            <rect x="${46-goalPad}" y="14" width="${208+goalPad*2}" height="62" fill="rgba(255,255,255,.08)" stroke="#fff" stroke-width="4"/>
            <line x1="${46-goalPad}" y1="35" x2="${254+goalPad}" y2="35" stroke="rgba(255,255,255,.16)" stroke-width="1"/>
            <line x1="${46-goalPad}" y1="55" x2="${254+goalPad}" y2="55" stroke="rgba(255,255,255,.16)" stroke-width="1"/>
            <g id="mg-dt-gk">
              <circle cx="${keeperX}" cy="52" r="12" fill="#f59e0b" stroke="#111" stroke-width="2"/>
              <text x="${keeperX}" y="56" text-anchor="middle" fill="#111" font-size="9" font-weight="900">KL</text>
            </g>
            <text x="${keeperX}" y="72" text-anchor="middle" fill="#fde047" font-size="8.5" font-weight="800">${keeperBias<0?'← Ağırlık':'Ağırlık →'}</text>
            ${hasWall?`<g>${[0,15,30].map(dx=>`<circle cx="${wallX+7+dx}" cy="108" r="8" fill="${opC1}" stroke="${opC2}" stroke-width="1.8"/>`).join('')}</g>`:''}
            <path id="mg-dt-path" d="" fill="none" stroke="#4ade80" stroke-width="3.5" stroke-dasharray="6 4"/>
            <circle id="mg-dt-aim" cx="150" cy="45" r="8" fill="rgba(74,222,128,.32)" stroke="#4ade80" stroke-width="2" style="display:none"/>
            <g id="mg-dt-ball">${mgBallSVG(150,166,9)}</g>
          </svg>
        </div>
      </div>
    `);
    addTo(()=>{const el=$('mg-dt-tm');if(el){el.style.width='0%';el.style.backgroundPosition='0% 0'}},30);

    const svgEl=$('mg-dt-svg'),pathEl=$('mg-dt-path'),aimEl=$('mg-dt-aim'),ballG=$('mg-dt-ball');
    const getPt=ev=>{
      const r=svgEl.getBoundingClientRect();
      return{x:(ev.clientX-r.left)*(300/r.width),y:(ev.clientY-r.top)*(192/r.height)};
    };

    const onDown=ev=>{
      if(done||this.locked)return;
      dragging=true;pts=[getPt(ev)];
      if(svgEl.setPointerCapture)try{svgEl.setPointerCapture(ev.pointerId)}catch(e){}
    };
    const onMove=ev=>{
      if(!dragging||done)return;
      const p=getPt(ev);pts.push(p);
      const mid=pts[Math.floor(pts.length/2)]||p;
      if(pathEl)pathEl.setAttribute('d',`M150 166 Q${mid.x.toFixed(1)} ${mid.y.toFixed(1)} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`);
      if(aimEl){aimEl.style.display='block';aimEl.setAttribute('cx',p.x.toFixed(1));aimEl.setAttribute('cy',p.y.toFixed(1))}
    };
    const onUp=ev=>{
      if(!dragging||done||this.locked)return;
      dragging=false;done=true;clearTimers();SFX.kick();
      const end=getPt(ev);
      const mid=pts[Math.floor(pts.length/2)]||end;
      const dx=end.x-150,dy=166-end.y;
      if(Math.hypot(dx,dy)<32||dy<20){
        return this.finish(false,'ZAYIF VURUŞ!','Topu kaleye doğru yeterince çekmedin.',()=>{addLog('taktik','Duran top vuruşu çok zayıf kaldı.')});
      }
      const curve=(mid.x-(150+end.x)/2);
      const finalX=end.x+curve*0.35,finalY=end.y;
      const keeperDiveX=C(keeperX+(Math.random()<0.65?keeperBias*38:-keeperBias*28),54,246);

      // Animate ball flight along Bezier curve (~340ms)
      let st=0;const tot=14;
      addIv(()=>{
        st++;const u=st/tot;
        const bx=(1-u)*(1-u)*150+2*(1-u)*u*mid.x+u*u*finalX;
        const by=(1-u)*(1-u)*166+2*(1-u)*u*mid.y+u*u*finalY-Math.sin(u*Math.PI)*16;
        const sc=1-u*0.26;
        if(ballG)ballG.innerHTML=mgBallSVG(bx,by,9*sc);
        const gkG=$('mg-dt-gk');
        if(gkG){const curKx=keeperX+(keeperDiveX-keeperX)*u;gkG.setAttribute('transform',`translate(${(curKx-keeperX).toFixed(1)},0)`)}
        if(st>=tot){
          clearTimers();
          const inGoalX=finalX>=(46-goalPad)&&finalX<=(254+goalPad);
          const inGoalY=finalY>=10&&finalY<=80;
          const hitWall=hasWall&&Math.abs(curve)<14&&finalX>=wallX&&finalX<=wallX+44&&finalY>38;
          if(hitWall)return this.finish(false,'BARAJDAN DÖNDÜ!','Falso vermeden barajın üstüne vurdun.',()=>{addLog('taktik','Frikik barajdan geri döndü.')});
          if(!inGoalX||!inGoalY){
            const near=finalX>=30&&finalX<=270&&finalY>=2&&finalY<=88;
            if(near)SFX.post();
            return this.finish(false,near?'DİREĞİ YALADI!':'AUTA GİTTİ!','Köşeyi zorlarken top çerçeve dışına çıktı.',()=>{
              G.m.sh++;G.m.xgF=+(G.m.xgF+0.12).toFixed(2);addLog(near?'direk':'taktik','Duran top az farkla auta çıktı.');
            },near?nearMissSVG('post'):'');
          }
          const distFromKeeper=Math.abs(finalX-keeperX);
          const cornerQuality=(Math.abs(finalX-150)/104)+(finalY<42?0.20:0)+(Math.abs(curve)>16?0.14:0)+sutBonus;
          const goalChance=C((dc.mgGoalCap+(cornerQuality-0.55)*0.22)*(distFromKeeper<24?0.6:1),0.14,dc.mgGoalCap+0.08);
          const saved=Math.abs(finalX-keeperDiveX)<26&&cornerQuality<0.92;
          const isGoal=!saved&&Math.random()<goalChance;
          const isPerfect=isGoal&&cornerQuality>=0.78;
          const resSvg=`<div class="mg-svg-wrap"><svg viewBox="0 0 300 90" width="100%" height="90" style="display:block"><rect x="46" y="10" width="208" height="66" fill="rgba(255,255,255,.06)" stroke="#fff" stroke-width="4"/><circle cx="${keeperDiveX.toFixed(1)}" cy="46" r="11" fill="#f59e0b" stroke="#111" stroke-width="2"/>${mgBallSVG(finalX,C(finalY,14,72),7)}</svg></div>`;
          this.finish(
            isGoal,isGoal?(isPerfect?'DOKSANA MÜKEMMEL GOL!':'GOOOOL!'):'KALECİ KURTARDI!',
            isGoal?(Math.abs(curve)>16?'Falsolu harika vuruş kaleciyi çaresiz bıraktı!':'Kalecinin ters köşesine net vuruş!'):'Kaleci parmak ucuyla uzanıp topu çıkardı.',
            ()=>{
              const M=G.m;M.sh++;M.sotF++;M.xgF=+(M.xgF+0.32).toFixed(2);
              if(isGoal){
                const s=this.actor?this.actor.n:scr();
                if(this.actor){this.actor.g=(this.actor.g||0)+1;adjRating(this.actor.id,1.1)}
                M.gf++;M.evMarks.push({m:M.min,type:'gf'});SFX.goal();
                addLog('gol',`Duran toptan ${s} ağları sarstı!`);
              }else{M.ba+=0.10;addLog('taktik','Duran topta kaleci köşeden çıkardı.')}
            },
            isGoal?resSvg:nearMissSVG('tip'),isPerfect
          );
        }
      },24);
    };

    if(svgEl){svgEl.onpointerdown=onDown;svgEl.onpointermove=onMove;svgEl.onpointerup=onUp;svgEl.onpointercancel=()=>{dragging=false}}
    addTo(()=>{
      if(!done&&!this.locked){done=true;this.finish(false,'SÜRE DOLDU!','6 saniyede vuruş yapmadın, hakem oyunu başlattı.',()=>{addLog('taktik','Duran topta zaman kaybedildi.')})}
    },dur);
  },

  /* 2) PAS ZİNCİRİ (cnt) — Kulüp renkli forma numaralı oyuncular + nabızlı hedef halkası + pas izi */
  play_cnt(){
    const aObj=getAttrs(this.actor);

    const need=scen===1?4:3;
    const dur=Math.round(C(Math.round((scen===1?4200:3700)+(aObj.pas-68)*22+(aObj.hiz-68)*12),3300,4800)*dc.mgTimeMult);
    const startTs=Date.now();
    const [myC1,myC2]=clubColors(G?G.cid:0);
    const [opC1,opC2]=clubColors(G&&G.m?G.m.n.op:1);
    const pool=[{x:48,y:134},{x:110,y:46},{x:205,y:134},{x:255,y:50},{x:155,y:92}].sort(()=>Math.random()-0.5);
    const mates=pool.slice(0,need);
    const defs=[{x:135,y:75,dx:1.5},{x:195,y:110,dx:-1.5}];
    let nextStep=1,done=false;

    const renderPitch=()=>{

      for(let i=0;i<nextStep-2;i++){
        lines+=`<line x1="${mates[i].x}" y1="${mates[i].y}" x2="${mates[i+1].x}" y2="${mates[i+1].y}" stroke="#4ade80" stroke-width="5" stroke-linecap="round"/>`;
