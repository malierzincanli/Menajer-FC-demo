<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menajer FC v8</title>
<style>
:root{
  --bg:#eaf0ec;
  --bg-grid:rgba(14,26,19,.036);
  --c:#ffffff;
  --c2:#f3f7f4;
  --t:#0f1914;
  --m:#52645a;
  --a:#157a47;
  --b:#d0dcd4;
  --ok:#0f9d68;
  --warn:#d97706;
  --bad:#dc2626;
  --gold:#ca8a04;
  --blue:#2563eb;
  --ink:#0b130f;
  --paper:#fcfbf7;
  --paper-b:#d8d2c5;
  --sheen:rgba(255,255,255,.75);
  --shadow:0 6px 22px rgba(9,20,14,.07);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#080e0b;
    --bg-grid:rgba(255,255,255,.026);
    --c:#111b16;
    --c2:#17241d;
    --t:#eef5f0;
    --m:#8da396;
    --b:#23352b;
    --ok:#10b981;
    --warn:#f59e0b;
    --bad:#ef4444;
    --gold:#facc15;
    --blue:#3b82f6;
    --ink:#070c09;
    --paper:#141d18;
    --paper-b:#2b3d33;
    --sheen:rgba(255,255,255,.09);
    --shadow:0 10px 28px rgba(0,0,0,.44);
  }
}
:root[data-theme=dark]{
  --bg:#080e0b;
  --bg-grid:rgba(255,255,255,.026);
  --c:#111b16;
  --c2:#17241d;
  --t:#eef5f0;
  --m:#8da396;
  --b:#23352b;
  --ok:#10b981;
  --warn:#f59e0b;
  --bad:#ef4444;
  --gold:#facc15;
  --blue:#3b82f6;
  --ink:#070c09;
  --paper:#141d18;
  --paper-b:#2b3d33;
  --sheen:rgba(255,255,255,.09);
  --shadow:0 10px 28px rgba(0,0,0,.44);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;
  background-color:var(--bg);
  background-image:
    radial-gradient(ellipse at top, color-mix(in srgb,var(--a) 9%,transparent) 0%, transparent 56%),
    linear-gradient(to right,var(--bg-grid) 1px,transparent 1px),
    linear-gradient(to bottom,var(--bg-grid) 1px,transparent 1px);
  background-size:100% 340px,24px 24px,24px 24px;
  background-repeat:no-repeat,repeat,repeat;
  color:var(--t);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior-y:none;
}
#app{max-width:480px;margin:auto;padding:10px 12px 96px;animation:screenIn .2s ease}
@keyframes screenIn{from{opacity:.75;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.num{font-variant-numeric:tabular-nums}
.ico{display:inline-block;vertical-align:-0.18em;flex-shrink:0}

/* Toast Notification */
#toast-box{
  position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;
  transform:translateX(-50%);z-index:120;width:calc(100% - 24px);max-width:456px;
  display:flex;flex-direction:column;gap:6px;pointer-events:none;
}
.toast{
  background:var(--ink);color:#fff;padding:10px 14px;border-radius:13px;
  font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;
  box-shadow:0 10px 28px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.15);
  animation:toastIn .22s cubic-bezier(.22,1,.36,1);pointer-events:auto;
}
.toast.ok{background:#065f46;border-color:#10b981}
.toast.bad{background:#7f1d1d;border-color:#ef4444}
.toast.warn{background:#78350f;border-color:#f59e0b}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}

/* Typography & Layout */
.lbl{
  font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--m);margin-bottom:5px;display:flex;align-items:center;gap:5px;
}
.m{color:var(--m);font-size:12.5px}
.big{font-size:23px;font-weight:800;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column;gap:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}

/* Cards — v8 Broadcast Surface Hierarchy with Top Sheen & Dynamic Accent Ribbon */
.c{
  background:var(--c);border:1px solid var(--b);border-radius:16px;
  padding:13px;margin:10px 0;
  box-shadow:var(--shadow),inset 0 1px 0 var(--sheen);
  position:relative;overflow:hidden;
  transition:border-color .18s ease,box-shadow .18s ease;
}
.c::before{
  content:"";position:absolute;top:0;left:16px;right:16px;height:2px;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--a) 45%,transparent),transparent);
  opacity:.75;pointer-events:none;
}
.c2{
  background:var(--c2);border:1px solid var(--b);border-radius:12px;
  padding:10px;margin:8px 0;
  box-shadow:inset 0 1px 0 var(--sheen);
}
.hd{
  background:linear-gradient(145deg,color-mix(in srgb,var(--a) 88%,#09150f),color-mix(in srgb,var(--a) 26%,#07100b));
  color:#fff;border-radius:18px;padding:14px;margin:8px 0 10px;
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 12px 28px rgba(0,0,0,.26),inset 0 1px 0 rgba(255,255,255,.22);
  position:relative;overflow:hidden;
}
.hd::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:
    radial-gradient(circle at 88% 12%,rgba(255,255,255,.14),transparent 42%),
    linear-gradient(to right,rgba(255,255,255,.04) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:100% 100%,18px 18px,18px 18px;
}
.hd > *{position:relative;z-index:1}
.hd .m{color:rgba(255,255,255,.80)}

/* v8 Atmospheric Landing Screen Hero */
.hero-land{
  position:relative;border-radius:20px;overflow:hidden;
  margin:6px 0 12px;min-height:178px;padding:16px;color:#fff;
  background:linear-gradient(160deg,#091b12 0%,#123d26 52%,#07130d 100%);
  border:1px solid rgba(52,211,153,.32);
  box-shadow:0 14px 34px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.22);
}
#land-cv{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.hero-land-body{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:space-between;min-height:146px}
.save-showcase{
  background:linear-gradient(140deg,color-mix(in srgb,var(--sc-col,#157a47) 75%,#09160f),#0b1610);
  color:#fff;border-radius:17px;padding:14px;margin:10px 0;
  border:1.5px solid rgba(255,255,255,.22);
  box-shadow:0 10px 26px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.2);
}
.save-showcase .m{color:rgba(255,255,255,.8)}
.land-tile{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:13px 14px;border-radius:15px;margin:8px 0;width:100%;min-height:58px;
  background:var(--c);color:var(--t);border:1px solid var(--b);
  box-shadow:var(--shadow),inset 0 1px 0 var(--sheen);
  text-align:left;cursor:pointer;
}
.land-tile-ic{
  width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--a) 14%,var(--c2));color:var(--a);flex-shrink:0;
  border:1px solid color-mix(in srgb,var(--a) 28%,transparent);
}

/* Player Jersey-Number Circular Badge (GK/Outfield Color Distinction) */
.p-badge{
  width:34px;height:34px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;
  font-weight:900;font-size:12.5px;font-variant-numeric:tabular-nums;flex-shrink:0;
  color:#fff;background:var(--pb1,var(--a));
  border:2px solid var(--pb2,rgba(255,255,255,.7));
  box-shadow:0 3px 8px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.35);
  text-shadow:0 1px 2px rgba(0,0,0,.55);
}
.p-badge.gk{
  background:linear-gradient(145deg,#f59e0b,#d97706);
  border-color:#fef08a;color:#111827;text-shadow:none;
}

/* Buttons */
button{
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:100%;margin:6px 0;padding:11px 12px;border:0;border-radius:11px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--a) 100%,#fff 8%),var(--a));
  color:#fff;font:700 13.5px inherit;cursor:pointer;
  box-shadow:0 3px 10px color-mix(in srgb,var(--a) 26%,transparent),inset 0 1px 0 rgba(255,255,255,.22);
  transition:transform .11s ease,opacity .15s,background .15s,border-color .15s;
  min-height:44px;
}
button:active{transform:scale(.972)}
button:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:none}
button.x{
  background:var(--c2);color:var(--t);border:1px solid var(--b);font-weight:600;
  justify-content:flex-start;text-align:left;box-shadow:none;
}
button.x.center{justify-content:center;text-align:center}
button.x.on{
  background:color-mix(in srgb,var(--a) 15%,var(--c2));
  border-color:var(--a);color:var(--a);
}
button.sm{
  padding:7px 10px;font-size:12px;margin:0;width:auto;min-height:36px;
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
}
button.ic{
  width:38px;height:38px;min-height:38px;padding:0;margin:0;border-radius:11px;
  background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.2);
  box-shadow:none;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
}
button.danger{background:linear-gradient(180deg,#ef4444,#b91c1c);color:#fff;box-shadow:0 3px 10px rgba(220,38,38,.3)}
button.ok-btn{background:linear-gradient(180deg,#10b981,#059669);color:#fff;box-shadow:0 3px 10px rgba(16,185,129,.3)}
select,input{
  width:100%;padding:10px 12px;border-radius:10px;
  border:1px solid var(--b);background:var(--c2);color:var(--t);
  font:14px inherit;margin:4px 0;min-height:44px;
}

/* Segmented Controls */
.seg{
  display:flex;background:var(--c2);border:1px solid var(--b);
  border-radius:11px;padding:3px;gap:3px;margin:5px 0;
}
.seg button{
  flex:1;margin:0;padding:7px 4px;border-radius:8px;min-height:36px;
  background:transparent;color:var(--m);font-size:11.5px;font-weight:700;
  line-height:1.2;border:0;box-shadow:none;justify-content:center;text-align:center;
}
.seg button.on{background:var(--a);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.22)}
.seg button.warn.on{background:var(--warn);color:#111}
.seg button.bad.on{background:var(--bad);color:#fff}

/* Sticky Alt Maç Kontrol Paneli */
.match-ctrl{
  position:sticky;bottom:0;z-index:18;
  background:var(--c);border:1px solid var(--b);border-radius:16px 16px 12px 12px;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
  margin:6px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.2);
}
.match-ctrl .seg button,
.match-ctrl #btn-sub,
.match-ctrl .g3 .x{
  min-height:44px;font-size:12px;padding:6px 6px;
}
.ctrl-tabs{
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 0 4px;
}
.ctrl-tabs button{
  min-height:38px;margin:0;padding:5px 3px;font-size:10.5px;border-radius:9px;
  background:var(--c2);color:var(--m);border:1px solid var(--b);box-shadow:none;
}
.ctrl-tabs button.on{
  background:color-mix(in srgb,var(--a) 16%,var(--c2));color:var(--a);border-color:var(--a);
}

/* Pills & Badges */
.bd{
  display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.16);
  font-size:11px;font-weight:700;white-space:nowrap;
}
.pill{
  display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;
  font-size:11px;font-weight:700;margin:2px 3px 2px 0;font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.pill.pos{background:rgba(16,185,129,.15);color:var(--ok);border:1px solid rgba(16,185,129,.38)}
.pill.neg{background:rgba(239,68,68,.15);color:var(--bad);border:1px solid rgba(239,68,68,.38)}
.pill.neu{background:rgba(245,158,11,.16);color:var(--warn);border:1px solid rgba(245,158,11,.38)}
.pill.gold{background:rgba(250,204,21,.18);color:var(--gold);border:1px solid rgba(250,204,21,.48)}
.pill.info{
  background:color-mix(in srgb,var(--a) 14%,transparent);
  color:var(--a);border:1px solid color-mix(in srgb,var(--a) 36%,transparent);
}
.pill.euro{background:rgba(37,99,235,.16);color:#60a5fa;border:1px solid rgba(59,130,246,.42)}
.pill.lg-tr{background:rgba(220,38,38,.14);color:#ef4444;border:1px solid rgba(220,38,38,.35)}
.pill.lg-en{background:rgba(124,58,237,.16);color:#a78bfa;border:1px solid rgba(139,92,246,.4)}
.pill.lg-es{background:rgba(234,88,12,.16);color:#fb923c;border:1px solid rgba(249,115,22,.4)}

/* Smart Transfer Scouting Bar & Suggestion Tags */
.scout-need-bar{
  background:linear-gradient(120deg,color-mix(in srgb,var(--a) 15%,var(--c2)),var(--c2));
  border:1px solid color-mix(in srgb,var(--a) 38%,var(--b));
  border-left:4px solid var(--a);
  border-radius:12px;padding:9px 11px;margin:8px 0;
}
.tr-tag{
  display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:6px;
  font-size:10px;font-weight:900;letter-spacing:.03em;text-transform:uppercase;
}
.tr-tag.need{background:rgba(239,68,68,.16);color:var(--bad);border:1px solid rgba(239,68,68,.4)}
.tr-tag.star{background:rgba(250,204,21,.2);color:var(--gold);border:1px solid rgba(250,204,21,.48)}
.tr-tag.youth{background:rgba(59,130,246,.16);color:#3b82f6;border:1px solid rgba(59,130,246,.42)}
.tr-tag.deal{background:rgba(16,185,129,.16);color:var(--ok);border:1px solid rgba(16,185,129,.4)}

/* Squad & Season Statistics Screen (Görev 7) */
.kpi-strip{
  display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0;
}
.kpi-box{
  background:var(--c2);border:1px solid var(--b);border-radius:12px;
  padding:8px 6px;text-align:center;box-shadow:inset 0 1px 0 var(--sheen);
}
.kpi-box .kval{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi-box .klbl{font-size:9.5px;font-weight:800;color:var(--m);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.st-row{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--c2);border:1px solid var(--b);border-radius:13px;
  padding:9px 10px;margin:6px 0;cursor:pointer;
  transition:transform .11s ease,border-color .15s;
}
.st-row:active{transform:scale(.982);border-color:var(--a)}
.st-row.xi-on{border-left:3.5px solid var(--a)}
.st-metrics{
  display:flex;align-items:center;gap:5px;flex-shrink:0;font-size:11px;font-variant-numeric:tabular-nums;
}
.st-chip{
  background:var(--c);border:1px solid var(--b);border-radius:7px;
  padding:2px 5px;font-weight:800;min-width:26px;text-align:center;
}
.st-rat{
  padding:3px 6px;border-radius:7px;font-weight:900;font-size:11.5px;min-width:36px;text-align:center;
}
.st-rat.hi{background:rgba(16,185,129,.22);color:var(--ok);border:1px solid rgba(16,185,129,.42)}
.st-rat.mid{background:rgba(245,158,11,.2);color:var(--warn);border:1px solid rgba(245,158,11,.42)}
.st-rat.lo{background:rgba(239,68,68,.2);color:var(--bad);border:1px solid rgba(239,68,68,.42)}
.st-rat.na{background:var(--c);color:var(--m);border:1px solid var(--b)}

/* 6-Step Interactive Spotlight Tutorial (Görev 3) */
.tut-mask{
  position:fixed;inset:0;z-index:95;pointer-events:auto;
  background:rgba(5,10,8,.68);backdrop-filter:blur(1.5px);
}
.tut-spot{
  position:fixed;z-index:96;pointer-events:none;border-radius:16px;
  border:2.5px solid #34d399;
  box-shadow:0 0 0 9999px rgba(5,10,8,.68),0 0 22px 4px rgba(52,211,153,.55);
  transition:all .24s cubic-bezier(.22,1,.36,1);
}
.tut-card{
  position:fixed;left:50%;transform:translateX(-50%);z-index:98;
  width:calc(100% - 24px);max-width:452px;
  background:linear-gradient(160deg,#0f2218,#0a1510);color:#fff;
  border:1.5px solid rgba(52,211,153,.6);border-radius:18px;padding:14px;
  box-shadow:0 16px 40px rgba(0,0,0,.62),inset 0 1px 0 rgba(255,255,255,.18);
  animation:pop .2s ease;
}
.tut-dots{display:flex;gap:5px;align-items:center}
.tut-dots i{width:7px;height:7px;border-radius:99px;background:rgba(255,255,255,.25);display:block;transition:width .2s,background .2s}
.tut-dots i.on{width:18px;background:#34d399}

/* Toggle Switch */
.tog-row{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:9px 11px;background:var(--c2);border:1px solid var(--b);border-radius:11px;margin:6px 0;
}
.switch{
  position:relative;width:44px;height:26px;min-height:26px;border-radius:99px;
  background:var(--b);border:0;padding:0;margin:0;cursor:pointer;flex-shrink:0;
  box-shadow:none;transition:background .2s;
}
.switch.on{background:var(--a)}
.switch::after{
  content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;
  border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);
  transition:transform .2s;
}
.switch.on::after{transform:translateX(18px)}

/* Status Bars */
.bar-wrap{margin:7px 0}
.bar-hd{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;margin-bottom:3px;gap:6px}
.bar-val{font-weight:800;font-variant-numeric:tabular-nums}
.br{height:7px;background:var(--b);border-radius:99px;overflow:hidden}
.br i{display:block;height:100%;border-radius:99px;transition:width .35s ease,background .35s ease}
.bar-bad i{background:var(--bad)}
.bar-ok i{background:var(--ok)}
.bar-norm i{background:var(--a)}
.bar-warn i{background:var(--warn)}

/* Assistant Advice Banner */
.asst-band{
  background:linear-gradient(90deg,color-mix(in srgb,var(--a) 13%,var(--c)),var(--c));
  border:1px solid color-mix(in srgb,var(--a) 35%,var(--b));
  border-left:4px solid var(--a);
  border-radius:13px;padding:10px 12px;margin:8px 0;box-shadow:var(--shadow);
}

/* Ultimatum, Debt & Modifiers */
.ult-banner{
  background:linear-gradient(135deg,#991b1b,#5c1010);color:#fff;
  border-radius:14px;padding:11px 13px;margin:8px 0;
  border:1px solid #ef4444;box-shadow:0 4px 16px rgba(239,68,68,.28);
  animation:pulseBorder 2s infinite;
}
.debt-banner{
  background:linear-gradient(135deg,#78350f,#451a03);color:#fff;
  border-radius:14px;padding:11px 13px;margin:8px 0;
  border:1px solid #f59e0b;box-shadow:0 4px 14px rgba(245,158,11,.25);
}
@keyframes pulseBorder{
  0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.42)}
  50%{box-shadow:0 0 0 6px rgba(239,68,68,0)}
}
@keyframes shake{
  0%,100%{transform:translate3d(0,0,0)}
  15%{transform:translate3d(-6px,-2px,0)}
  30%{transform:translate3d(6px,2px,0)}
  45%{transform:translate3d(-5px,2px,0)}
  60%{transform:translate3d(5px,-2px,0)}
  75%{transform:translate3d(-3px,1px,0)}
}
.pt-cv-wrap.shake{animation:shake .44s cubic-bezier(.36,.07,.19,.97) both}
@keyframes glowUp{
  0%{box-shadow:0 0 0 0 rgba(16,185,129,.65);transform:scale(.97)}
  50%{box-shadow:0 0 22px 4px rgba(16,185,129,.45);transform:scale(1.015)}
  100%{box-shadow:0 0 0 0 rgba(16,185,129,0);transform:scale(1)}
}
.growth-card{
  background:linear-gradient(135deg,rgba(16,185,129,.18),rgba(59,130,246,.12));
  border:1.5px solid #10b981;border-radius:13px;padding:10px 12px;margin:6px 0;
  animation:glowUp 1.2s ease;
}
.deadline-banner{
  background:linear-gradient(135deg,#991b1b,#b45309);color:#fff;

}
.mb{
  background:linear-gradient(90deg,rgba(245,158,11,.13),transparent);
  border:1px solid var(--b);border-left:3.5px solid var(--warn);
  border-radius:11px;padding:8px 10px;margin:6px 0;
}

/* Rarity Metallic Card Themes */
.rar-bronze{
  background:linear-gradient(155deg,#5a351e 0%,#8c5832 42%,#3a1f10 100%) !important;
  border:1.5px solid #d49463 !important;color:#fff !important;
}
.rar-silver{
  background:linear-gradient(155deg,#334155 0%,#64748b 42%,#1e293b 100%) !important;
  border:1.5px solid #cbd5e1 !important;color:#fff !important;
}
.rar-gold{
  background:linear-gradient(155deg,#78350f 0%,#ca8a04 45%,#451a03 100%) !important;
  border:1.5px solid #fde047 !important;color:#fff !important;
}
.rar-elite{
  background:linear-gradient(145deg,#062c22 0%,#0f766e 38%,#1e1b4b 76%,#713f12 100%) !important;
  border:1.5px solid #34d399 !important;color:#fff !important;
  box-shadow:0 0 28px rgba(52,211,153,.28) !important;
}
.motm-card{
  border-radius:15px;padding:12px 14px;margin:8px 0;
  box-shadow:0 8px 24px rgba(0,0,0,.25);
}
.rar-tag{
  display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;
  font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;
  background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.35);color:#fff;
}

/* Editorial Sports Newspaper / Masthead Card */
.ed-card{
  background:var(--paper);border:1px solid var(--paper-b);border-radius:14px;
  overflow:hidden;margin:10px 0;box-shadow:var(--shadow);
}
.ed-accent{height:4px;background:var(--bad)}
.ed-accent.press{background:#1d4ed8}
.ed-accent.derby{background:#b45309}
.ed-accent.sim{background:var(--a)}
.ed-mast{
  padding:8px 14px 7px;border-bottom:3px double var(--paper-b);
  display:flex;justify-content:space-between;align-items:center;
  font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;
  color:var(--m);
}
.ed-mast strong{color:var(--t);font-family:Georgia,"Times New Roman",serif;font-size:11.5px;letter-spacing:.1em}
.ed-body{padding:14px}
.ed-kicker{
  display:inline-flex;align-items:center;gap:5px;
  font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--bad);margin-bottom:6px;
}
.ed-kicker.press{color:#2563eb}
.ed-kicker.derby{color:var(--warn)}
.ed-kicker.sim{color:var(--a)}
.ed-hl{
  font-family:Georgia,"Times New Roman",serif;
  font-size:19px;font-weight:700;line-height:1.25;margin:0 0 8px;
  letter-spacing:-.015em;color:var(--t);
}
.ed-quote{
  border-left:3px solid var(--paper-b);padding:6px 10px;margin:8px 0 12px;
  font-style:italic;color:var(--m);font-size:13px;background:rgba(127,127,127,.05);
}

/* Broadcast Match HUD */
.bcast{
  background:linear-gradient(180deg,#0a120e,#13211a);color:#fff;
  border-radius:16px;padding:10px 12px;margin:6px 0 8px;
  border:1px solid #283b30;box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12);
}
.bcast.glow{box-shadow:0 0 20px 3px rgba(250,204,21,.45);border-color:#facc15}
.bcast.pulse-urgent{border-color:#ef4444;animation:pulseBorder 1.4s infinite}
.bcast-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.team-side{display:flex;align-items:center;gap:7px;min-width:0}
.team-side.away{justify-content:flex-end;text-align:right}
.tname{font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-box{
  text-align:center;background:rgba(0,0,0,.5);
  border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:4px 10px;
}
.score-num{font-size:22px;font-weight:900;letter-spacing:.04em;font-variant-numeric:tabular-nums;line-height:1.1}
.live-min{
  font-size:11px;font-weight:800;color:#4ade80;
  display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums;
}
.live-dot{width:6px;height:6px;border-radius:50%;background:#ef4444;display:inline-block;animation:blink 1s infinite}
.live-dot.paused{background:#f59e0b;animation:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

.hud-stats{
  margin-top:8px;padding-top:7px;border-top:1px solid rgba(255,255,255,.1);
  display:flex;flex-direction:column;gap:5px;
}
.hud-stat-row{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;
}
.hud-stat-row span:last-child{text-align:right}
.hud-stat-row .mid{color:rgba(255,255,255,.6);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;text-align:center}
.poss-bar{height:6px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden;display:flex}
.poss-bar i{display:block;height:100%;transition:width .3s ease}

.ticker-bar{
  margin-top:6px;padding:5px 9px;border-radius:8px;
  background:rgba(245,158,11,.18);border:1px solid rgba(250,204,21,.45);
  color:#fef08a;font-size:11.5px;font-weight:800;display:none;
  align-items:center;gap:6px;animation:pop .24s ease;
}
.ticker-bar.show{display:flex}
.tired-bar{
  margin-top:6px;padding:5px 9px;border-radius:9px;
  background:rgba(220,38,38,.22);border:1px solid rgba(239,68,68,.55);
  color:#fecaca;font-size:11.5px;font-weight:800;display:none;
  align-items:center;justify-content:space-between;gap:8px;
}
.tired-bar.show{display:flex}
.tired-bar button{
  width:auto;min-height:28px;padding:3px 9px;margin:0;font-size:11px;
  background:#ef4444;color:#fff;border-radius:7px;flex-shrink:0;box-shadow:none;
}

.spark-box{margin-top:6px}
.spark-svg{width:100%;height:40px;display:block;border-radius:8px;background:rgba(0,0,0,.28)}

/* 60 FPS HTML5 Canvas 2D Live Pitch (215px) */
.pt-cv-wrap{
  position:relative;height:215px;border-radius:15px;overflow:hidden;margin:6px 0;
  border:2px solid rgba(255,255,255,.42);background:#165c32;
  box-shadow:inset 0 0 26px rgba(0,0,0,.38),0 6px 20px rgba(0,0,0,.25);
}
#pitch-cv{display:block;width:100%;height:215px}
.gb{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font:900 20px inherit;letter-spacing:.06em;color:#fff;text-align:center;padding:8px;
  text-shadow:0 3px 12px #000;background:rgba(8,14,11,.68);z-index:5;animation:pop .22s ease;
  pointer-events:none;
}
.gb.goal{background:linear-gradient(90deg,rgba(6,95,70,.82),rgba(16,185,129,.75))}
.gb.concede{background:linear-gradient(90deg,rgba(127,29,29,.82),rgba(220,38,38,.75))}
.gb.save{background:linear-gradient(90deg,rgba(30,58,138,.82),rgba(37,99,235,.75))}
.gb.card{background:linear-gradient(90deg,rgba(153,27,27,.88),rgba(180,83,9,.80))}
.gb.buildup{background:linear-gradient(90deg,rgba(180,83,9,.52),rgba(15,23,42,.52));font-size:17px}
.gb.post{background:linear-gradient(90deg,rgba(120,53,15,.82),rgba(217,119,6,.75))}
.gb small{font-size:12px;font-weight:700;opacity:.92;letter-spacing:.02em;margin-top:2px}

.lt-goal{
  position:absolute;left:8px;right:8px;bottom:8px;z-index:7;pointer-events:none;
  background:linear-gradient(90deg,rgba(9,16,12,.94),rgba(16,32,24,.92));
  border-left:4px solid #10b981;border-radius:10px;padding:7px 11px;color:#fff;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  box-shadow:0 6px 20px rgba(0,0,0,.5);
  transform:translateY(130%);opacity:0;transition:transform .32s cubic-bezier(.22,1,.36,1),opacity .28s ease;
}
.lt-goal.show{transform:translateY(0);opacity:1}
.lt-goal.concede{border-left-color:#ef4444}
@keyframes pop{from{transform:scale(.84);opacity:0}}

/* Tünel Girişi Açılış Kadrosu */
.tunnel-card{
  background:linear-gradient(165deg,#09120d,#13281d);color:#fff;
  border-radius:18px;padding:14px;margin:8px 0;border:2px solid rgba(255,255,255,.18);
  box-shadow:0 12px 30px rgba(0,0,0,.42);animation:pop .25s ease;
}
.tunnel-card.derby{background:linear-gradient(165deg,#451a03,#7f1d1d);border-color:#f59e0b}
.tunnel-card.euro{background:linear-gradient(165deg,#0f172a,#1e3a8a);border-color:#60a5fa}
.tunnel-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.tunnel-p{
  display:flex;flex-direction:column;align-items:center;background:rgba(255,255,255,.08);
  border-radius:10px;padding:5px 3px;font-size:10px;font-weight:700;text-align:center;
}

/* Squad Pitch (450px + Selective Chemistry SVG) */
.pt2{
  position:relative;height:450px;border-radius:16px;
  background:repeating-linear-gradient(0deg,#1f7f44 0 10%,#1b733d 10% 20%);
  border:2px solid rgba(255,255,255,.5);
  box-shadow:inset 0 0 38px rgba(0,0,0,.42),var(--shadow);
  margin:10px 0;overflow:hidden;
}
.pt2 svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.48}
.pt2 svg.chem-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.jr{
  position:absolute;transform:translate(-50%,-50%);
  text-align:center;font-size:10.5px;color:#fff;cursor:pointer;
  width:62px;padding:2px 0;transition:transform .12s;user-select:none;z-index:2;
}
.jr:active{transform:translate(-50%,-50%) scale(.93)}
.jr.sel{filter:drop-shadow(0 0 8px rgba(255,255,255,.95))}
.jr-kit{position:relative;display:inline-flex;align-items:center;justify-content:center}
.jr-cap{
  position:absolute;top:-2px;right:-4px;background:#facc15;color:#111;
  font-size:8.5px;font-weight:900;width:14px;height:14px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.5);
}
.jr-role{
  position:absolute;top:-2px;left:-6px;background:rgba(0,0,0,.68);color:rgba(255,255,255,.88);
  font-size:7.5px;font-weight:800;padding:1px 3px;border-radius:4px;letter-spacing:.02em;
}
.jr-inj{
  position:absolute;bottom:-2px;right:-6px;background:#dc2626;color:#fff;
  font-size:7.5px;font-weight:900;padding:1px 3px;border-radius:4px;
}
.jn{
  text-shadow:0 1px 3px #000;font-weight:700;font-size:10.5px;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;
}
.jo{
  display:inline-flex;align-items:center;gap:3px;justify-content:center;
  background:rgba(7,14,10,.78);border:1px solid rgba(255,255,255,.18);
  border-radius:7px;padding:1px 5px;font-variant-numeric:tabular-nums;
  font-weight:800;font-size:10px;margin-top:1px;
}
.jo span.fit{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.st-micro{
  width:38px;height:3.5px;background:rgba(0,0,0,.55);border-radius:99px;
  overflow:hidden;margin:2px auto 0;
}
.st-micro i{display:block;height:100%;border-radius:99px}

/* Color-Coded Match Log */
.mlog{
  max-height:88px;overflow-y:auto;font-size:12px;line-height:1.42;
  padding:7px 10px;background:var(--c);border:1px solid var(--b);
  border-radius:12px;margin:6px 0;
}
.mlog-item{
  padding:3.5px 0;border-bottom:1px solid color-mix(in srgb,var(--b) 45%,transparent);
  display:flex;gap:6px;align-items:center;
}
.mlog-item:last-child{border-bottom:0}
.ltag{
  font-size:9.5px;font-weight:900;letter-spacing:.04em;padding:2px 6px;border-radius:5px;
  flex-shrink:0;text-transform:uppercase;display:inline-flex;align-items:center;gap:3px;
}
.ltag.gol{background:rgba(16,185,129,.18);color:var(--ok)}
.ltag.yenilen{background:rgba(239,68,68,.18);color:var(--bad)}
.ltag.kart{background:rgba(245,158,11,.22);color:var(--warn)}
.ltag.kart-r{background:#dc2626;color:#fff}
.ltag.deg{background:rgba(59,130,246,.18);color:var(--blue)}
.ltag.taktik{background:rgba(127,127,127,.18);color:var(--m)}
.ltag.kurt{background:rgba(20,184,166,.18);color:#14b8a6}
.ltag.skor{background:rgba(245,158,11,.24);color:#d97706}
.ltag.direk{background:rgba(234,88,12,.22);color:#ea580c}

/* Live Ratings Grid */
.rat-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;max-height:112px;overflow-y:auto}
.rat-row{
  display:flex;justify-content:space-between;align-items:center;font-size:11px;
  background:var(--c2);border:1px solid var(--b);border-radius:8px;padding:4px 7px;
}
.rat-val{font-weight:900;padding:1px 5px;border-radius:5px;font-variant-numeric:tabular-nums}
.rat-hi{background:rgba(16,185,129,.22);color:var(--ok)}
.rat-mid{background:rgba(245,158,11,.2);color:var(--warn)}
.rat-lo{background:rgba(239,68,68,.2);color:var(--bad)}

/* v8 Upgraded Mini-Game Arcade Arena (Pitch Stripes + Floodlight Vignette + Dynamic Timer) */
.mg-card{
  background:linear-gradient(180deg,#0c1711,#13241b);color:#fff;
  border:2px solid #2b4a39;border-radius:18px;padding:14px;margin:8px 0;
  box-shadow:0 14px 34px rgba(0,0,0,.46),inset 0 1px 0 rgba(255,255,255,.14);
  user-select:none;touch-action:none;
}
.mg-top-row{
  display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap;
}
.mg-attr-pill{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;
  background:rgba(52,211,153,.16);border:1px solid rgba(52,211,153,.45);
  color:#6ee7b7;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;
}
.mg-flash{
  min-height:236px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:10px;animation:pop .25s ease;
}
.mg-flash-ic{
  width:70px;height:70px;border-radius:20px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 32px rgba(255,255,255,.26),inset 0 1px 0 rgba(255,255,255,.35);
}
.mg-actor{
  display:inline-flex;align-items:center;gap:9px;background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.24);border-radius:13px;padding:7px 12px;margin-top:2px;
}
.mg-cmd{
  font-size:14.5px;font-weight:900;text-align:center;letter-spacing:-.01em;margin:2px 0 8px;
}
.mg-svg-wrap{
  position:relative;width:100%;border-radius:14px;overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 45%, rgba(255,255,255,.06) 0%, rgba(4,12,8,.42) 100%),
    repeating-linear-gradient(90deg,#1a6b38 0 28px,#1e7a40 28px 56px);
  border:2px solid rgba(255,255,255,.42);
  box-shadow:inset 0 0 28px rgba(0,0,0,.45),0 6px 18px rgba(0,0,0,.3);
  margin:6px 0;touch-action:none;
}
.mg-goal-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
  padding:14px 12px 10px;
  background:
    radial-gradient(circle at 50% 0%,rgba(255,250,210,.15),transparent 65%),
    repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 8px,transparent 8px 16px),
    #0e3b20;
  border:5px solid #f8fafc;border-bottom:0;border-radius:10px 10px 0 0;margin:8px 6px 0;
  box-shadow:inset 0 8px 20px rgba(0,0,0,.45);
}
.mg-zone{
  min-height:60px;border-radius:10px;background:rgba(16,185,129,.2);
  border:2px dashed rgba(255,255,255,.5);color:#fff;font-weight:800;font-size:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;
  transition:transform .1s,background .15s,border-color .15s;margin:0;padding:6px;box-shadow:none;
}
.mg-zone:active{transform:scale(.94);background:rgba(16,185,129,.48)}
.mg-zone.hot{background:rgba(239,68,68,.58);border-color:#fca5a5;border-style:solid;animation:pulseHot .42s infinite;box-shadow:0 0 18px rgba(239,68,68,.55)}
.mg-zone.fake{background:rgba(250,204,21,.48);border-color:#fde047;border-style:solid}
.mg-zone.hit{background:rgba(16,185,129,.68);border-color:#4ade80;border-style:solid}
@keyframes pulseHot{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

.mg-bar{position:relative;height:30px;background:rgba(255,255,255,.14);border-radius:10px;overflow:hidden;margin:10px 0;border:1px solid rgba(255,255,255,.22)}
.mg-zn{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#059669,#34d399,#059669);opacity:.82}
.mg-mk{position:absolute;top:0;bottom:0;width:8px;background:#fff;border-radius:4px;box-shadow:0 0 10px #fff}
.mg-timer{height:7px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden;margin:6px 0}
.mg-timer i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ef4444 0%,#f59e0b 48%,#10b981 100%);background-size:300% 100%;background-position:100% 0}

/* Penalty Shootout Scoreboard */
.pen-board{
  background:rgba(0,0,0,.48);border:1px solid rgba(255,255,255,.18);
  border-radius:12px;padding:10px 12px;margin-bottom:8px;
}
.pen-dots{display:flex;gap:5px;align-items:center}
.pen-dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:1.5px solid rgba(255,255,255,.45)}
.pen-dot.hit{background:#10b981;border-color:#4ade80;box-shadow:0 0 8px rgba(16,185,129,.65)}
.pen-dot.miss{background:#ef4444;border-color:#fca5a5}

/* Chips, Tables, Scenario Cards */
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:6px 9px;margin:3px;
  border-radius:10px;background:var(--c2);border:1px solid var(--b);
  font-size:12px;cursor:pointer;font-variant-numeric:tabular-nums;
  transition:border-color .12s,transform .1s;
}
.chip:active{transform:scale(.96)}
.chip.sel{border-color:var(--a);background:color-mix(in srgb,var(--a) 15%,var(--c2))}
.chip.unavail{opacity:.68;border-style:dashed}
.scen{
  background:var(--c2);border:1.5px solid var(--b);border-radius:13px;
  padding:11px 12px;margin:8px 0;cursor:pointer;
  transition:border-color .15s,transform .12s,background .15s;
}
.scen:active{transform:scale(.985)}
.scen.on{border-color:var(--a);background:color-mix(in srgb,var(--a) 10%,var(--c2))}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
td,th{padding:6px 4px;text-align:right;border-bottom:1px solid color-mix(in srgb,var(--b) 55%,transparent)}
td:first-child,th:first-child{text-align:left}
th{font-size:10px;text-transform:uppercase;color:var(--m);letter-spacing:.06em}
.w{overflow-x:auto}

/* Modal */
.ov{
  position:fixed;inset:0;background:rgba(0,0,0,.74);backdrop-filter:blur(5px);
  display:flex;align-items:flex-end;justify-content:center;z-index:50;
}
.fc{
  width:100%;max-width:480px;max-height:90vh;overflow-y:auto;
  background:linear-gradient(165deg,hsl(var(--h,150) 46% 24%),#0b1410);
  color:#fff;border-radius:22px 22px 0 0;border-top:1px solid rgba(255,255,255,.18);
  padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));
  animation:up .22s cubic-bezier(.22,1,.36,1);
}
.fc.light-m{background:var(--c);color:var(--t);border-top:1px solid var(--b)}
@keyframes up{from{transform:translateY(30px);opacity:0}}

/* Player Card Mini Attribute Bars & Radar */
.pstat-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0}
.pstat{background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:6px 8px}
.pstat .br{height:5px;background:rgba(255,255,255,.18);margin-top:4px}
.radar-wrap{
  display:flex;align-items:center;justify-content:center;gap:10px;
  background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.14);
  border-radius:12px;padding:8px;margin:8px 0;
}

/* Set Piece Specialist Bar */
.sp-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.sp-box{background:var(--c2);border:1px solid var(--b);border-radius:10px;padding:6px}
.sp-box label{display:block;font-size:9.5px;font-weight:800;color:var(--m);text-transform:uppercase;margin-bottom:3px}

  position:fixed;bottom:0;left:0;right:0;display:flex;

nav button.on{color:var(--a)}
nav button.on::before{
  content:"";position:absolute;top:0;left:22%;right:22%;height:3px;
  background:var(--a);border-radius:0 0 4px 4px;
  box-shadow:0 2px 8px color-mix(in srgb,var(--a) 60%,transparent);
}

/* ==================== PERSISTENT SETTINGS (mfc_v8_set) & DIFFICULTY ==================== */
const DIFF_META={
  normal:{id:'normal',name:'Normal',tag:'Dengeli',desc:'Standart yapay zeka, rakip taktik stili maç öncesi açık, dengeli mini oyun süreleri.',aiBoost:0,mgTimeMult:1.0,mgGoalCap:0.46,revealOppStyle:true,scoutReq:0,aiTransferFreq:1},
  hard:{id:'hard',name:'Zor (Gerçekçi)',tag:'Önerilen',desc:'Daha güçlü rakipler (+1.8), gizli rakip stili (Baş Gözlemci Sv.2 açar), aktif transfer piyasası ve sıkı mini oyunlar.',aiBoost:1.8,mgTimeMult:0.88,mgGoalCap:0.38,revealOppStyle:false,scoutReq:2,aiTransferFreq:2},
  legend:{id:'legend',name:'Efsane',tag:'Acımasız',desc:'Elit yapay zeka (+3.5), rakip stili için Baş Gözlemci Sv.3 şart, agresif rakipler ve yüksek refleks isteyen mini oyunlar.',aiBoost:3.5,mgTimeMult:0.78,mgGoalCap:0.32,revealOppStyle:false,scoutReq:3,aiTransferFreq:3}
};
const SETTINGS={
  sfx:true,
  haptic:true,
  theme:'system',
  defaultSpeed:1,
  difficulty:'hard',
  load(){
    try{
      if(typeof localStorage==='undefined')return;
      const raw=localStorage.getItem('mfc_v8_set');
      if(raw){
        const o=JSON.parse(raw);
        if(typeof o.sfx==='boolean')this.sfx=o.sfx;
        if(typeof o.haptic==='boolean')this.haptic=o.haptic;
        if(['system','dark','light'].includes(o.theme))this.theme=o.theme;
        if([1,1.5,2].includes(o.defaultSpeed))this.defaultSpeed=o.defaultSpeed;
        if(['normal','hard','legend'].includes(o.difficulty))this.difficulty=o.difficulty;
      }else{
        const oldMute=localStorage.getItem('mfc_mute');
        if(oldMute==='1')this.sfx=false;
        const oldTheme=localStorage.getItem('mfc_theme');
        if(oldTheme==='dark'||oldTheme==='light')this.theme=oldTheme;
      }
    }catch(e){}
    this.applyTheme();
  },
  save(){
    try{
      if(typeof localStorage!=='undefined'){
        localStorage.setItem('mfc_v8_set',JSON.stringify({
          sfx:this.sfx,haptic:this.haptic,theme:this.theme,defaultSpeed:this.defaultSpeed,difficulty:this.difficulty
        }));
      }
    }catch(e){}
  },
  applyTheme(){
    if(typeof document==='undefined')return;
    if(this.theme==='system')document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme',this.theme);
  },
  set(k,v){
    this[k]=v;
    if(k==='sfx')SFX.muted=!v;
    if(k==='theme')this.applyTheme();
    this.save();
  }
};
SETTINGS.load();
function diffCfg(){return DIFF_META[SETTINGS.difficulty]||DIFF_META.hard}
function canSeeOppStyle(){
  const dc=diffCfg();
  if(dc.revealOppStyle)return true;
  return !!(G&&G.stf&&G.stf[1]>=dc.scoutReq);
}

/* ==================== ENHANCED WEB AUDIO SFX + HAPTIC VIBRATION ==================== */
const SFX={
  ctx:null,
  muted:!SETTINGS.sfx,
  init(){this.muted=!SETTINGS.sfx},
  unlock(){
    if(this.ctx)return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(AC){this.ctx=new AC();if(this.ctx.state==='suspended')this.ctx.resume()}
    }catch(e){}
  },
  toggle(){
    this.unlock();
    SETTINGS.set('sfx',!SETTINGS.sfx);
    this.muted=!SETTINGS.sfx;
    document.querySelectorAll('[data-mute-btn]').forEach(el=>{
      el.innerHTML=ico(this.muted?'volOff':'volOn',16);
      el.title=this.muted?'Sesi Aç':'Sesi Kapat';
    });
    if(!this.muted)this.tap();
  },
  vib(pat){
    if(!SETTINGS.haptic)return;
    try{if(typeof navigator!=='undefined'&&navigator.vibrate)navigator.vibrate(pat)}catch(e){}
  },
  tone(freq,dur,type='sine',vol=0.12,delay=0,endFreq=null){
    if(this.muted||!SETTINGS.sfx)return;
    this.unlock();
    if(!this.ctx)return;
    try{
      const t=this.ctx.currentTime+delay;
      const o=this.ctx.createOscillator();
      const g=this.ctx.createGain();
      o.type=type;
      o.frequency.setValueAtTime(freq,t);
      if(endFreq)o.frequency.exponentialRampToValueAtTime(endFreq,t+dur);
      g.gain.setValueAtTime(0.001,t);
      g.gain.linearRampToValueAtTime(vol,t+0.015);
      g.gain.exponentialRampToValueAtTime(0.001,t+dur);
      o.connect(g);g.connect(this.ctx.destination);
      o.start(t);o.stop(t+dur+0.02);
    }catch(e){}
  },
  noise(dur,filterFreq,q,vol,attack=0.05,endFreq=null){
    if(this.muted||!SETTINGS.sfx)return;
    this.unlock();
    if(!this.ctx)return;
    try{
      const sr=this.ctx.sampleRate,len=Math.max(1,Math.floor(sr*dur));
      const buf=this.ctx.createBuffer(1,len,sr);
      const data=buf.getChannelData(0);
      for(let i=0;i<len;i++)data[i]=Math.random()*2-1;
      const src=this.ctx.createBufferSource();
      src.buffer=buf;
      const flt=this.ctx.createBiquadFilter();
      flt.type='bandpass';
      const t=this.ctx.currentTime;
      flt.frequency.setValueAtTime(filterFreq,t);
      if(endFreq)flt.frequency.exponentialRampToValueAtTime(endFreq,t+dur);
      flt.Q.setValueAtTime(q,t);
      const g=this.ctx.createGain();
      g.gain.setValueAtTime(0.001,t);
      g.gain.linearRampToValueAtTime(vol,t+attack);
      g.gain.exponentialRampToValueAtTime(0.001,t+dur);
      src.connect(flt);flt.connect(g);g.connect(this.ctx.destination);
      src.start(t);src.stop(t+dur+0.02);
    }catch(e){}
  },
  tap(){this.tone(620,0.045,'triangle',0.07)},
  kick(){
    this.tone(165,0.11,'sine',0.19,0,42);
    this.noise(0.06,680,1.4,0.08,0.005);
    this.vib([25]);
  },
  post(){
    this.tone(1140,0.38,'triangle',0.14,0,1090);
    this.tone(1760,0.28,'sine',0.10,0.01,1700);
    this.tone(2420,0.18,'sine',0.07,0.02,2310);
    this.vib([45,30,45]);
  },
  swell(){
    this.noise(0.95,320,1.2,0.12,0.72,980);
    this.tone(120,0.9,'sine',0.06,0,210);
  },
  roar(){
    this.noise(1.25,650,0.75,0.16,0.15,420);
    this.noise(1.05,1250,1.1,0.09,0.2,850);
  },
  whistle(){this.tone(2650,0.16,'sine',0.09,0,2850);this.tone(2750,0.22,'sine',0.09,0.2,2500)},
  goal(){
    [523.25,659.25,783.99,1046.5].forEach((f,i)=>this.tone(f,0.22,'triangle',0.14,i*0.07));
    this.roar();
    this.vib([80,40,120]);
  },
  concede(){this.tone(150,0.35,'sawtooth',0.12,0,62);this.vib([130])},
  save(){this.tone(180,0.09,'square',0.11,0,90);this.tone(660,0.16,'sine',0.1,0.06);this.vib([55])},
  card(){this.tone(920,0.09,'square',0.1,0);this.tone(720,0.14,'square',0.1,0.11);this.vib([70,40,70])},
  ok(){this.tone(587.33,0.1,'triangle',0.11,0);this.tone(880,0.18,'triangle',0.12,0.08);this.vib([40,30,60])},
  bad(){this.tone(240,0.18,'sawtooth',0.11,0,130);this.vib([90])}
};
SFX.init();
if(typeof document!=='undefined')document.addEventListener('pointerdown',()=>SFX.unlock(),{once:true,passive:true});

}

/* ==================== UTILITIES, TOAST & ISOLATED TIMERS ==================== */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const P=a=>a[R(0,a.length-1)];
const C=(v,a,b)=>Math.max(a,Math.min(b,v));
const E=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const $=i=>typeof document!=='undefined'?document.getElementById(i):null;

const TIMERS={iv:[],to:[],raf:[],uiTo:[],dlIv:[]};
function addIv(fn,ms){const id=setInterval(fn,ms);TIMERS.iv.push(id);return id}
function addTo(fn,ms){const id=setTimeout(fn,ms);TIMERS.to.push(id);return id}
function addRaf(fn){const id=requestAnimationFrame(fn);TIMERS.raf.push(id);return id}
function addUiTo(fn,ms){const id=setTimeout(fn,ms);TIMERS.uiTo.push(id);return id}
function addDlIv(fn,ms){const id=setInterval(fn,ms);TIMERS.dlIv.push(id);return id}
function clearTimers(){
  TIMERS.iv.forEach(clearInterval);TIMERS.iv=[];
  TIMERS.to.forEach(clearTimeout);TIMERS.to=[];
  TIMERS.raf.forEach(cancelAnimationFrame);TIMERS.raf=[];
  if(G&&G.m){G.m.iv=null;G.m.ct=null;G.m.inBuildup=false}
}
function clearUiTimers(){
  TIMERS.uiTo.forEach(clearTimeout);TIMERS.uiTo=[];
  TIMERS.dlIv.forEach(clearInterval);TIMERS.dlIv=[];
}

function toast(msg,type='info',ms=2800){
  const box=$('toast-box');if(!box)return;
  const el=document.createElement('div');
  el.className='toast '+(type||'');
  const ic=type==='ok'?'check':type==='bad'?'alert':type==='warn'?'alert':'news';
  el.innerHTML=`${ico(ic,15)}<span>${E(msg)}</span>`;
  box.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .25s';setTimeout(()=>el.remove(),260)},ms);
}

let _landRaf=null;
function stopLandCanvas(){
  if(_landRaf&&typeof cancelAnimationFrame!=='undefined'){cancelAnimationFrame(_landRaf);_landRaf=null}
}

function S(h,keepNav,isMatchPitch=false){
  stopLandCanvas();
  if(typeof TUT!=='undefined'&&!TUT.active){const tl=$('tut-layer');if(tl)tl.remove()}
  if(!isMatchPitch){
    if(typeof MatchCanvas!=='undefined')MatchCanvas.stop();
    clearUiTimers();
    if(G&&G.m)G.m.banner=null;
  }
  if(!G||!G.inM){
    clearTimers();
    clearUiTimers();
  }else if(!isMatchPitch){
    TIMERS.dlIv.forEach(clearInterval);TIMERS.dlIv=[];
  }
  const app=$('app');
  if(app)app.innerHTML=h;
  if(!keepNav){const nv=$('nv');if(nv)nv.innerHTML=''}
}

function toggleTheme(){
  const cur=SETTINGS.theme;
  const dark=typeof window!=='undefined'&&window.matchMedia('(prefers-color-scheme:dark)').matches;
  const next=cur==='system'?(dark?'light':'dark'):(cur==='dark'?'light':'dark');
  SETTINGS.set('theme',next);
}

/* ==================== 6 ATTRIBUTES & RARITY ==================== */
function calcAttrs(x){
  const o=x.o||70,p=x.p||2,a=x.a||25,seed=((x.id||1)*37+(x.no||7)*13)%11-5;
  const ageSpd=a<=24?4:a>=32?-6:0;
  const ageFiz=a<=20?-4:a>=33?-3:2;
  const v=(base,d)=>C(Math.round(base+d),35,98);
  let hiz,sut,pas,dri,def,fiz;
  if(p===0){
    hiz=v(o-24+ageSpd,seed*0.4);sut=v(o-32,seed*0.3);pas=v(o-6,seed*0.7);
    dri=v(o-26,seed*0.4);def=v(o+3,seed*0.5);fiz=v(o-3+ageFiz,seed*0.5);
  }else if(p===1){
    hiz=v(o-4+ageSpd,seed*0.8);sut=v(o-18,seed*0.7);pas=v(o-5,seed*0.7);
    dri=v(o-10,seed*0.6);def=v(o+3,seed*0.5);fiz=v(o+2+ageFiz,seed*0.6);
  }else if(p===2){
    hiz=v(o-3+ageSpd,seed*0.7);sut=v(o-4,seed*0.8);pas=v(o+3,seed*0.5);
    dri=v(o+1,seed*0.6);def=v(o-6,seed*0.8);fiz=v(o-3+ageFiz,seed*0.6);
  }else{
    hiz=v(o+2+ageSpd,seed*0.7);sut=v(o+3,seed*0.5);pas=v(o-5,seed*0.7);
    dri=v(o+2,seed*0.6);def=v(o-26,seed*0.5);fiz=v(o-2+ageFiz,seed*0.7);
  }
  return{hiz,sut,pas,dri,def,fiz};
}
function getAttrs(x){
  if(!x)return{hiz:70,sut:70,pas:70,dri:70,def:70,fiz:70};
  if(!x.att||x._attO!==x.o){x.att=calcAttrs(x);x._attO=x.o}
  return x.att;
}
function playerAvgRat(x){
  if(!x||!x.ratCnt)return null;
  return +(x.ratSum/x.ratCnt).toFixed(1);
}
function rarityInfo(o){
  if(o>=83)return{cls:'rar-elite',name:'ELİT',col:'#34d399'};
  if(o>=75)return{cls:'rar-gold',name:'ALTIN',col:'#fde047'};
  if(o>=65)return{cls:'rar-silver',name:'GÜMÜŞ',col:'#cbd5e1'};
  return{cls:'rar-bronze',name:'BRONZ',col:'#d49463'};
}
function radarSVG(att,accentCol='#34d399'){
  const keys=[['HIZ',att.hiz],['ŞUT',att.sut],['PAS',att.pas],['DRİ',att.dri],['DEF',att.def],['FİZ',att.fiz]];
  const cx=92,cy=76,Rmax=50;
  const pt=(i,val)=>{
    const ang=-Math.PI/2+i*(Math.PI/3);
    const r=(C(val,20,100)/100)*Rmax;
    return[cx+Math.cos(ang)*r,cy+Math.sin(ang)*r];
  };
  const grid=[0.33,0.66,1].map(k=>{
    const pts=keys.map((_,i)=>pt(i,k*100).map(n=>n.toFixed(1)).join(',')).join(' ');
    return`<polygon points="${pts}" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="1"/>`;
  }).join('');
  const axes=keys.map((_,i)=>{
    const [x,y]=pt(i,100);
    return`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,.16)" stroke-width="1"/>`;
  }).join('');
  const poly=keys.map(([,v],i)=>pt(i,v).map(n=>n.toFixed(1)).join(',')).join(' ');
  const dots=keys.map(([,v],i)=>{
    const [x,y]=pt(i,v);
    return`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2" fill="${accentCol}" stroke="#09120d" stroke-width="1"/>`;
  }).join('');
  const labels=keys.map(([k,v],i)=>{
    const ang=-Math.PI/2+i*(Math.PI/3);
    const lx=cx+Math.cos(ang)*(Rmax+19);
    const ly=cy+Math.sin(ang)*(Rmax+15)+3;
    return`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" fill="#fff" font-size="8.5" font-weight="800" font-family="-apple-system,sans-serif">${k} ${v}</text>`;
  }).join('');
  return`<svg viewBox="0 0 184 152" width="184" height="152" style="display:block;flex-shrink:0" aria-hidden="true">
    ${grid}${axes}
    <polygon points="${poly}" fill="${accentCol}" fill-opacity=".28" stroke="${accentCol}" stroke-width="2" stroke-linejoin="round"/>
    ${dots}${labels}
  </svg>`;
}

function leaguePack(lg){
  if(lg==='en')return{rc:RC_EN,st:ST_EN,pal:CLUB_PAL_EN,lg:'en'};
  if(lg==='es')return{rc:RC_ES,st:ST_ES,pal:CLUB_PAL_ES,lg:'es'};

function gen(leagueId){
  const lg=leagueId||activeLeague||'tr';
  activeLeague=lg;
  const order=[lg,...['tr','en','es'].filter(x=>x!==lg)];
  const allClubs=[];
  DB={
    league:lg,

    clubs:[],
    pl:[],
    src:`2026/27 ${LEAGUE_META[lg].name} + Avrupa Ligleri (36 Kulüp · 576 Gerçek Futbolcu)`
  };

  order.forEach((lCode,blockIdx)=>{
    const pack=leaguePack(lCode);
    const offset=blockIdx*12;
    pack.rc.forEach((c,i)=>{
      const cid=offset+i;
      const inf=defaultClubInfra(c[1]);
      allClubs.push({
        id:cid,name:c[0],s:c[1],baseS:c[1],league:lCode,
        col:pack.pal[i]||['#157a47','#ffffff'],
        fac:inf.fac.slice(),stf:inf.stf.slice(),tp:inf.tp
      });
    });
    pack.st.forEach(s=>{
      const[idxStr,n,p,o,a,no]=s.split('|');
      const cid=offset+(+idxStr);
      mk(n,cid,+p,+o,+a,undefined,undefined,+no);
    });
  });
  DB.clubs=DB.allClubs.slice(0,12);
}

const eff=x=>x.o*(0.84+0.16*C(x.k,10,100)/100)*(1+(x.f-50)/380)*(1+(x.m-55)/550);

function slotFit(x,slot){
  if(!x||!slot)return 0.5;
  if(x.p===slot.pos)return 1.0;
  if(slot.pos===0||x.p===0)return 0.52;
  if(Math.abs(x.p-slot.pos)===1)return 0.88;
  return 0.68;
}
function slotFitColor(x,slot){
  const f=slotFit(x,slot);
  return f>=0.99?'#10b981':f>=0.85?'#f59e0b':'#ef4444';
}

function xiAvgOvr(){
  if(!G||!DB)return 75;
  const pls=G.xi.map(id=>id!==null&&id!==undefined?DB.pl[id]:null).filter(Boolean);
  if(!pls.length)return(DB.clubs[G.cid]&&DB.clubs[G.cid].s)||75;
  return pls.reduce((s,x)=>s+x.o,0)/pls.length;
}

/* ==================== GÖREV 6: SEÇİCİ KİMYA BAĞLARI (YALNIZCA GÜÇLÜ BAĞLAR) ==================== */
function chemLinkInfo(pa,sa,pb,sb,avgXI){
  if(!pa||!pb||!sa||!sb)return null;
  if(slotFit(pa,sa)<0.99||slotFit(pb,sb)<0.99)return null;
  const avgMor=(pa.m+pb.m)/2;
  if(avgMor<62)return null;
  const ref=avgXI!==undefined?avgXI:xiAvgOvr();
  const hiLevel=(pa.o>=ref-1&&pb.o>=ref-1);
  const leaderOrForm=(pa.tp===0||pb.tp===0||(playerAvgRat(pa)||0)>=7.3||(playerAvgRat(pb)||0)>=7.3);
  if(avgMor>=74&&(hiLevel||leaderOrForm))return'elite';
  return'good';
}

function calcTeamChemistry(){
  if(!G||!DB)return 75;
  const slots=SLOTS[G.f]||SLOTS['4-3-3'];
  const edges=CHEM_EDGES[G.f]||CHEM_EDGES['4-3-3'];
  const avgXI=xiAvgOvr();
  let fitSum=0,fitCnt=0,goodCnt=0,eliteCnt=0;
  for(let i=0;i<11;i++){
    const p=G.xi[i]!==null&&G.xi[i]!==undefined?DB.pl[G.xi[i]]:null;
    if(p){fitSum+=slotFit(p,slots[i]);fitCnt++}
  }
  edges.forEach(([a,b])=>{
    const pa=G.xi[a]!==null&&G.xi[a]!==undefined?DB.pl[G.xi[a]]:null;
    const pb=G.xi[b]!==null&&G.xi[b]!==undefined?DB.pl[G.xi[b]]:null;
    const lv=chemLinkInfo(pa,slots[a],pb,slots[b],avgXI);
    if(lv==='elite')eliteCnt++;
    else if(lv==='good')goodCnt++;
  });
  const fitScore=fitCnt?(fitSum/fitCnt)*62:45;
  const linkRatio=(goodCnt*1.0+eliteCnt*1.45)/Math.max(1,edges.length);
  return C(Math.round(fitScore+Math.min(38,linkRatio*38)),30,100);
}

const POS_MIN_DEPTH=[2,5,5,3];

function analyzeSquadNeeds(){
  const myPl=DB.pl.filter(x=>x.c===G.cid);
  const avgXI=xiAvgOvr();
  const xiSet=new Set(G.xi.filter(id=>id!==null&&id!==undefined));
  const needs=[];

  for(let pos=0;pos<4;pos++){
    const grp=myPl.filter(x=>x.p===pos).sort((a,b)=>b.o-a.o);
    const starters=grp.filter(x=>xiSet.has(x.id));
    const core=starters.length?starters:grp.slice(0,pos===0?1:3);
    const avgPos=core.length?core.reduce((s,x)=>s+x.o,0)/core.length:(avgXI-8);
    const reasons=[];
    let score=0;

    if(avgPos<avgXI-1.5){
      score+=(avgXI-avgPos)*3.2;
      reasons.push(`Ort. OVR düşük (${avgPos.toFixed(0)})`);
    }
    if(grp.length<POS_MIN_DEPTH[pos]){
      score+=(POS_MIN_DEPTH[pos]-grp.length)*7;
      reasons.push(`Derinlik az (${grp.length}/${POS_MIN_DEPTH[pos]})`);
    }
    const aging=core.filter(x=>x.a>=31).length;
    if(aging>0){
      score+=aging*4.5;
      reasons.push(`Yaşlı ilk 11 (${aging})`);
    }
    const injured=grp.filter(x=>x.i>=2).length;
    if(injured>0){
      score+=injured*5;
      reasons.push(`Uzun sakatlık (${injured})`);
    }
    needs.push({pos,name:PN[pos],score:+score.toFixed(1),avgPos:+avgPos.toFixed(1),count:grp.length,reasons});
  }

  needs.sort((a,b)=>b.score-a.score);
  const topNeeds=needs.filter(n=>n.score>=3.5).slice(0,2);
  const activeNeeds=topNeeds.length?topNeeds:[needs[0]];
  const summaryParts=activeNeeds.map(n=>`${n.name} (${n.reasons[0]||`Ort. ${n.avgPos}`})`);
  return{
    avgXI:+avgXI.toFixed(1),
    needs,
    needPositions:activeNeeds.map(n=>n.pos),
    primaryPos:activeNeeds[0].pos,
    summaryText:summaryParts.join(' · ')
  };
}

function autoSlots(c,f,restTired=false){
  const slots=SLOTS[f]||SLOTS['4-3-3'];
  const pool=hl(c);
  const chosen=new Array(11).fill(null);
  const used=new Set();
  const scoreFor=(x,slot)=>{
    let sc=eff(x)*slotFit(x,slot);
    if(restTired&&x.k<65)sc*=0.50;
    return sc;
  };
  const order=[...slots.keys()].sort((a,b)=>(slots[a].pos===0?-1:slots[b].pos===0?1:0));
  for(const idx of order){
    const slot=slots[idx];
    const cand=pool.filter(x=>!used.has(x.id)&&x.p===slot.pos)
      .sort((a,b)=>scoreFor(b,slot)-scoreFor(a,slot))[0];
    if(cand){chosen[idx]=cand.id;used.add(cand.id)}
  }
  for(let idx=0;idx<11;idx++){
    if(chosen[idx]!==null)continue;
    const slot=slots[idx];
    const cand=pool.filter(x=>!used.has(x.id))
      .sort((a,b)=>scoreFor(b,slot)-scoreFor(a,slot))[0];
    if(cand){chosen[idx]=cand.id;used.add(cand.id)}
  }
  return chosen;
}

function fixXI(silent=false){
  ensureMinSquad(G.cid,silent);

  for(let i=0;i<11;i++){
    const id=G.xi[i];
    const x=(id!==null&&id!==undefined)?DB.pl[id]:null;
    if(x&&x.c===G.cid&&isAvail(x)&&!used.has(x.id)){
      next[i]=x.id;used.add(x.id);
    }
  }
  const pool=hl(G.cid);
  for(let i=0;i<11;i++){
    if(next[i]!==null)continue;
    const slot=slots[i];
    const cand=pool.filter(x=>!used.has(x.id))
      .sort((a,b)=>eff(b)*slotFit(b,slot)-eff(a)*slotFit(a,slot))[0];
    if(cand){next[i]=cand.id;used.add(cand.id)}
  }
  G.xi=next;
}

function tstr(c){

    return l.reduce((s,x)=>s+eff(x),0)/l.length;

  for(let i=0;i<slots.length;i++){

    if(x&&isAvail(x))t+=eff(x)*slotFit(x,slots[i]);

    x.c>=0&&x.c!==G.cid&&!x.loanOut&&x.a<=31&&isQualifiedCandidate(x,avgXI)
  );
  const needPool=allPool.filter(x=>needSet.has(x.p)).sort(()=>Math.random()-0.5);
  const genPool=allPool.filter(x=>!needSet.has(x.p)).sort(()=>Math.random()-0.5);

  // En az %60 (9/14) ihtiyaç mevkilerinden, %40 (5/14) genel yıldız/fırsat
  const chosen=[];
  const used=new Set();
  for(const x of needPool){
    if(chosen.length>=9)break;
    chosen.push(x.id);used.add(x.id);
  }
  for(const x of genPool){
    if(chosen.length>=14)break;
    if(!used.has(x.id)){chosen.push(x.id);used.add(x.id)}
  }
  for(const x of needPool){
    if(chosen.length>=14)break;
    if(!used.has(x.id)){chosen.push(x.id);used.add(x.id)}
  }
  // Eğer kulüp çok elitse ve havuz 10'un altında kaldıysa, en yüksek OVR adaylarla destekle (kalite tabanını koruyarak)
  if(chosen.length<8){
    const fallback=DB.pl.filter(x=>x.c>=0&&x.c!==G.cid&&!x.loanOut&&x.a<=31&&!used.has(x.id))
      .sort((a,b)=>b.o-a.o).slice(0,14-chosen.length);
    fallback.forEach(x=>chosen.push(x.id));
  }
  return chosen;
}

function genMkt(){
  updateClubStrengths();
  ensureFreeAgents();
  G.mkt=buildSmartMarketIds();
  const stars=DB.pl.filter(x=>x.c===G.cid&&!x.loan).sort((a,b)=>b.o-a.o).slice(0,6);
  const cnt=G.scen==='rising'?3:2;
  G.off=stars.sort(()=>Math.random()-0.5).slice(0,cnt).map(x=>({id:x.id,a:Math.round(val(x)*(G.scen==='rising'?1.2:1.1))}));
}

function runAITransfers(){
  if(!win()||!DB||!DB.allClubs)return;
  const moves=diffCfg().aiTransferFreq||1;
  for(let m=0;m<moves;m++){
    const buyers=DB.allClubs.filter(c=>c.id!==G.cid&&c.s>=70);
    if(!buyers.length)break;
    const buyer=P(buyers);
    const targets=DB.pl.filter(x=>x.c>=0&&x.c!==G.cid&&x.c!==buyer.id&&!x.loan&&!x.loanOut&&x.o>=buyer.s-4&&x.o<=buyer.s+5&&x.a<=30);
    if(!targets.length)continue;
    const target=P(targets);
    const seller=DB.allClubs[target.c];
    if(!seller)continue;
    if(DB.pl.filter(q=>q.c===seller.id).length<=15)continue;
    const fee=val(target);
    target.c=buyer.id;
    target.ct=R(2,4);
    const msg=`FLAŞ TRANSFER: ${buyer.name}, ${seller.name} kulübünden ${target.n}'i (${target.o}) ${fee} M'ye kadrosuna kattı!`;
    G.news=[msg,...(G.news||[])].slice(0,6);
  }
  updateClubStrengths();
}

function getSavePreview(){
  const resObj=loadSavedRaw();
  if(!resObj)return null;
  const g=resObj.data.G,db=resObj.data.DB;
  const club=(db.allClubs&&db.allClubs[g.cid])||(db.clubs&&db.clubs[g.cid]);
  if(!club)return null;
  let rk=1;
  if(g.tb){
    const sorted=Object.entries(g.tb).sort((a,b)=>(b[1].w*3+b[1].d-(b[1].pen||0))-(a[1].w*3+a[1].d-(a[1].pen||0))||(b[1].gf-b[1].ga)-(a[1].gf-a[1].ga));
    const idx=sorted.findIndex(e=>+e[0]===g.cid);
    if(idx>=0)rk=idx+1;
  }

  return{
    cid:g.cid,name:club.name,col:(club.col&&club.col[0])||'#157a47',

function startLandCanvas(){
  const cv=$('land-cv');
  if(!cv||typeof requestAnimationFrame==='undefined')return;
  stopLandCanvas();
  let t=0;
  const draw=()=>{
    const el=$('land-cv');if(!el)return;
    const dpr=Math.min(2,window.devicePixelRatio||1);
    const rect=el.getBoundingClientRect();
    const W=Math.max(280,Math.round(rect.width||400));
    const H=Math.max(170,Math.round(rect.height||180));
    if(el.width!==Math.round(W*dpr)||el.height!==Math.round(H*dpr)){
      el.width=Math.round(W*dpr);el.height=Math.round(H*dpr);
    }
    const ctx=el.getContext('2d');if(!ctx)return;
    t+=0.016;
    ctx.save();ctx.scale(dpr,dpr);
    // Grass stripes
    const stripes=8;
    for(let i=0;i<stripes;i++){
      ctx.fillStyle=i%2===0?'rgba(21,122,71,0.22)':'rgba(16,95,55,0.12)';
      ctx.fillRect((W/stripes)*i,0,(W/stripes)+1,H);
    }
    // Stadium pitch lines
    ctx.strokeStyle='rgba(255,255,255,0.16)';
    ctx.lineWidth=1.4;
    ctx.strokeRect(12,12,W-24,H-24);
    ctx.beginPath();ctx.moveTo(W/2,12);ctx.lineTo(W/2,H-12);ctx.stroke();
    ctx.beginPath();ctx.arc(W/2,H/2,36,0,Math.PI*2);ctx.stroke();
    // Animated stadium floodlight beams
    const beamX=W*0.5+Math.sin(t*0.7)*W*0.32;
    const g1=ctx.createRadialGradient(beamX,0,4,beamX,40,W*0.52);
    g1.addColorStop(0,'rgba(52,211,153,0.22)');
    g1.addColorStop(1,'rgba(52,211,153,0)');
    ctx.fillStyle=g1;ctx.fillRect(0,0,W,H);
    // Subtle animated ball orbit
    const bx=W*0.78+Math.cos(t*1.1)*26;
    const by=H*0.48+Math.sin(t*1.5)*16;
    ctx.strokeStyle='rgba(250,204,21,0.25)';
    ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.arc(W*0.78,H*0.48,26,0,Math.PI*2);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,255,255,0.85)';
    ctx.beginPath();ctx.arc(bx,by,4.5,0,Math.PI*2);ctx.fill();
    ctx.restore();
    _landRaf=requestAnimationFrame(draw);
  };
  _landRaf=requestAnimationFrame(draw);
}

const pm=s=>{s=String(s||'').toUpperCase();return/^(GK|KL)/.test(s)?0:/DEF|CB|LB|RB|WB|^D/.test(s)?1:/M|OS/.test(s)?2:3};
function imp(f){
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      let rows;const t=r.result;
      if(/\.json$/i.test(f.name))rows=JSON.parse(t);
      else{
        const L=t.trim().split(/\r?\n/),sep=L[0].includes(';')?';':',',h=L[0].split(sep).map(x=>x.trim().toLowerCase());
        rows=L.slice(1).map(l=>{const v=l.split(sep),o={};h.forEach((k,i)=>o[k]=(v[i]||'').trim());return o});
      }
      const by={};
      rows.forEach(o=>{
        const n=o.name||o.ad,c=o.club||o.kulup,ov=+(o.ovr||o.overall);
        if(n&&c&&ov)(by[c]=by[c]||[]).push({n,p:pm(o.pos||o.position),o:ov,a:+(o.age||o.yas)||24});
      });
      const cl=Object.entries(by).filter(([,v])=>v.length>=16)
        .map(([k,v])=>[k,v,v.map(x=>x.o).sort((a,b)=>b-a).slice(0,11).reduce((s,x)=>s+x,0)/11])
        .sort((a,b)=>b[2]-a[2]).slice(0,12);
      if(cl.length<12)throw 0;
      gen('tr');
      cl.forEach(([name,v,avgS],i)=>{
        const bs=Math.round(avgS),inf=defaultClubInfra(bs);
        DB.allClubs[i]={id:i,name,s:bs,baseS:bs,league:'tr',col:CLUB_PAL_TR[i],fac:inf.fac.slice(),stf:inf.stf.slice(),tp:inf.tp};
      });
      DB.pl=DB.pl.filter(x=>x.c>=12);
      cl.forEach(([,v],i)=>v.forEach(x=>mk(x.n,i,x.p,x.o,x.a)));
      DB.clubs=DB.allClubs.slice(0,12);
      DB.src='Özel kadro başarıyla içe aktarıldı.';
      toast('Özel kadro başarıyla içe aktarıldı!','ok');
    }catch(e){
      DB.src='Dosya okunamadı veya format eksik.';
      toast('Kadro dosyası okunamadı veya format eksik.','bad');
    }
    if(!G)menu();
  };
  r.readAsText(f);
}

function playWithInjection(id){
  const x=DB.pl[id];if(!x||x.c!==G.cid||x.i!==1)return;
  SFX.tap();x.i=0;x.injRisk=1;
  toast(`${x.n} iğneyle maç kadrosuna hazırlandı! (%35 ağır sakatlık riski)`,'warn',3400);
  save();mdl(id,'İğne tedavisi uygulandı! Bu maçta oynatılabilir, ancak maçta sakatlığının 3-4 haftaya çıkma (%35) riski bulunuyor.');
}

function loanOutPlayer(id){
  const x=DB.pl[id];if(!x||x.c!==G.cid||x.a>22||x.loan)return;
  const squadCnt=DB.pl.filter(q=>q.c===G.cid).length;
  if(squadCnt<=13){toast('Kadro 13 oyuncunun altına düşemez, kiralama iptal.','warn');return}
  const dest=P(DB.allClubs.filter(c=>c.id!==G.cid&&c.s<=DB.clubs[G.cid].s+2));
  if(!dest)return;
  const fee=Math.max(0.5,Math.round(val(x)*0.10*10)/10);
  SFX.ok();G.cash+=fee;
  x.loanOut={from:G.cid,to:dest.id,fee};x.c=dest.id;
  if(G.cap===x.id)G.cap=null;
  fixXI(true);ensureSetPieces();addRep('yth',1);
  G.news=[`KİRALIK: ${x.n} (${x.a} yaş), 1 sezonluğuna ${dest.name} kulübüne kiralandı (+${fee} M).`,...(G.news||[])].slice(0,6);
  toast(`${x.n} 1 sezonluğuna ${dest.name} kulübüne kiralandı (+${fee} M). Sezon sonunda gelişmiş dönecek!`,'ok',3600);
  mdx();save();render();
}

function renderSquadStatsView(l){
  const totVal=l.reduce((s,x)=>s+val(x),0);
  const avgAge=l.length?(l.reduce((s,x)=>s+x.a,0)/l.length).toFixed(1):'0';
  const avgOvr=l.length?Math.round(l.reduce((s,x)=>s+x.o,0)/l.length):0;
  const avgPot=l.length?Math.round(l.reduce((s,x)=>s+(x.pot||x.o),0)/l.length):0;
  const xiSet=new Set(G.xi.filter(id=>id!==null&&id!==undefined));

  const filtered=l.filter(x=>statFilter===-1||x.p===statFilter).slice().sort((a,b)=>{
    if(statSort==='val')return val(b)-val(a)||b.o-a.o;
    if(statSort==='pot')return (b.pot||b.o)-(a.pot||a.o)||b.o-a.o;
    if(statSort==='age')return a.a-b.a||b.o-a.o;
    if(statSort==='g')return (b.g||0)-(a.g||0)||b.o-a.o;
    if(statSort==='ast')return (b.ast||0)-(a.ast||0)||b.o-a.o;
    if(statSort==='rat')return (playerAvgRat(b)||0)-(playerAvgRat(a)||0)||b.o-a.o;
    return b.o-a.o||(b.pot||b.o)-(a.pot||a.o);
  });

  const rows=filtered.map(x=>{
    const rat=playerAvgRat(x);
    const ratCls=rat===null?'na':rat>=7.3?'hi':rat>=6.4?'mid':'lo';
    const isXI=xiSet.has(x.id);
    const potDiff=(x.pot||x.o)-x.o;
    const potTxt=potDiff>0?`<span style="color:var(--ok);font-weight:800">→${x.pot}</span>`:'';
    const statusTags=[
      G.cap===x.id?'<span class="pill gold" style="margin:0;padding:1px 5px;font-size:9.5px">C</span>':'',
      x.loan?'<span class="pill euro" style="margin:0;padding:1px 5px;font-size:9.5px">KİR</span>':'',
      x.i?`<span class="pill neg" style="margin:0;padding:1px 5px;font-size:9.5px">${ico('cross',9)} ${x.i}h</span>`:'',
      x.sus>0?`<span class="pill neg" style="margin:0;padding:1px 5px;font-size:9.5px">CEZA</span>`:''
    ].filter(Boolean).join(' ');

    return`
      <div class="st-row ${isXI?'xi-on':''}" onclick="SFX.tap();mdl(${x.id})">
        <div class="row" style="gap:9px;min-width:0;flex:1">
          ${playerBadgeHTML(x,G.cid)}
          <div style="min-width:0;flex:1">
            <div class="row" style="gap:5px;flex-wrap:wrap">
              <b style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:138px">${E(x.n)}</b>
              <span class="pill info" style="margin:0;padding:1px 5px;font-size:9.5px">${PN[x.p]}</span>
              ${statusTags}
            </div>
            <div class="m num" style="font-size:11px;margin-top:2px">
              <b>${x.o}</b>${potTxt} · ${x.a}y · ${x.loan?'Kira':x.ct+'yıl'} · <b>${val(x)}M</b> (${wg(x)}k)
            </div>
          </div>
        </div>
        <div class="st-metrics">
          <div class="st-chip" title="Maç"><div style="font-size:8.5px;color:var(--m)">M</div>${x.apps||0}</div>
          <div class="st-chip" title="Gol"><div style="font-size:8.5px;color:var(--m)">G</div>${x.g||0}</div>
          <div class="st-chip" title="Asist"><div style="font-size:8.5px;color:var(--m)">A</div>${x.ast||0}</div>
          <div class="st-rat ${ratCls}" title="Sezon Ort. Reyting">★${rat!==null?rat.toFixed(1):'-'}</div>
        </div>
      </div>`;
  }).join('');

  return`
    <div class="c" data-tut="squad-stats">
      <div class="r">
        <span class="lbl" style="margin:0">${ico('barChart',13)} Kadro Değeri & Sezon İstatistikleri</span>
        <span class="m" style="font-size:11px">Dokun: Kart & Radar</span>
      </div>
      <div class="kpi-strip">
        <div class="kpi-box"><div class="kval" style="color:var(--ok)">${totVal} M</div><div class="klbl">Kadro Değeri</div></div>
        <div class="kpi-box"><div class="kval">${avgAge}</div><div class="klbl">Ort. Yaş</div></div>
        <div class="kpi-box"><div class="kval">${avgOvr}<span class="m" style="font-size:11px">/${avgPot}</span></div><div class="klbl">OVR / POT</div></div>
        <div class="kpi-box"><div class="kval">${l.length}</div><div class="klbl">Kadro</div></div>
      </div>

      <div class="seg" style="margin-top:8px">
        ${[[-1,'Tümü'],[0,'KL'],[1,'DEF'],[2,'OS'],[3,'FOR']].map(([p,lb])=>`<button class="${statFilter===p?'on':''}" onclick="setStatFilter(${p})">${lb}</button>`).join('')}
      </div>

      <div class="r" style="margin:6px 0 4px">
        <span class="m" style="font-size:11.5px">Sıralama (${filtered.length} oyuncu)</span>
        <select style="width:auto;min-height:36px;padding:4px 8px;font-size:12px;margin:0" onchange="setStatSort(this.value)">
          ${[['o','OVR (Yüksek)'],'val|Değer (M)','pot|Potansiyel','age|Yaş (Genç)','g|Gol','ast|Asist','rat|Reyting'].map(it=>{
            const [k,lb]=Array.isArray(it)?it:it.split('|');
            return`<option value="${k}" ${statSort===k?'selected':''}>${lb}</option>`;
          }).join('')}
        </select>
      </div>

      <div style="margin-top:6px">${rows||'<p class="m">Bu filtrede oyuncu yok.</p>'}</div>
    </div>`;
}

function squad(){
  ensureSetPieces();
  const l=DB.pl.filter(x=>x.c===G.cid);
  const topToggle=`
    <div class="c" style="padding:8px">
      <div class="seg" style="margin:0">
        <button class="${squadView==='pitch'?'on':''}" onclick="setSquadView('pitch')">${ico('squad',13)} Taktik Sahası</button>

      </div>

  if(squadView==='stats'){
    S(topToggle+renderSquadStatsView(l),true);
    return;
  }

  const slots=SLOTS[G.f]||SLOTS['4-3-3'];
  const edges=CHEM_EDGES[G.f]||CHEM_EDGES['4-3-3'];
  const loanedOut=DB.pl.filter(x=>x.loanOut&&x.loanOut.from===G.cid);
  const chem=calcTeamChemistry();
  const avgXI=xiAvgOvr();
  const chemCls=chem>=82?'pos':chem>=66?'neu':'neg';

  /* GÖREV 6: Seçici Kimya Bağları — Zayıf/orta bağlar tamamen gizli; yalnızca Yeşil (İyi) ve Altın (Elit) çizilir */
  let goodCnt=0,eliteCnt=0;
  const chemLines=edges.map(([a,b])=>{
    const pa=G.xi[a]!==null?DB.pl[G.xi[a]]:null;
    const pb=G.xi[b]!==null?DB.pl[G.xi[b]]:null;
    const lv=chemLinkInfo(pa,slots[a],pb,slots[b],avgXI);
    if(!lv)return'';
    if(lv==='elite'){
      eliteCnt++;
      return`<line x1="${slots[a].x}" y1="${slots[a].y}" x2="${slots[b].x}" y2="${slots[b].y}" stroke="#facc15" stroke-width="1.35" stroke-opacity=".92" filter="url(#chem-glow-gold)"/>`;
    }
    goodCnt++;
    return`<line x1="${slots[a].x}" y1="${slots[a].y}" x2="${slots[b].x}" y2="${slots[b].y}" stroke="#34d399" stroke-width="0.95" stroke-opacity=".82" filter="url(#chem-glow-green)"/>`;
  }).join('');

  const chemSvg=`<svg class="chem-lines" viewBox="0 0 100 100" preserveAspectRatio="none">
    <defs>
      <filter id="chem-glow-green" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="chem-glow-gold" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="0.95" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    ${chemLines}
  </svg>`;

  const jr=slots.map((slot,idx)=>{
    const pid=G.xi[idx];
    const x=(pid!==null&&pid!==undefined)?DB.pl[pid]:null;
    if(!x)return'';
    const fitCol=slotFitColor(x,slot);
    const isSel=G.s1===x.id;
    const stCol=x.k<55?'#ef4444':x.k<72?'#f59e0b':'#34d399';
    return`
      <div class="jr ${isSel?'sel':''}" style="left:${slot.x}%;top:${slot.y}%" onclick="SFX.tap();${G.s1!==null?'sw':'mdl'}(${x.id})">
        <div class="jr-kit">
          ${jerseySVG(G.cid,x.no||idx+1,isSel,slot.pos===0)}
          <span class="jr-role">${slot.role}</span>
          ${G.cap===x.id?'<span class="jr-cap">C</span>':''}
          ${x.injRisk?'<span class="jr-inj">İĞNE</span>':''}
        </div>
        <div class="jn">${E(x.n.split(' ').pop())}</div>
        <div class="jo"><span class="fit" style="background:${fitCol}"></span>${x.o}</div>
        <div class="st-micro"><i style="width:${Math.round(x.k)}%;background:${stCol}"></i></div>
      </div>`;
  }).join('');

  const bn=l.filter(x=>!G.xi.includes(x.id)).sort((a,b)=>b.o-a.o);
  const outfield=l.filter(x=>x.p>0).sort((a,b)=>b.o-a.o);
  const spOpts=(role)=>outfield.map(x=>{
    const a=getAttrs(x);
    const stat=role==='ck'?`PAS ${a.pas}`:role==='pk'?`ŞUT ${a.sut}`:`ŞUT ${a.sut}/PAS ${a.pas}`;
    return`<option value="${x.id}" ${G.setPieces[role]===x.id?'selected':''}>${E(x.n.split(' ').pop())} (${stat})</option>`;
  }).join('');

  S(`
    ${topToggle}
    <div class="c">
      <div class="r" style="flex-wrap:wrap;gap:6px">
        <span class="lbl" style="margin:0">${ico('users',13)} Yardımcı Antrenör & Rotasyon</span>
        <div class="row" style="gap:5px">
          <button class="x sm" onclick="restTiredPlayers()">${ico('refresh',12)} Yorgunları Dinlendir</button>
          <button class="sm" onclick="SFX.tap();autoPickBestXI()">${ico('zap',12)} En İyi 11</button>
        </div>
      </div>
      <div class="tog-row">
        <div>
          <b style="font-size:12.5px">Otomatik Haftalık Rotasyon</b>

function sw(id){
  if(G.s1===null||G.s1===id){G.s1=G.s1===id?null:id;return render()}
  const a=G.s1,pA=DB.pl[a],pB=DB.pl[id];
  const xa=G.xi.indexOf(a),xb=G.xi.indexOf(id);

  if((xa>=0&&xb<0&&!isAvail(pB))||(xb>=0&&xa<0&&!isAvail(pA))){
    G.s1=null;
    const blocked=!isAvail(pB)?pB:pA;
    render();
    return mdl(blocked.id,blocked.i===1
      ?'Bu oyuncunun 1 haftalık hafif sakatlığı var. Aşağıdan "Risk Al ve İğneyle Oynat" seçeneğini kullanabilirsin.'
      :(blocked.i?'Bu oyuncu sakat olduğu için ilk 11\'e alınamaz.':'Bu oyuncu kırmızı kart cezalısı olduğu için bu hafta oynayamaz.'));
  }

  if(xa>=0&&xb<0)G.xi[xa]=id;
  else if(xb>=0&&xa<0)G.xi[xb]=a;
  else if(xa>=0&&xb>=0){G.xi[xa]=id;G.xi[xb]=a}
  G.s1=null;render();
}

function setCaptain(id){
  const oldCap=G.cap;
  if(oldCap===id)return;
  G.cap=id;
  const oldP=oldCap!==null?DB.pl[oldCap]:null;
  const otherLeader=DB.pl.find(x=>x.c===G.cid&&x.id!==id&&x.tp===0);
  if((oldP&&oldP.c===G.cid)||otherLeader){
    if(!G.later.some(l=>l.id==='cap_revolt')){
      G.later.push({id:'cap_revolt',w:1,pid:(oldP&&oldP.c===G.cid)?oldP.id:otherLeader.id});
    }
  }
  mdl(id,'Yeni kaptan atandı. Soyunma odasındaki liderler bu kararı konuşuyor.');
}

function tkp(id,a){
  const x=DB.pl[id];G.tk=1;SFX.tap();
  let msg='';
  if(a===0){
    addRep('ply',1);
    if(x.tp===1){x.m=C(x.m+10,0,100);x.f=C(x.f+4,0,100);msg='Bencil karakteri övgüye bayıldı (Moral +10, Form +4).'}
    else if(x.tp===0){x.m=C(x.m+6,0,100);G.sq=C(G.sq+2,0,100);msg='Lider oyuncu bu desteği tüm takıma yaydı (Moral +6, Soyunma Odası +2).'}
    else{x.m=C(x.m+7,0,100);x.f=C(x.f+5,0,100);msg='Oyuncu motive oldu (Moral +7, Form +5).'}
  }else if(a===1){
    addRep('auth',1);
    if(x.tp===1){x.m=C(x.m-9,0,100);G.sq=C(G.sq-2,0,100);msg='Bencil yıldız sert uyarına ters tepki verdi (Moral -9, Soyunma Odası -2).'}
    else if(x.tp===2){x.m=C(x.m+3,0,100);x.f=C(x.f+7,0,100);msg='Çalışkan karakteri hırslandı (Moral +3, Form +7).'}
    else{x.m=C(x.m-3,0,100);x.f=C(x.f+4,0,100);G.sq=C(G.sq+1,0,100);msg='Oyuncu mesajı aldı (Moral -3, Form +4, Soyunma Odası +1).'}
  }else if(a===2){
    x.prom=2;addRep('ply',1);
    if(x.tp===4){x.m=C(x.m+12,0,100);addRep('yth',1);msg='Genç yetenek ilk 11 sözüyle motive oldu. Önümüzdeki 2 maçta oynatmazsan güvenini kaybedersin.'}
    else{x.m=C(x.m+9,0,100);msg='İlk 11 sözü verdin (Moral +9). Sözünü tutmazsan basına sızdırabilir.'}
  }else{
    const gain=x.tp===2?7:x.tp===4?6:3;
    if(x.tp===4)addRep('yth',1);
    x.xp+=gain;
    let lvl='';
    if(x.xp>=10){
      x.xp-=10;x.o=Math.min(95,x.o+1);getAttrs(x);
      lvl=' OVR +1 yükseldi!';
      SFX.ok();
      G.growthAlerts=[`${x.n} özel antrenmanla parladı: OVR ${x.o-1} → ${x.o} (Pot ${x.pot})`,...(G.growthAlerts||[])].slice(0,3);
    }
    if(x.tp===3){x.k=Math.max(25,x.k-10);msg=`Sakatlığa meyilli olduğu için fazla yoruldu (-10% Kond, +${gain} XP).${lvl}`}
    else{x.k=Math.max(30,x.k-5);msg=`Verimli özel antrenman (+${gain} XP, -5% Kond).${lvl}`}
  }
  save();mdl(id,msg);
}

function swapBonusFor(targetCid,swapId){
  if(swapId===''||swapId===null||swapId===undefined)return{val:0,bonus:0,p:null};
  const sp=DB.pl[+swapId];
  if(!sp||sp.c!==G.cid||sp.loan)return{val:0,bonus:0,p:null};
  const sVal=Math.max(1,Math.round(val(sp)*0.85));
  const oppPl=DB.pl.filter(q=>q.c===targetCid);
  const posCnt=oppPl.filter(q=>q.p===sp.p).length;
  const needLimit=sp.p===0?2:4;
  const oppS=(DB.allClubs[targetCid]&&DB.allClubs[targetCid].s)||65;
  let bonus=0;
  if(posCnt<needLimit)bonus+=8;
  if(sp.o>=oppS-3)bonus+=6;
  else if(sp.o<oppS-10)bonus-=8;
  return{val:sVal,bonus,p:sp};
}

function simPenShootout(){
  let my=0,op=0;
  for(let i=0;i<5;i++){
    if(Math.random()<0.76)my++;
    if(my>op+(5-i-1)||op>my+(5-i))break;
    if(Math.random()<0.76)op++;
    if(op>my+(5-i-1)||my>op+(5-i-1))break;
  }
  while(my===op){const a=Math.random()<0.74?1:0,b=Math.random()<0.74?1:0;my+=a;op+=b}
  return{my,op,won:my>op};
}
