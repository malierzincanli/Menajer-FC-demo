      return`<svg viewBox="0 0 300 175" width="100%" height="175" style="display:block">
        <rect x="6" y="6" width="288" height="163" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.8"/>
        <line x1="150" y1="6" x2="150" y2="169" stroke="rgba(255,255,255,.25)" stroke-width="1.5"/>
        <circle cx="150" cy="88" r="26" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="1.5"/>
        ${lines}
        ${defs.map((d,idx)=>`<circle id="mg-cd-${idx}" cx="${d.x}" cy="${d.y}" r="13" fill="${opC1}" stroke="${opC2}" stroke-width="2"/><text id="mg-cdt-${idx}" x="${d.x}" y="${d.y+4}" text-anchor="middle" fill="#fff" font-size="10" font-weight="900">X</text>`).join('')}
        ${mates.map((m,idx)=>{
          const num=idx+1,hit=num<nextStep,isCur=num===nextStep;
          return`<g style="cursor:pointer" onpointerdown="MG.cntTap(${num})">
            ${isCur?`<circle cx="${m.x}" cy="${m.y}" r="28" fill="rgba(250,204,21,.22)" stroke="#facc15" stroke-width="2.5" stroke-dasharray="5 3"/>`:''}
            <circle cx="${m.x}" cy="${m.y}" r="21" fill="${hit?'#10b981':myC1}" stroke="${hit?'#fff':myC2}" stroke-width="2.8"/>
            <text x="${m.x}" y="${m.y+6}" text-anchor="middle" fill="#fff" font-size="16" font-weight="900">${num}</text>
          </g>`;
        }).join('')}
        ${mgBallSVG(ballPos.x+14,ballPos.y-14,6)}
      </svg>`;
    };

    const cmdTxt=scen===1?'4\'lü Kanat Bindirmesi: 1 → 2 → 3 → 4!':scen===2?'Hareketli Savunma Arasından 1 → 2 → 3!':'Tiki-Taka: Sırayla 1 → 2 → 3 dokun!';
    S(`${mh()}
      <div class="mg-card">
        ${mgTopBar(`PAS ${aObj.pas} · HIZ ${aObj.hiz}`,`${(dur/1000).toFixed(1)}sn Süre`)}
        <div class="mg-cmd">${cmdTxt}</div>
        <div class="mg-timer"><i id="mg-cnt-tm" style="width:100%;transition:width ${dur}ms linear,background-position ${dur}ms linear"></i></div>
        <div class="mg-svg-wrap" id="mg-cnt-svg">${renderPitch()}</div>
      </div>
    `);
    addTo(()=>{const el=$('mg-cnt-tm');if(el){el.style.width='0%';el.style.backgroundPosition='0% 0'}},30);

    if(scen===2){
      addIv(()=>{
        if(done)return;
        defs.forEach((d,idx)=>{
          d.x+=d.dx;if(d.x>255||d.x<45)d.dx*=-1;
          const c=$('mg-cd-'+idx),t=$('mg-cdt-'+idx);
          if(c)c.setAttribute('cx',d.x.toFixed(1));
          if(t)t.setAttribute('x',d.x.toFixed(1));
        });
      },30);
    }

    this.cntTap=(num)=>{
      if(done||this.locked)return;
      if(num===nextStep){
        SFX.kick();nextStep++;
        const wrap=$('mg-cnt-svg');if(wrap)wrap.innerHTML=renderPitch();
        if(nextStep>need){
          done=true;
          const elapsed=Date.now()-startTs;
          const isPerfect=elapsed<dur*0.52;
          const prob=C(dc.mgGoalCap-0.06+(aObj.pas-70)*0.004+(isPerfect?0.08:0),0.22,dc.mgGoalCap+0.06);
          const isGoal=Math.random()<prob;
          const missKind=Math.random()<0.5?'post':'tip';
          if(!isGoal&&missKind==='post')SFX.post();
          this.finish(
            true,isGoal?'TİKİ-TAKA GOLÜ!':(missKind==='post'?'DİREKTEN DÖNDÜ!':'PARMAK UCUYLA ÇELDİ!'),
            isGoal?`${need}'lü pas zinciri ağlarla buluştu!`:'Kusursuz paslaşma sonrası şut kıl payı kaçtı, momentum senin!',
            ()=>{
              const M=G.m;M.sh++;M.xgF=+(M.xgF+0.34).toFixed(2);
              if(isGoal){M.sotF++;const s=scr();M.gf++;M.evMarks.push({m:M.min,type:'gf'});SFX.goal();addLog('gol',`Kontra pas zinciriyle ${s} golü attı!`)}
              else{M.mo=C(M.mo+10,8,92);M.ba+=0.10;addLog(missKind==='post'?'direk':'taktik','Harika pas zinciri, şut kıl payı kaçtı.')}
            },
            isGoal?'':nearMissSVG(missKind),isPerfect
          );
        }
      }else{
        done=true;
        this.finish(false,'PAS KESİLDİ!','Yanlış sıraya dokundun, rakip topu kaptı.',()=>{G.m.ba-=0.06;addLog('taktik','Kontra atakta pas hatası yapıldı.')});
      }
    };

    addTo(()=>{
      if(!done&&!this.locked){done=true;this.finish(false,'SÜRE DOLDU!','Rakip savunma geriye dönüp kapandı.',()=>{G.m.ba-=0.05;addLog('taktik','Kontra fırsatında geç kalındı.')})}
    },dur);
  },

  /* 3) DARALAN MÜDAHALE HALKASI (ref) */
  play_ref(){
    const aObj=getAttrs(this.actor);
    const dc=diffCfg();
    const scen=R(0,1);
    const targetR=scen===1?28:34;
    const tol=C(((scen===1?8.2:9.5)+(aObj.def-65)*0.22+(aObj.fiz-65)*0.08+(G.trn===1?3:0))*dc.mgTimeMult,6.5,17);
    const speed=C(((scen===1?1.75:1.5)-(aObj.def-65)*0.012)/dc.mgTimeMult,1.05,2.35);
    let r=86,done=false;

    S(`${mh()}
      <div class="mg-card">
        ${mgTopBar(`DEF ${aObj.def} · FİZ ${aObj.fiz}`,'Yeşil halkada dokun')}
        <div class="mg-cmd">${scen===1?'Ceza Sahası Çizgisi Blokajı':'Kayarak Müdahale'}</div>
        <div class="mg-svg-wrap" id="mg-ref-area" style="cursor:pointer">
          <svg viewBox="0 0 200 180" width="100%" height="180" style="display:block">
            <line x1="0" y1="90" x2="200" y2="90" stroke="rgba(255,255,255,.18)" stroke-width="1.5"/>
            <circle cx="100" cy="90" r="${targetR}" fill="rgba(16,185,129,.12)" stroke="#10b981" stroke-width="${tol*1.4}" opacity=".42"/>
            <circle cx="100" cy="90" r="${targetR}" fill="none" stroke="#4ade80" stroke-width="2.5"/>
            <circle id="mg-ref-ring" cx="100" cy="90" r="${r}" fill="none" stroke="#facc15" stroke-width="4.5"/>
            ${mgBallSVG(100,90,10)}
          </svg>
        </div>
        <button class="ok-btn" id="mg-ref-btn" style="min-height:50px;font-size:15px">${ico('shield',16)} ${scen===1?'BLOKAJ YAP':'MÜDAHALE ET'}</button>
      </div>
    `);

    const ringEl=$('mg-ref-ring');
    addIv(()=>{
      if(done)return;
      r-=speed;
      if(ringEl)ringEl.setAttribute('r',Math.max(8,r).toFixed(1));
      if(r<=12){
        done=true;const concede=Math.random()<0.48;
        this.finish(false,concede?'GOL YEDİN!':'GEÇ KALDIN!',concede?'Rakip boşluktan yararlanıp golü attı.':'Rakip şut çekti, top direği yaladı.',()=>{
          const M=G.m;M.sa++;M.xgA=+(M.xgA+0.28).toFixed(2);
          if(concede){M.sotA++;M.ga++;M.evMarks.push({m:M.min,type:'ga'});SFX.concede();addLog('yenilen',`${CN(M.n.op)} savunma açığından gol buldu.`)}
          else addLog('taktik','Müdahalede geç kalındı, şut auta çıktı.');
        });
      }
    },22);

    const tackle=()=>{
      if(done||this.locked)return;
      done=true;clearTimers();
      const diff=Math.abs(r-targetR);
      if(diff<=tol){
        const isPerfect=diff<=tol*0.42;
        this.finish(true,scen===1?'KRİTİK BLOKAJ!':'TEMİZ MÜDAHALE!','Topu tertemiz kestin, tehlike bitti!',()=>{
          G.m.bd-=0.16;G.m.mo=C(G.m.mo+8,8,92);addLog('kurt','Zamanlı müdahaleyle tehlikeli atak kesildi.');
        },'',isPerfect);
      }else if(r>targetR+tol){
        const foulGoal=Math.random()<0.28;
        this.finish(false,'ERKEN MÜDAHALE!','Tehlikeli faul yaptın, sarı kart ve rakip duran top kazandı.',()=>{
          const M=G.m;if(this.actor)issueYellowCard(this.actor);
          if(foulGoal){M.ga++;M.sa++;M.sotA++;M.xgA=+(M.xgA+0.30).toFixed(2);M.evMarks.push({m:M.min,type:'ga'});addLog('yenilen','Erken faul sonrası duran toptan gol yedin.')}
        });
      }else{
        const concede=Math.random()<0.45;
        this.finish(false,concede?'GOL YEDİN!':'ÇALIMI YEDİN!',concede?'Rakip seni geçip ağları buldu.':'Rakip geçti ama şutu çerçeveyi bulmadı.',()=>{
          const M=G.m;M.sa++;M.xgA=+(M.xgA+0.25).toFixed(2);
          if(concede){M.sotA++;M.ga++;M.evMarks.push({m:M.min,type:'ga'});SFX.concede();addLog('yenilen',`${CN(M.n.op)} bire birde geçip gol attı.`)}
          else addLog('taktik','Rakip savunmayı geçti ama şut dışarı çıktı.');
        });
      }
    };
    const b1=$('mg-ref-btn'),b2=$('mg-ref-area');
    if(b1)b1.onpointerdown=tackle;if(b2)b2.onpointerdown=tackle;
  },

  /* 4) KALECİ REFLEKS KURTARIŞI (save) — Şut yönü ipucu + kaleci uçuş animasyonu */
  play_save(){
    const aObj=getAttrs(this.actor);
    const dc=diffCfg();
    const scen=R(0,1);
    const cols=scen===1?4:3;
    const labels=scen===1?['SOL ÜST','SAĞ ÜST','SOL ALT','SAĞ ALT']:['SOL','ORTA','SAĞ'];
    const reactMs=Math.round(C(Math.round(920+(aObj.def-70)*12),820,1180)*dc.mgTimeMult);
    const fakeIdx=R(0,cols-1);
    const target=(fakeIdx+R(1,cols-1))%cols;
    let armed=false,armTs=0,done=false;

    S(`${mh()}
      <div class="mg-card">
        ${mgTopBar(`KALECİ DEF ${aObj.def}`,`${reactMs}ms Refleks`)}
        <div class="mg-cmd" id="mg-sv-cmd">${scen===1?'Yalancı şuta kanma! Gerçek KIRMIZI köşeyi bekle!':'Şut yönüne hazır ol!'}</div>
        <div class="mg-goal-grid" style="grid-template-columns:repeat(${scen===1?2:3},1fr);min-height:130px">
          ${labels.map((lb,i)=>`<button class="mg-zone" style="min-height:${scen===1?64:112}px;font-size:13px" id="mg-sv-${i}" onpointerdown="MG.saveTap(${i})">${ico('shield',20)}<span>${lb}</span></button>`).join('')}
        </div>
      </div>
    `);

    const armReal=()=>{
      if(done||this.locked)return;
      armed=true;armTs=Date.now();SFX.kick();
      const cmd=$('mg-sv-cmd'),el=$('mg-sv-'+target);
      if(cmd)cmd.textContent='KIRMIZI KÖŞEYE UÇ!';
      if(el){el.classList.add('hot');el.innerHTML=`${ico('ball',24)}<span>ŞUT BURADA!</span>`}
      addTo(()=>{
        if(!done&&!this.locked){
          done=true;
          this.finish(false,'GOL YEDİN!','Refleks kurtarışı için geç kaldın.',()=>{
            const M=G.m;M.ga++;M.sa++;M.sotA++;M.xgA=+(M.xgA+0.36).toFixed(2);M.evMarks.push({m:M.min,type:'ga'});SFX.concede();
            addLog('yenilen',`${CN(M.n.op)} karşı karşıya pozisyonda golü attı.`);
          });
        }
      },reactMs);
    };

    if(scen===1){
      addTo(()=>{
        if(done||this.locked)return;
        const fk=$('mg-sv-'+fakeIdx);
        if(fk){fk.classList.add('fake');fk.innerHTML=`${ico('zap',20)}<span>SAHTE!</span>`}
        addTo(()=>{if(fk){fk.classList.remove('fake');fk.innerHTML=`${ico('shield',20)}<span>${labels[fakeIdx]}</span>`}armReal()},360);
      },320);
    }else addTo(armReal,400);

    this.saveTap=(i)=>{
      if(done||this.locked)return;
      if(!armed){
        done=true;clearTimers();
        this.finish(false,'YALANCI ŞUTA DÜŞTÜN!','Çok erken atladın, rakip boş köşeye bıraktı!',()=>{
          const M=G.m;M.ga++;M.sa++;M.sotA++;M.xgA=+(M.xgA+0.36).toFixed(2);M.evMarks.push({m:M.min,type:'ga'});SFX.concede();
          addLog('yenilen',`${CN(M.n.op)} yalancı şutla kaleciyi yatırdı.`);
        });
        return;
      }
      done=true;clearTimers();
      if(i===target){
        const isPerfect=(Date.now()-armTs)<reactMs*0.52;
        SFX.save();
        this.finish(true,'MUHTEŞEM KURTARIŞ!','Kalecin doksandan çıkardı!',()=>{
          const M=G.m;M.sa++;M.sotA++;M.xgA=+(M.xgA+0.30).toFixed(2);M.mo=C(M.mo+12,8,92);M.bd-=0.12;
          addLog('kurt',`${this.actor?this.actor.n:'Kalecin'} maçı kurtaran refleks kurtarış yaptı!`);
        },nearMissSVG('tip'),isPerfect);
      }else{
        this.finish(false,'TERS KÖŞE!','Yanlış köşeye uçtun, top ağlarda!',()=>{
          const M=G.m;M.ga++;M.sa++;M.sotA++;M.xgA=+(M.xgA+0.36).toFixed(2);M.evMarks.push({m:M.min,type:'ga'});SFX.concede();
          addLog('yenilen',`${CN(M.n.op)} kaleciyi ters köşeye yatırdı.`);
        });
      }
    };
  },

  /* 5) KORNER (corner) — Canlı kesikli yay önizleme + pointerCapture/cancel */
  play_corner(){
    const aObj=getAttrs(this.actor);
    const scen=R(0,2);
    const endPts=[{x:70,y:52},{x:38,y:102},{x:108,y:86}][scen];
    const reqGest=scen===0?'up':'side';
    const scenNames=['Ön Direk: Yay çiz → Yukarı FLICK','Arka Direk: Yay çiz → Yan FLICK','Yerden Kesme: Yay çiz → Yan FLICK'];
    let phase=1,ctrl={x:185,y:scen===2?120:32},drawing=false,done=false;

    S(`${mh()}
      <div class="mg-card">
        ${mgTopBar(`PAS ${aObj.pas} · Korner Uzmanı`,scenNames[scen])}
        <div class="mg-cmd" id="mg-cr-cmd">1. Adım: Parmağını sürükleyip ortanın yayını çiz!</div>
        <div class="mg-svg-wrap" id="mg-cr-area">
          <svg id="mg-cr-svg" viewBox="0 0 300 170" width="100%" height="170" style="display:block">
            <rect x="10" y="10" width="170" height="120" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="2"/>
            <rect x="10" y="40" width="50" height="60" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="2"/>
            <path id="mg-cr-path" d="M280 155 Q${ctrl.x} ${ctrl.y} ${endPts.x} ${endPts.y}" fill="none" stroke="#fde047" stroke-width="2.8" stroke-dasharray="6 5"/>
            <circle cx="${endPts.x}" cy="${endPts.y}" r="22" fill="rgba(16,185,129,.28)" stroke="#4ade80" stroke-width="3"/>
            <circle id="mg-cr-ball" cx="280" cy="155" r="8" fill="#fff" stroke="#111" stroke-width="2"/>
          </svg>
        </div>
        <div class="m" id="mg-cr-hint" style="text-align:center;color:rgba(255,255,255,.82)">Saha üzerinde sürükleyip bırakınca orta açılır.</div>
      </div>
    `);

    const svgEl=$('mg-cr-svg'),pathEl=$('mg-cr-path'),ballEl=$('mg-cr-ball'),cmdEl=$('mg-cr-cmd'),hintEl=$('mg-cr-hint');
    let t=0,flickStart=null;
    const tol=C(0.11+(aObj.pas-65)*0.0028+(G.trn===3?0.025:0),0.09,0.18);
    const ptAt=u=>({x:(1-u)*(1-u)*280+2*(1-u)*u*ctrl.x+u*u*endPts.x,y:(1-u)*(1-u)*155+2*(1-u)*u*ctrl.y+u*u*endPts.y});
    const getPt=ev=>{const r=svgEl.getBoundingClientRect();return{x:(ev.clientX-r.left)*(300/r.width),y:(ev.clientY-r.top)*(170/r.height)}};

    const launchFlight=()=>{
      if(phase!==1||done)return;
      phase=2;SFX.kick();
      if(cmdEl)cmdEl.textContent=reqGest==='up'?'2. Adım: Top yeşildeyken YUKARI FLICK!':'2. Adım: Top yeşildeyken YANA FLICK!';
      if(hintEl)hintEl.textContent=reqGest==='up'?'Parmağını yukarı çek = Yüksek Kafa':'Parmağını yana çek = Plase Vuruş';
      addIv(()=>{
        if(done)return;
        t+=0.017;const p=ptAt(Math.min(1,t));
        if(ballEl){ballEl.setAttribute('cx',p.x.toFixed(1));ballEl.setAttribute('cy',p.y.toFixed(1))}
        if(t>=1.08){done=true;this.finish(false,'ORTA GEÇTİ!','Kafa vuruşu zamanlamasını kaçırdın.',()=>{addLog('taktik','Korner ortası ceza sahasından taca çıktı.')})}
      },22);
    };

    const resolveFlick=(dx,dy)=>{
      if(done||this.locked)return;
      done=true;clearTimers();SFX.kick();
      const diff=Math.abs(t-0.88);
      const isUp=dy<-16&&Math.abs(dy)>=Math.abs(dx)*0.8;
      const isSide=Math.abs(dx)>16&&Math.abs(dx)>=Math.abs(dy)*0.7;
      const gestMatch=(reqGest==='up'&&isUp)||(reqGest==='side'&&isSide);
      if(diff<=tol){
        const dc=diffCfg();
        const isPerfect=gestMatch&&diff<=tol*0.52;
        const goalProb=C(dc.mgGoalCap-0.06+(aObj.pas-70)*0.004+(gestMatch?0.08:-0.08),0.20,dc.mgGoalCap+0.06);
        const isGoal=Math.random()<goalProb;
        const missKind=Math.random()<0.5?'post':'tip';
        if(!isGoal&&missKind==='post')SFX.post();
        this.finish(
          true,isGoal?'KORNER GOLÜ!':(missKind==='post'?'ÜST DİREKTEN DÖNDÜ!':'PARMAK UCUYLA ÇELDİ!'),
          isGoal?(isUp?'Harika yükselip yüksek kafayla ağları buldun!':'Nefis plase vuruş köşeye gitti!'):'Harika vuruş kıl payı gol olmadı!',
          ()=>{
            const M=G.m;M.sh++;M.xgF=+(M.xgF+0.30).toFixed(2);
            if(isGoal){M.sotF++;const s=scr();M.gf++;M.evMarks.push({m:M.min,type:'gf'});SFX.goal();addLog('gol',`Kornerden ${s} fileleri sarstı!`)}
            else{M.mo=C(M.mo+7,8,92);addLog(missKind==='post'?'direk':'taktik','Korner vuruşu kıl payı kaçtı!')}
          },
          isGoal?'':nearMissSVG(missKind),isPerfect
        );
      }else this.finish(false,'ISKALADIN!','Topa yeşil bölgede doğru anda vuramadın.',()=>{addLog('taktik','Kornerde savunma topu uzaklaştırdı.')});
    };

    if(svgEl){
      svgEl.onpointerdown=ev=>{
        if(done||this.locked)return;
        if(svgEl.setPointerCapture)try{svgEl.setPointerCapture(ev.pointerId)}catch(e){}
        const p=getPt(ev);
        if(phase===1){drawing=true;ctrl={x:C(p.x,70,260),y:C(p.y,8,150)}}
        else if(phase===2)flickStart=p;
      };
      svgEl.onpointermove=ev=>{
        if(done||!drawing||phase!==1)return;
        const p=getPt(ev);ctrl={x:C(p.x,70,260),y:C(p.y,8,150)};
        if(pathEl)pathEl.setAttribute('d',`M280 155 Q${ctrl.x.toFixed(1)} ${ctrl.y.toFixed(1)} ${endPts.x} ${endPts.y}`);
      };
      svgEl.onpointerup=ev=>{
        if(done||this.locked)return;
        if(phase===1&&drawing){drawing=false;launchFlight()}
        else if(phase===2&&flickStart){const end=getPt(ev);resolveFlick(end.x-flickStart.x,end.y-flickStart.y);flickStart=null}
      };
      svgEl.onpointercancel=()=>{drawing=false;flickStart=null};
    }
    addTo(()=>{if(phase===1&&!done&&!this.locked)launchFlight()},2600);
  },

  /* 6) PRES TUZAĞI (press) */
  play_press(){
    const aObj=getAttrs(this.actor);
    const isFour=Math.random()<0.5;
    const [opC1,opC2]=clubColors(G&&G.m?G.m.n.op:1);
    const pos=isFour?[{x:52,y:105},{x:150,y:122},{x:248,y:105},{x:150,y:38}]:[{x:60,y:95},{x:150,y:52},{x:240,y:95}];
    let holder=0,weakAt=-1,weakTs=0,step=0,done=false;
    const weakStep=R(2,3);

    const draw=()=>{
      const h=pos[holder];
      return`<svg viewBox="0 0 300 155" width="100%" height="155" style="display:block">
        <line x1="${pos[0].x}" y1="${pos[0].y}" x2="${pos[1].x}" y2="${pos[1].y}" stroke="rgba(255,255,255,.26)" stroke-width="2" stroke-dasharray="4 4"/>
        <line x1="${pos[1].x}" y1="${pos[1].y}" x2="${pos[2].x}" y2="${pos[2].y}" stroke="rgba(255,255,255,.26)" stroke-width="2" stroke-dasharray="4 4"/>
        ${isFour?`<line x1="${pos[1].x}" y1="${pos[1].y}" x2="${pos[3].x}" y2="${pos[3].y}" stroke="rgba(255,255,255,.26)" stroke-width="2" stroke-dasharray="4 4"/>`:''}
        ${pos.map((p,i)=>{
          const isWeak=i===weakAt;
          const lbl=isWeak?'KAP!':(isFour&&i===3?'KL':'DEF');
          return`<g style="cursor:pointer" onpointerdown="MG.pressTap(${i})">
            ${isWeak?`<circle cx="${p.x}" cy="${p.y}" r="31" fill="rgba(250,204,21,.28)" stroke="#facc15" stroke-width="3.5"/>`:''}
            <circle cx="${p.x}" cy="${p.y}" r="22" fill="${isWeak?'#eab308':(isFour&&i===3?'#f59e0b':opC1)}" stroke="${isWeak?'#fff':opC2}" stroke-width="2.5"/>
            <text x="${p.x}" y="${p.y+5}" text-anchor="middle" fill="${isWeak||(isFour&&i===3)?'#111':'#fff'}" font-size="11" font-weight="900">${lbl}</text>
          </g>`;
        }).join('')}
        ${mgBallSVG(h.x+16,h.y-16,6.5)}
      </svg>`;
    };

    S(`${mh()}
      <div class="mg-card">
        ${mgTopBar(`HIZ ${aObj.hiz} · FİZ ${aObj.fiz}`,'Zayıf kontrolü yakala')}
        <div class="mg-cmd" id="mg-pr-cmd">Sarı "ZAYIF KONTROL" anını bekle!</div>
        <div class="mg-timer"><i id="mg-pr-tm" style="width:100%;transition:width 4500ms linear,background-position 4500ms linear"></i></div>
        <div class="mg-svg-wrap" id="mg-pr-svg">${draw()}</div>
      </div>
    `);
    addTo(()=>{const el=$('mg-pr-tm');if(el){el.style.width='0%';el.style.backgroundPosition='0% 0'}},30);

    addIv(()=>{
      if(done)return;
      step++;
      if(isFour&&step===weakStep)holder=3;
      else holder=(holder+R(1,pos.length-1))%pos.length;
      weakAt=(step===weakStep)?holder:-1;
      if(weakAt>=0)weakTs=Date.now();
      const cmd=$('mg-pr-cmd'),svg=$('mg-pr-svg');
      if(cmd)cmd.textContent=weakAt>=0?(isFour&&holder===3?'KALECİ ZAYIF KONTROL! HEMEN KAP!':'ZAYIF KONTROL! HEMEN DOKUN!'):'Paslaşmayı izle, sabırlı ol...';
      if(svg)svg.innerHTML=draw();
    },1100);

    this.pressTap=(i)=>{
      if(done||this.locked)return;
      done=true;clearTimers();
      if(i===weakAt){
        const dc=diffCfg();
        const isPerfect=(Date.now()-weakTs)<Math.round(540*dc.mgTimeMult);
        const goalP=C(dc.mgGoalCap-0.06+(isPerfect?0.08:0)+(aObj.hiz-70)*0.004,0.20,dc.mgGoalCap+0.06);
        const isGoal=Math.random()<goalP;
        const missKind=Math.random()<0.5?'post':'tip';
        if(!isGoal&&missKind==='post')SFX.post();
        this.finish(
          true,isGoal?'PRES GOLÜ!':'ÖNDE TOPU KAPTIN!',
          isGoal?'Önde presle topu kapıp hemen cezalandırdın!':'Hatalı pastan kaptığın top kıl payı dışarı çıktı!',
          ()=>{
            const M=G.m;M.sh++;M.xgF=+(M.xgF+0.34).toFixed(2);
            if(isGoal){M.sotF++;const s=scr();M.gf++;M.evMarks.push({m:M.min,type:'gf'});SFX.goal();addLog('gol',`Önde presle topu kapan ${s} golü attı!`)}
            else{M.ba+=0.18;M.mo=C(M.mo+10,8,92);addLog(missKind==='post'?'direk':'taktik','Önde pres tuzağı tuttu, rakip bunaldı.')}
          },
          isGoal?'':nearMissSVG(missKind),isPerfect
        );
      }else this.finish(false,'PRES BOŞA ÇIKTI!','Rakip kolayca pasla baskıdan çıktı.',()=>{G.m.bd+=0.08;addLog('taktik','Erken pres hamlesi boşluk bıraktı.')});
    };

    addTo(()=>{if(!done&&!this.locked){done=true;this.finish(false,'RAKİP BASKIDAN ÇIKTI!','4.5 saniyede topu kapamadın.',()=>{addLog('taktik','Rakip savunma baskıdan rahat çıktı.')})}},4500);
  },

  /* 7) NABIZ DENGELEME (kart) */
  play_kart(){
    const x=this.actor||{id:0,n:'Yıldız Oyuncu'};
    const aObj=getAttrs(x);
    const scen=R(0,1);
    let valPos=50,safeMs=0,centerMs=0,done=false,holding=false,lastTapTs=0;
    const needMs=2200;
    const basePull=scen===1?1.08:0.95;
    const pull=(this.demoMode?basePull:basePull+Math.max(0,G.m.yc)*0.12);

    S(`${mh()}
      <div class="mg-card">
        ${mgTopBar(`FİZ ${aObj.fiz} · Soğukkanlılık`,'İbreyi yeşilde tut')}
        <div class="mg-cmd">${E(x.n)} ${scen===1?'rakip tahrikiyle çileden çıktı!':'hakeme itiraz ediyor!'}</div>
        <div class="mg-bar" style="height:36px">
          <div style="position:absolute;left:0;top:0;bottom:0;width:14%;background:rgba(59,130,246,.55)"></div>
          <div class="mg-zn" style="left:28%;width:42%"></div>
          <div style="position:absolute;right:0;top:0;bottom:0;width:14%;background:rgba(239,68,68,.55)"></div>
          <div class="mg-mk" id="mg-kt-mk" style="left:50%"></div>
        </div>
        <div class="r" style="font-size:11px;opacity:.85;margin-bottom:4px">
          <span style="color:#93c5fd">Pasif (ba-)</span>
          <span style="color:#4ade80">HEDEF BANT (28-70)</span>
          <span style="color:#fca5a5">Kırmızı Kart</span>
        </div>
        <div class="r" style="font-size:12px;margin:4px 0"><span>Denge Süresi</span><b class="num" id="mg-kt-st">0.0 / 2.2 sn</b></div>
        <div class="mg-timer"><i id="mg-kt-pr" style="width:0%;background:#10b981"></i></div>
        <button class="ok-btn" id="mg-kt-btn" style="min-height:56px;font-size:16px;margin-top:8px">${ico('shield',18)} BASILI TUT (SAKİNLEŞTİR)</button>
      </div>
    `);

    const mkEl=$('mg-kt-mk'),stEl=$('mg-kt-st'),prEl=$('mg-kt-pr'),btn=$('mg-kt-btn');
    addIv(()=>{
      if(done)return;
      valPos+=holding?-1.18:pull;
      if(valPos>=90){
        done=true;
        this.finish(false,'KIRMIZI KART!',`${x.n} ${scen===1?'rakibine yaptığı hareketten':'hakeme itirazdan'} atıldı (1 maç ceza).`,()=>{handleRedCard(x,'kırmızı kartla oyun dışı kaldı')});
        return;
      }
      if(valPos<=12){
        done=true;
        this.finish(false,'FAZLA PASİFLEŞTİ!',`${x.n} ikili mücadelelerden kaçınmaya başladı (Hücum -).`,()=>{G.m.ba-=0.14;addLog('taktik',`${x.n} fazla sakinleştirildi, sahada pasif kaldı.`)});
        return;
      }
      if(valPos>=28&&valPos<=70){
        safeMs+=30;if(valPos>=38&&valPos<=60)centerMs+=30;
        if(safeMs>=needMs){
          done=true;const isPerfect=centerMs>=1400;
          this.finish(true,'OYUNCU SAKİNLEŞTİ!',`${x.n} öfkesini kusursuz dengeledi, kart önlendi.`,()=>{addLog('kart',`${x.n} sakinleştirildi, kırmızı kart tehlikesi atlatıldı.`)},'',isPerfect);
          return;
        }
      }
      if(mkEl)mkEl.style.left=C(valPos,2,94)+'%';
      if(stEl)stEl.textContent=`${(safeMs/1000).toFixed(1)} / 2.2 sn`;
      if(prEl)prEl.style.width=`${Math.min(100,(safeMs/needMs)*100)}%`;
    },30);

    if(btn){
      btn.onpointerdown=()=>{
        if(done||this.locked)return;
        const now=Date.now();
        if(now-lastTapTs<250){valPos=Math.min(89,valPos+6.5);SFX.bad()}
        else SFX.tap();
        lastTapTs=now;holding=true;btn.style.background='#047857';
      };
      const release=()=>{holding=false;if(btn)btn.style.background=''};
      btn.onpointerup=release;btn.onpointerleave=release;btn.onpointercancel=release;
    }
  },

  /* 9) BARAJ KUR & ZIPLA (wall) — Kulüp renkli baraj oyuncuları + şut yönü ipucu */
  play_wall(){
    const aObj=getAttrs(this.actor);
    const [myC1,myC2]=clubColors(G?G.cid:0);
    const shotSide=P([0,1,2]);
    const sideX=[85,150,215];
    let wallSide=1,wallHeight=35,charging=false,phase=1,prog=0,done=false;

    S(`${mh()}
      <div class="mg-card">
        ${mgTopBar(`FİZ ${aObj.fiz} · Baraj Lideri`,'Tarafı seç & yükselt')}
        <div class="mg-cmd" id="mg-wl-cmd">1. Adım: Şut tarafını seç & barajı yükselt!</div>
        <div class="g3" id="mg-wl-sides" style="margin-bottom:6px">
          ${['SOL','ORTA','SAĞ'].map((lb,i)=>`<button class="x center sm ${i===1?'on':''}" id="wls-${i}" style="width:100%;min-height:38px" onpointerdown="MG.wallSide(${i})">${lb}</button>`).join('')}
        </div>
        <div class="mg-svg-wrap" id="mg-wl-area">
          <svg viewBox="0 0 300 155" width="100%" height="155" style="display:block">
            <rect x="20" y="12" width="260" height="18" fill="rgba(255,255,255,.08)" stroke="#fff" stroke-width="2.5"/>
            <line x1="150" y1="142" x2="${sideX[shotSide]}" y2="21" stroke="rgba(239,68,68,.38)" stroke-width="2" stroke-dasharray="4 4"/>
            <circle cx="${sideX[shotSide]}" cy="21" r="7" fill="rgba(239,68,68,.55)"/>
            <g id="mg-wl-bar" transform="translate(0,0)">
              <rect x="105" y="64" width="90" height="14" rx="7" fill="${myC1}" stroke="${myC2}" stroke-width="2.2"/>
              <text x="150" y="74" text-anchor="middle" fill="#fff" font-size="8.5" font-weight="900">BARAJ</text>
            </g>
            <circle id="mg-wl-ball" cx="150" cy="142" r="8" fill="#fff" stroke="#111" stroke-width="2"/>
          </svg>
        </div>
        <div class="r" style="font-size:11.5px;margin:2px 0"><span>Baraj Yüksekliği</span><b class="num" id="mg-wl-ht">35%</b></div>
        <button class="ok-btn" id="mg-wl-btn" style="min-height:52px;font-size:15px">${ico('shield',18)} BARAJI KUR (BASILI TUT)</button>
      </div>
    `);

    const barEl=$('mg-wl-bar'),htEl=$('mg-wl-ht'),btn=$('mg-wl-btn'),cmd=$('mg-wl-cmd'),ball=$('mg-wl-ball');
    this.wallSide=i=>{
      if(phase!==1||done)return;
      SFX.tap();wallSide=i;
      [0,1,2].forEach(k=>{const el=$('wls-'+k);if(el)el.className='x center sm'+(k===i?' on':'')});
      if(barEl)barEl.setAttribute('transform',`translate(${sideX[i]-150},0)`);
    };

    const startShot=()=>{
      if(phase!==1||done||this.locked)return;
      phase=2;charging=false;clearTimers();SFX.kick();
      if(cmd)cmd.textContent='2. Adım: Top geliyor — BARAJDA ZIPLA!';
      if(btn)btn.innerHTML=`${ico('shield',18)} ZIPLA!`;
      addIv(()=>{
        if(done)return;
        prog+=0.019;
        const curX=150+(sideX[shotSide]-150)*prog,curY=142-prog*122;
        if(ball){ball.setAttribute('cx',curX.toFixed(1));ball.setAttribute('cy',curY.toFixed(1))}
        if(prog>=1){
          done=true;
          this.finish(false,'BARAJI AŞTI!','Zıplamakta geç kaldın, top üstten ağlarda!',()=>{
            const M=G.m;M.ga++;M.sa++;M.sotA++;M.xgA=+(M.xgA+0.30).toFixed(2);M.evMarks.push({m:M.min,type:'ga'});SFX.concede();
            addLog('yenilen','Rakip frikikte barajın üzerinden golü attı.');
          });
        }
      },22);
    };

    addIv(()=>{
      if(phase!==1||done)return;
      if(charging){
        wallHeight=Math.min(100,wallHeight+3.2+(aObj.fiz-65)*0.05);
        if(htEl)htEl.textContent=Math.round(wallHeight)+'%';
      }
    },30);
    addTo(()=>startShot(),1900);

    if(btn){
      btn.onpointerdown=()=>{
        if(done||this.locked)return;
        if(phase===1){charging=true;SFX.tap()}
        else if(phase===2){
          done=true;clearTimers();
          if(barEl)barEl.setAttribute('transform',`translate(${sideX[wallSide]-150},-8)`);
          const sweet=0.70,tol=0.12+(wallHeight>=70?0.03:0)+(aObj.fiz-65)*0.0015;
          const timed=Math.abs(prog-sweet)<=tol;
          const sideOk=(wallSide===shotSide)||Math.abs(wallSide-shotSide)===1&&wallHeight>=75;
          if(timed&&sideOk){
            const isPerfect=wallSide===shotSide&&Math.abs(prog-sweet)<=0.06;
            SFX.save();
            this.finish(true,'BARAJDAN DÖNDÜ!','Doğru taraf ve zamanlamayla frikiği engelledin!',()=>{
              G.m.sa++;G.m.bd-=0.14;G.m.mo=C(G.m.mo+8,8,92);addLog('kurt','Frikikte baraj kurulumu ve zamanlaması kusursuzdu.');
            },'',isPerfect);
          }else{
            const reason=!sideOk?'Baraj yanlış tarafta kaldı!':(prog<sweet?'Erken zıpladın, top altından geçti!':'Geç kaldın, top üstten ağlarda!');
            this.finish(false,'FRİKİK GOLÜ!',reason,()=>{
              const M=G.m;M.ga++;M.sa++;M.sotA++;M.xgA=+(M.xgA+0.30).toFixed(2);M.evMarks.push({m:M.min,type:'ga'});SFX.concede();
              addLog('yenilen','Rakip frikikten gol buldu.');
            });
          }
        }
      };
      const releaseWall=()=>{if(phase===1){const wasCharging=charging;charging=false;if(wasCharging&&wallHeight>=55)startShot()}};
      btn.onpointerup=releaseWall;btn.onpointerleave=()=>{charging=false};btn.onpointercancel=()=>{charging=false};
    }
  },

  /* 10) OFSAYT TUZAĞI (offside) — Kulüp renkli savunma hattı + pointerCapture/cancel */
  play_offside(){
    const aObj=getAttrs(this.actor);
    const dc=diffCfg();
    const [myC1,myC2]=clubColors(G?G.cid:0);
    const [opC1,opC2]=clubColors(G&&G.m?G.m.n.op:1);
    const maxDelta=Math.round(C(Math.round(40+(aObj.def-68)*0.5),34,50)*dc.mgTimeMult);
    let sx=32,lineX=145,dragging=false,done=false;
    const speed=(R(32,44)/10)/dc.mgTimeMult;

    S(`${mh()}
      <div class="mg-card">
        ${mgTopBar(`DEF ${aObj.def} · Savunma Şefi`,`2–${maxDelta}px Aralık`)}
        <div class="mg-cmd">Kırmızı çizgiyi yatay sürükleyip forvetin önüne bırak!</div>
        <div class="mg-svg-wrap" id="mg-of-area">
          <svg id="mg-of-svg" viewBox="0 0 300 140" width="100%" height="140" style="display:block">
            <rect x="6" y="6" width="288" height="128" fill="none" stroke="rgba(255,255,255,.32)" stroke-width="1.5"/>
            <line id="mg-of-ln" x1="${lineX}" y1="6" x2="${lineX}" y2="134" stroke="#ef4444" stroke-width="4" stroke-dasharray="6 4"/>
            ${[35,70,105].map((cy,i)=>`<circle id="mg-of-d${i}" cx="${lineX}" cy="${cy}" r="10" fill="${myC1}" stroke="${myC2}" stroke-width="2"/>`).join('')}
            <circle id="mg-of-st" cx="${sx}" cy="70" r="11" fill="${opC1}" stroke="${opC2}" stroke-width="2.2"/>
            <text id="mg-of-st-t" x="${sx}" y="74" text-anchor="middle" fill="#fff" font-size="8.5" font-weight="900">FOR</text>
          </svg>
        </div>
        <div class="m" style="text-align:center;color:rgba(255,255,255,.82)">Forvet çizgiyi 2–${maxDelta} px geçerken bırakırsan OFSAYT!</div>
      </div>
    `);

    const svgEl=$('mg-of-svg'),st=$('mg-of-st'),stt=$('mg-of-st-t'),ln=$('mg-of-ln');
    const setLine=nx=>{
      lineX=C(nx,60,260);
      if(ln){ln.setAttribute('x1',lineX.toFixed(1));ln.setAttribute('x2',lineX.toFixed(1))}
      [0,1,2].forEach(i=>{const d=$('mg-of-d'+i);if(d)d.setAttribute('cx',lineX.toFixed(1))});
    };

    addIv(()=>{
      if(done)return;
      sx+=speed;
      if(st)st.setAttribute('cx',sx.toFixed(1));
      if(stt)stt.setAttribute('x',sx.toFixed(1));
      if(sx>=286){
        done=true;
        this.finish(false,'OFSAYT BOZULDU!','Savunma çizgiyi kuramadı, forvet kaleciyle karşı karşıya!',()=>{
          const M=G.m;M.sa++;M.sotA++;M.ga++;M.xgA=+(M.xgA+0.38).toFixed(2);M.evMarks.push({m:M.min,type:'ga'});SFX.concede();
          addLog('yenilen','Ofsayt tuzağı tutmadı, rakip gol attı.');
        });
      }
    },24);

    const getX=ev=>{const r=svgEl.getBoundingClientRect();return(ev.clientX-r.left)*(300/r.width)};
    if(svgEl){
      svgEl.onpointerdown=ev=>{
        if(done||this.locked)return;
        if(svgEl.setPointerCapture)try{svgEl.setPointerCapture(ev.pointerId)}catch(e){}
        dragging=true;SFX.tap();setLine(getX(ev));
      };
      svgEl.onpointermove=ev=>{if(!dragging||done)return;setLine(getX(ev))};
      svgEl.onpointerup=()=>{
        if(!dragging||done||this.locked)return;
        dragging=false;done=true;clearTimers();
        const delta=sx-lineX;
        if(delta>=2&&delta<=maxDelta){
          const isPerfect=delta>=6&&delta<=24;
          this.finish(true,'OFSAYT BAYRAĞI KALKTI!','Çizgiyi forvet hızına göre kusursuz çektin!',()=>{
            G.m.bd-=0.14;G.m.mo=C(G.m.mo+7,8,92);addLog('kurt','Savunma hattı kusursuz ofsayt tuzağı kurdu.');
          },'',isPerfect);
        }else{
          this.finish(false,'HATALI ÇİZGİ!',delta<2?'Forvet henüz çizginin gerisindeydi!':'Forvet çoktan savunmanın arkasına sarkmıştı!',()=>{
            G.m.bd+=0.10;addLog('taktik','Ofsayt çizgisi doğru kurulmadı.');
          });
        }
      };
      svgEl.onpointercancel=()=>{dragging=false};
    }
  },

  /* 11) ÇALIM / SLALOM (dribble) — Yatay SWIPE desteği + butonlar + kulüp renkli forma numarası */
  play_dribble(){
    const aObj=getAttrs(this.actor);
    const dc=diffCfg();
    const [myC1,myC2]=clubColors(G?G.cid:0);
    const [opC1,opC2]=clubColors(G&&G.m?G.m.n.op:1);
    const myNo=(this.actor&&this.actor.no)||10;
    const stepSpeed=C((5.4-(aObj.hiz-70)*0.03-(aObj.dri-70)*0.02)/dc.mgTimeMult,4.3,7.2);
    let lane=1,wave=0,done=false,swipeX=null;
    const lanes=[60,150,240];
    const obs=[R(0,2),R(0,2),R(0,2)];
    let oy=10;

    const renderSlalom=()=>`<svg id="mg-dr-el" viewBox="0 0 300 175" width="100%" height="175" style="display:block">
      <line x1="105" y1="0" x2="105" y2="175" stroke="rgba(255,255,255,.26)" stroke-dasharray="5 5"/>
      <line x1="195" y1="0" x2="195" y2="175" stroke="rgba(255,255,255,.26)" stroke-dasharray="5 5"/>
      <circle id="mg-dr-def" cx="${lanes[obs[wave]]}" cy="${oy}" r="14" fill="${opC1}" stroke="${opC2}" stroke-width="2.5"/>
      <text id="mg-dr-dt" x="${lanes[obs[wave]]}" y="${oy+4}" text-anchor="middle" fill="#fff" font-size="10" font-weight="900">DEF</text>
      <circle id="mg-dr-me" cx="${lanes[lane]}" cy="144" r="14" fill="${myC1}" stroke="${myC2}" stroke-width="2.5"/>
      <text id="mg-dr-mt" x="${lanes[lane]}" y="148" text-anchor="middle" fill="#fff" font-size="10.5" font-weight="900">${myNo}</text>
      <circle id="mg-dr-b" cx="${lanes[lane]}" cy="126" r="5.5" fill="#fff" stroke="#111" stroke-width="1.5"/>
    </svg>`;

    S(`${mh()}
      <div class="mg-card">
        ${mgTopBar(`DRİ ${aObj.dri} · HIZ ${aObj.hiz}`,'Yatay kaydır veya dokun')}
        <div class="mg-cmd" id="mg-dr-cmd">3 Savunmacıdan Sıyrıl! (1/3)</div>
        <div class="mg-svg-wrap" id="mg-dr-svg">${renderSlalom()}</div>
        <div class="g3">
          <button class="x center" style="margin:0" onpointerdown="MG.dribLane(0)">SOL</button>
          <button class="x center" style="margin:0" onpointerdown="MG.dribLane(1)">ORTA</button>
          <button class="x center" style="margin:0" onpointerdown="MG.dribLane(2)">SAĞ</button>
        </div>
      </div>
    `);

    const applyLane=(l)=>{
      if(done||this.locked)return;
      lane=C(l,0,2);SFX.tap();
      const me=$('mg-dr-me'),mt=$('mg-dr-mt'),b=$('mg-dr-b');
      if(me)me.setAttribute('cx',lanes[lane]);
      if(mt)mt.setAttribute('x',lanes[lane]);
      if(b)b.setAttribute('cx',lanes[lane]);
    };
    this.dribLane=applyLane;

    const drWrap=$('mg-dr-svg');
    if(drWrap){
      drWrap.onpointerdown=ev=>{swipeX=ev.clientX;if(drWrap.setPointerCapture)try{drWrap.setPointerCapture(ev.pointerId)}catch(e){}};
      drWrap.onpointermove=ev=>{
        if(swipeX===null||done)return;
        const dx=ev.clientX-swipeX;
        if(dx>26){applyLane(lane+1);swipeX=ev.clientX}
        else if(dx<-26){applyLane(lane-1);swipeX=ev.clientX}
      };
      drWrap.onpointerup=()=>{swipeX=null};
      drWrap.onpointercancel=()=>{swipeX=null};
    }

    addIv(()=>{
      if(done)return;
      oy+=stepSpeed;
      const df=$('mg-dr-def'),dt=$('mg-dr-dt');
      if(df)df.setAttribute('cy',oy.toFixed(1));
      if(dt)dt.setAttribute('y',(oy+4).toFixed(1));
      if(oy>=130&&oy<=158&&lane===obs[wave]){
        done=true;
        this.finish(false,'TOP KAYBEDİLDİ!','Savunmacıya takıldın, atak sonlandı.',()=>{G.m.ba-=0.06;addLog('taktik','Çalım girişiminde top savunmada kaldı.')});
        return;
      }
      if(oy>175){
        wave++;
        if(wave>=3){
          done=true;
          const isGoal=Math.random()<C(dc.mgGoalCap+(aObj.dri-70)*0.004,0.24,dc.mgGoalCap+0.06);
          const missKind=Math.random()<0.5?'post':'tip';
          if(!isGoal&&missKind==='post')SFX.post();
          this.finish(
            true,isGoal?'SLALOM GOLÜ!':(missKind==='post'?'DİREKTEN DÖNDÜ!':'PARMAK UCUYLA ÇELDİ!'),
            isGoal?'Üç rakibi birden çalımlayıp köşeye bıraktın!':'Müthiş slalom sonrası şut kıl payı kaçtı!',
            ()=>{
              const M=G.m;M.sh++;M.xgF=+(M.xgF+0.36).toFixed(2);
              if(isGoal){
                M.sotF++;const s=this.actor?this.actor.n:scr();
                if(this.actor){this.actor.g=(this.actor.g||0)+1;adjRating(this.actor.id,1.1)}
                M.gf++;M.evMarks.push({m:M.min,type:'gf'});SFX.goal();
                addLog('gol',`${s} slalom çalımlarla harika bir gol attı!`);
              }else{M.ba+=0.18;M.mo=C(M.mo+10,8,92);addLog(missKind==='post'?'direk':'taktik','Müthiş slalom ceza sahasında tehlike yarattı.')}
            },
            isGoal?'':nearMissSVG(missKind),true
          );
        }else{
          oy=10;
          const cmd=$('mg-dr-cmd');if(cmd)cmd.textContent=`3 Savunmacıdan Sıyrıl! (${wave+1}/3)`;
          if(df){df.setAttribute('cx',lanes[obs[wave]]);df.setAttribute('cy',oy)}
          if(dt){dt.setAttribute('x',lanes[obs[wave]]);dt.setAttribute('y',oy+4)}
        }
      }
    },25);
  },

  /* 12) KALECİ DEGAJI (kdist) — Kulüp renkli kanat oyuncusu + pointerCapture/cancel */
  play_kdist(){
    const aObj=getAttrs(this.actor);
    const dc=diffCfg();
    const [myC1,myC2]=clubColors(G?G.cid:0);
    const tolDist=Math.round(C(Math.round(46+(aObj.pas-65)*0.5),42,58)*dc.mgTimeMult);
    let wx=36,dir=1,flying=false,done=false,dragging=false;
    const speed=2.6/dc.mgTimeMult;

    S(`${mh()}
      <div class="mg-card">
        ${mgTopBar(`KALECİ PAS ${aObj.pas}`,'Koşu yolunun önüne bırak')}
        <div class="mg-cmd" id="mg-kd-cmd">Kanat oyuncusunun ÖNÜNE sürükleyip bırak!</div>
        <div class="mg-svg-wrap" id="mg-kd-area">
          <svg id="mg-kd-svg" viewBox="0 0 300 175" width="100%" height="175" style="display:block">
            <line x1="10" y1="36" x2="290" y2="36" stroke="rgba(255,255,255,.28)" stroke-dasharray="5 4"/>
            <circle id="mg-kd-wg" cx="${wx}" cy="36" r="13" fill="${myC1}" stroke="${myC2}" stroke-width="2.2"/>
            <text id="mg-kd-wgt" x="${wx}" y="40" text-anchor="middle" fill="#fff" font-size="8.5" font-weight="900">KNT</text>
            <line id="mg-kd-aim" x1="150" y1="138" x2="150" y2="138" stroke="#4ade80" stroke-width="3" stroke-dasharray="5 4"/>
            <circle id="mg-kd-tgt" cx="150" cy="138" r="8" fill="rgba(74,222,128,.35)" stroke="#4ade80" stroke-width="2" style="display:none"/>
            <circle cx="150" cy="152" r="12" fill="#f59e0b" stroke="#111" stroke-width="2"/>
            <text x="150" y="156" text-anchor="middle" fill="#111" font-size="9" font-weight="900">KL</text>
            <circle id="mg-kd-ball" cx="150" cy="138" r="7" fill="#fff" stroke="#111" stroke-width="2"/>
          </svg>
        </div>
        <div class="m" style="text-align:center;color:rgba(255,255,255,.82)">Parmağını bıraktığın nokta doğrudan topun varış hedefidir (~600ms uçuş).</div>
      </div>
    `);

    const svgEl=$('mg-kd-svg'),wgEl=$('mg-kd-wg'),wgtEl=$('mg-kd-wgt'),ballEl=$('mg-kd-ball'),aimEl=$('mg-kd-aim'),tgtEl=$('mg-kd-tgt');
    addIv(()=>{
      if(done)return;
      wx+=dir*speed;
      if(wx>=272){wx=272;dir=-1}else if(wx<=28){wx=28;dir=1}
      if(wgEl)wgEl.setAttribute('cx',wx.toFixed(1));
      if(wgtEl)wgtEl.setAttribute('x',wx.toFixed(1));
    },22);

    const getPt=ev=>{
      const r=svgEl.getBoundingClientRect();
      return{x:C((ev.clientX-r.left)*(300/r.width),18,282),y:C((ev.clientY-r.top)*(175/r.height),18,128)};
    };

    if(svgEl){
      svgEl.onpointerdown=ev=>{
        if(done||flying||this.locked)return;
        if(svgEl.setPointerCapture)try{svgEl.setPointerCapture(ev.pointerId)}catch(e){}
        dragging=true;const p=getPt(ev);
        if(aimEl){aimEl.setAttribute('x2',p.x.toFixed(1));aimEl.setAttribute('y2',p.y.toFixed(1))}
        if(tgtEl){tgtEl.style.display='block';tgtEl.setAttribute('cx',p.x.toFixed(1));tgtEl.setAttribute('cy',p.y.toFixed(1))}
      };
      svgEl.onpointermove=ev=>{
        if(!dragging||flying||done)return;
        const p=getPt(ev);
        if(aimEl){aimEl.setAttribute('x2',p.x.toFixed(1));aimEl.setAttribute('y2',p.y.toFixed(1))}
        if(tgtEl){tgtEl.setAttribute('cx',p.x.toFixed(1));tgtEl.setAttribute('cy',p.y.toFixed(1))}
      };
      svgEl.onpointerup=ev=>{
        if(!dragging||flying||done||this.locked)return;
        dragging=false;const end=getPt(ev);const tx=end.x,ty=end.y;
        if(aimEl){aimEl.setAttribute('x2',tx.toFixed(1));aimEl.setAttribute('y2',ty.toFixed(1))}
        if(tgtEl){tgtEl.setAttribute('cx',tx.toFixed(1));tgtEl.setAttribute('cy',ty.toFixed(1))}
        flying=true;SFX.kick();
        let step=0;const steps=27;
        addIv(()=>{
          if(done)return;
          step++;const u=step/steps;
          const bx=150+(tx-150)*u,by=138+(ty-138)*u-Math.sin(u*Math.PI)*24;
          if(ballEl){ballEl.setAttribute('cx',bx.toFixed(1));ballEl.setAttribute('cy',by.toFixed(1))}
          if(step>=steps){
            done=true;clearTimers();
            const dist=Math.hypot(tx-wx,ty-36);
            if(dist<=tolDist){
              const isPerfect=dist<=26;
              const isGoal=Math.random()<(isPerfect?dc.mgGoalCap:dc.mgGoalCap*0.65);
              const missKind=Math.random()<0.5?'post':'tip';
              if(!isGoal&&missKind==='post')SFX.post();
              this.finish(
                true,isGoal?'DEGAJ ASİSTİ!':(isPerfect?'ADRESE TESLİM!':'HIZLI KONTRA!'),
                isGoal?'Kalecinin önüne bıraktığı degaj doğrudan golle bitti!':'Kanat oyuncun koşu yolunda topu yakaladı, şut kıl payı kaçtı!',
                ()=>{
                  const M=G.m;M.sh++;M.xgF=+(M.xgF+0.28).toFixed(2);
                  if(isGoal){M.sotF++;const s=scr();M.gf++;M.evMarks.push({m:M.min,type:'gf'});SFX.goal();addLog('gol',`Kaleci degajıyla başlayan kontrada ${s} gol attı!`)}
                  else{M.ba+=0.16;M.mo=C(M.mo+9,8,92);addLog(missKind==='post'?'direk':'taktik','Hızlı kaleci degajı kontra atak başlattı.')}
                },
                isGoal?'':nearMissSVG(missKind),isPerfect
              );
            }else this.finish(false,'İSABET EDEMEDİ!','Top koşu yolunun uzağına düştü, kontra fırsatı kaçtı.',()=>{addLog('taktik','Kaleci degajı isabetsiz oldu.')});
          }
        },22);
      };
      svgEl.onpointercancel=()=>{dragging=false};
    }

    addTo(()=>{if(!done&&!flying&&!this.locked){done=true;this.finish(false,'SÜRE DOLDU!','Rakip yerleşti, hızlı çıkış fırsatı kaçtı.',()=>{addLog('taktik','Kaleci oyunu geç başlattı.')})}},4600);
  }
};

/* ==================== POST-MATCH (RECORDS REAL APPS & RATINGS) ==================== */
function fin2(fromPen=false){
  clearTimers();clearUiTimers();mdx();MatchCanvas.stop();
  const M=G.m,n=M.n,r=M.gf>M.ga?1:M.gf<M.ga?-1:0;

  if(!fromPen&&(n.t==='c'||n.t==='e')&&M.gf===M.ga)return penShootout();

  const ok=r>0||(M.penRes&&M.penRes.won);
  const penStr=M.penRes?` (Pen: ${M.penRes.my}-${M.penRes.op})`:'';
  const cp=G.cap!==null&&M.playedIds.includes(G.cap);
  let ex='';

  recordMatchStats(M.gf,M.ga,CN(n.op));
  const microDone=evaluateMicroObjs(M);

  /* Görev 7: Gerçek Maç Sayısı (apps) & Sezon Reyting Ortalaması (ratSum/ratCnt) kaydı */
  let motmPl=null,motmRat=0;
  M.playedIds.forEach(pid=>{
    const rt=M.ratings[pid]||6.5;
    const pl=DB.pl[pid];
    if(pl){
      pl.apps=(pl.apps||0)+1;
      pl.ratSum=(pl.ratSum||0)+rt;
      pl.ratCnt=(pl.ratCnt||0)+1;
      if(rt>motmRat){motmRat=rt;motmPl=pl}
    }
  });
  if(motmPl){
    motmPl.m=C(motmPl.m+3,0,100);
    motmPl.xp=(motmPl.xp||0)+3;
    if(motmPl.xp>=10){
      motmPl.xp-=10;motmPl.o=Math.min(95,motmPl.o+1);getAttrs(motmPl);
      G.growthAlerts=[`Maçın Adamı Gelişimi: ${motmPl.n} OVR ${motmPl.o-1} → ${motmPl.o}`,...(G.growthAlerts||[])].slice(0,3);
    }
  }

  if(n.t==='l'){
    const myMatch=G.fx[n.r].find(([h,a])=>h===G.cid||a===G.cid);
    if(myMatch)res(myMatch[0],myMatch[1],myMatch[0]===G.cid?M.gf:M.ga,myMatch[0]===G.cid?M.ga:M.gf);
    const L=[];
    (M.otherGames||[]).forEach(g=>{
      res(g.h,g.a,g.fg,g.agFinal);
      L.push(`${CN(g.h)} ${g.fg}-${g.agFinal} ${CN(g.a)}`);
      [[g.h,g.fg],[g.a,g.agFinal]].forEach(([cid,gl])=>{
        for(let i=0;i<gl;i++){const fs=DB.pl.filter(q=>q.c===cid&&q.p>=2);if(fs.length){const z=P(fs);z.g=(z.g||0)+1}}
      });
    });
    G.news=[`${M.fl.red?'Kırmızı kart gündemde':'Haftanın maçı'}: ${CN(G.cid)} ${M.gf}-${M.ga} ${CN(n.op)}`,...L.slice(0,3),...(G.news||[])].slice(0,6);
  }else if(n.t==='e'){
    const mult=ecoInf();
    if(ok){
      G.eurR++;G.xp+=20;
      if(G.eurR===3){
        const gross=Math.round(35*mult),net=+(gross*0.75).toFixed(1);
        G.eurWon=1;G.stats.euroCups++;G.cash+=net;
        G.fans=C(G.fans+15,0,100);G.board=C(G.board+15,0,100);G.med=C(G.med+12,0,100);G.xp+=60;
        ex=`${M.penRes?'Penaltılarla ':''}AVRUPA ŞAMPİYONU OLDUN! (+${net} M Net Ödül · %25 Kadro Primi Düşüldü)`;
      }else{
        const prize=Math.round((G.eurR===1?8:12)*mult);G.cash+=prize;
        ex=`${M.penRes?'Penaltılarla tur atladın! ':'Avrupa Kupası\'nda üst tura yükseldin! '}(+${prize} M)`;
      }
    }else{G.euro=0;ex=M.penRes?'Penaltılarla Avrupa Kupası\'ndan elendin.':'Avrupa Kupası maceran bu turda sona erdi.'}
  }else{
    if(ok){
      G.cr++;G.xp+=15;
      if(G.cr===3){G.stats.natCups++;G.fans=C(G.fans+12,0,100);G.xp+=40;ex=`${M.penRes?'Penaltılarla ':''}ULUSAL KUPA ŞAMPİYONU OLDUN!`}
      else ex=M.penRes?'Penaltılarla tur atladın!':'Kupada bir üst tura yükseldin.';
    }else{G.cup=0;ex=M.penRes?'Penaltılarla kupadan elendin.':'Kupaya veda ettin.'}
  }

  G.xp+=r>0?10:r===0?3:0;
  while(G.xp>=30){G.xp-=30;G.sp++}
  G.strk=r<0?G.strk+1:0;
  G.board=C(G.board+r*3,0,100);G.fans=C(G.fans+r*3,0,100);G.sq=C(G.sq+r*2+(cp&&r<0?1:0),0,100);

  if(n.home){
    G.cash+=homeTicketRevenue(true);
    if(G.tp===0)G.fans=C(G.fans+1,0,100);
    if(G.tp===2&&fill()<60)G.fans=C(G.fans-1,0,100);
  }
  if(r>0){
    const gross=matchWinGross(),wb=winBonusAmount(),net=+(gross-wb).toFixed(1);
    G.cash+=net;
    ex+=(ex?' · ':'')+`Maç Geliri: +${gross.toFixed(1)} M (-${wb.toFixed(1)} M Prim = +${net.toFixed(1)} M Net)`;
    if(G.spon===1)G.cash+=1.3*ecoInf()*leagueTvMult(clubLeague(G.cid));
  }else if(r===0){
    const dr=matchDrawGross();G.cash+=dr;
    ex+=(ex?' · ':'')+`Beraberlik Yayın Geliri: +${dr.toFixed(1)} M`;
  }

  if(G.derby&&G.derby.stance===1){
    if(r>0){G.fans=C(G.fans+6,0,100);G.med=C(G.med+4,0,100);ex+=' Derbi söz düellosunu sahada kazandın.'}
    else if(r<0){G.med=C(G.med-6,0,100);G.board=C(G.board-4,0,100);ex+=' Derbi öncesi büyük konuştun ama sahada kaybettin.'}
  }
  G.derby=null;

  if(G.scen==='chaos'&&r<0&&Math.random()<0.55){
    G.med=C(G.med-5,0,100);G.mods=G.mods.filter(m=>m.id!=='media');G.mods.push({id:'media',w:3});
  }

  let ultNote='';
  if(G.ult){
    const earned=r>0?3:r===0?1:0;G.ult.pts+=earned;G.ult.left--;
    if(G.ult.pts>=G.ult.need){G.ult=null;G.board=C(G.board+14,0,100);ultNote='Ültimatomu başarıyla atlattın. Yönetim güveni yenilendi (+14).'}
    else if(G.ult.left<=0)return fired(`Yönetim ültimatomu başarısız oldu (${G.ult.pts}/${G.ult.need} puan). Görevine son verildi.`);
    else ultNote=`Ültimatom sürüyor: ${G.ult.left} maç kaldı (${G.ult.pts}/${G.ult.need} puan).`;
  }

  const injRed=G.fac[2]*0.01+G.stf[2]*0.012;
  const playedSet=new Set(M.playedIds);
  G.lastPlayedIds=M.playedIds.slice();
  let injRiskMsg='';

  DB.pl.filter(x=>x.c===G.cid).forEach(x=>{
    const played=playedSet.has(x.id);
    if(played){
      x.bnStrk=0;
      if(x.prom>0){
        x.prom--;
        if(x.prom===0){x.m=C(x.m+8,0,100);x.f=C(x.f+4,0,100);G.growthAlerts=[`Söz Tutuldu: ${x.n} ilk 11 sözünün karşılığını aldı (+8 Moral, +4 Form)`,...(G.growthAlerts||[])].slice(0,3)}
      }
      if(x.injRisk===1){
        x.injRisk=0;
        if(Math.random()<0.35){x.i=R(3,4);injRiskMsg=`İğne riski pahalıya patladı: ${x.n} sakatlığını nüksettirdi (${x.i} hafta yok)!`;toast(injRiskMsg,'bad',4000)}
      }
      x.k=Math.max(10,Math.round(x.k));x.m=C(x.m+r*(cp?3:4),0,100);x.f=C(x.f+r*4,0,100);
      const risk=(x.k<52?0.07+0.03*G.agg:x.k<68?0.025+0.015*G.agg:0.012)-injRed+(x.tp===3?0.035:0);
      if(!x.i&&Math.random()<Math.max(0.004,risk))x.i=R(1,3);
    }else{
      if(x.sus>0)x.sus--;
      if(!x.i)x.bnStrk=(x.bnStrk||0)+1;
      x.m=C(x.m-(x.tp===1?3:1),0,100);
      if(x.tp===1&&x.m<35)G.sq=C(G.sq-1,0,100);
      if(x.prom>0&&!x.i){x.prom=0;x.m=C(x.m-15,0,100);if(!G.later.some(l=>l.id==='star_leak'))G.later.push({id:'star_leak',w:0,pid:x.id})}
      else if(x.o>=75&&x.bnStrk>=2&&!x.i&&!G.later.some(l=>l.id==='benched_star'))G.later.push({id:'benched_star',w:0,pid:x.id});
    }
  });
  M.redIds.forEach(rid=>{const rx=DB.pl[rid];if(rx)rx.sus=1});
  fixXI(false);

  const q=M.fl.red?'Kırmızı kart maçın kaderini belirledi. Basın sert sorular yöneltiyor.':
    M.fl.late&&r>0?'Son dakika golüyle gelen galibiyet! Muhabirler heyecanlı.':
    M.gf-M.ga>=3?'Farklı galibiyet sonrası basın seni manşetlere taşıyor.':
    M.fl.wk?'Genç yıldızın sahada parladı! Basın onun hakkında soruyor.':
    G.strk>=2?'Üst üste yenilgiler sonrası istifa sesleri yükseliyor.':
    r>0?'Galibiyet sonrası basın toplantısındasın.':r<0?'Mağlubiyet sonrası kameralar sana çevrildi.':'Beraberlik sonrası basın tatmin olmadı.';

  const motmRar=motmPl?rarityInfo(motmPl.o):null;

  S(`

const STAT_LBL={board:'Yönetim',fans:'Taraftar',sq:'Soyunma Odası',med:'Medya',cash:'Kasa'};

function ap(e){
  const log=[];
  for(const k in e){
    const v=e[k];
    if(k==='inj'){
      const x=P(hl(G.cid));if(x){x.i=v;fixXI(false);log.push({t:`${x.n} (${v} hafta sakat)`,c:'neg'})}
    }else if(k==='wk'){
      const p=mk(nm(DB?DB.league:'tr'),G.cid,P([1,2,3]),R(60,68),17,4,R(82,91));
      log.push({t:`Wonderkid: ${p.n} (${p.o})`,c:'pos'});
    }else if(k==='presBuy'){
      const avgS=(DB.clubs[G.cid]&&DB.clubs[G.cid].s)||74;
      const p=mk(nm(clubLeague(G.cid)),G.cid,P([1,2,3]),C(avgS+R(-2,2),64,86),R(21,26));
      updateClubStrengths();log.push({t:`Yeni Transfer: ${p.n} (${PN[p.p]}, OVR ${p.o}) kadroya katıldı`,c:'pos'});
    }else if(k==='loanYouth'){
      const squadCnt=DB.pl.filter(q=>q.c===G.cid).length;
      const u21=DB.pl.filter(q=>q.c===G.cid&&q.a<=21&&!q.loan).sort((a,b)=>a.o-b.o)[0];
      if(u21&&squadCnt>13){
        const dest=P(DB.allClubs.filter(c=>c.id!==G.cid));
        u21.loanOut={from:G.cid,to:dest.id,fee:1.5};u21.c=dest.id;G.cash+=1.5;
        if(G.cap===u21.id)G.cap=null;fixXI(true);
        log.push({t:`${u21.n} (${u21.a}y) 1 sezonluğuna ${dest.name} kulübüne kiralandı (+1.5 M)`,c:'info'});
      }else log.push({t:'Kadroda uygun 21 yaş altı oyuncu yok, kiralama iptal',c:'neu'});
    }else if(k==='mod'){
      G.mods=G.mods.filter(m=>m.id!==v);G.mods.push({id:v,w:MD[v].w});
      if(v==='disc'){G.board=C(G.board+5,0,100);log.push({t:`Yönetim +5`,c:'pos'})}
      log.push({t:`Yeni Etki: ${MD[v].n} (${MD[v].w}h)`,c:'neu'});
    }else if(k==='lt'){
      G.later.push(typeof v==='string'?{id:v,w:2}:v);
    }else if(k==='rep'){
      for(const rk in v){addRep(rk,v[rk]);log.push({t:`İtibar: ${REP_META[rk].n} +${v[rk]}`,c:'info'})}
    }else if(k==='prom'&&G.evPid!==undefined){
      const px=DB.pl[G.evPid];if(px){px.prom=2;px.m=C(px.m+10,0,100);log.push({t:`${px.n} İlk 11 Sözü`,c:'neu'})}
    }else if(k==='sellStar'){
      const px=(G.evPid!==undefined&&DB.pl[G.evPid]&&DB.pl[G.evPid].c===G.cid)
        ?DB.pl[G.evPid]:DB.pl.filter(q=>q.c===G.cid&&!q.loan).sort((a,b)=>b.o-a.o)[0];
      const squadCnt=DB.pl.filter(q=>q.c===G.cid).length;
      if(px&&px.c===G.cid&&squadCnt>13){
        const fee=Math.round(val(px)*(v===2?1.0:1.25));G.cash+=fee;
        const dest=P(DB.allClubs.filter(c=>c.id!==G.cid));px.c=dest.id;
        if(G.cap===px.id)G.cap=null;fixXI(false);ensureSetPieces();updateClubStrengths();
        log.push({t:`Kasa +${fee} M (${px.n} → ${dest.name})`,c:'pos'});
      }else log.push({t:'Kadro dar olduğu için satış iptal edildi',c:'neu'});
    }else if(k in STAT_LBL){
      const before=G[k];
      G[k]=k==='cash'?G[k]+v:C(G[k]+v,0,100);
      const diff=k==='cash'?v:G[k]-before;
      if(diff!==0)log.push({t:`${STAT_LBL[k]} ${diff>0?'+':''}${k==='cash'?diff+' M':diff}`,c:diff>0?'pos':'neg'});
    }
  }
  return log;
}

  const sc=scenCfg();
  if(G.sq<10)return fired('Soyunma odası tamamen isyan etti! Yönetim görevine son verdi.');
  if(G.board<sc.fireTh&&!G.ult)return fired('Yönetim güveni kritik eşiğin altına indi. Görevden alındın.');
  if(G.board<sc.ultTh&&!G.ult){
    G.ult={left:3,pts:0,need:6};
    return showResult('YÖNETİM ÜLTİMATOMU',
      'Yönetim kurulu acil toplandı! Önümüzdeki 3 maçta en az 6 puan almazsan görevine son verilecek.',
      [{t:'Ültimatom: 3 Maçta 6 Puan',c:'neg'}],'after');
  }
  if(G.scen==='rising'&&Math.random()<0.25&&!G.later.some(l=>l.id==='poach_fu')){
    const best=DB.pl.filter(x=>x.c===G.cid&&!x.loan).sort((a,b)=>b.o-a.o)[0];
    if(best)G.later.push({id:'poach_fu',w:0,pid:best.id});
  }
  const idx=G.later.findIndex(l=>l.w<=0);
  if(idx>=0){
    const it=G.later.splice(idx,1)[0];G.evPid=it.pid;G.ev=FU[it.id](it.pid);
    return showEvent('SON DAKİKA · KRİZ ZİNCİRİ');
  }
  if(Math.random()<0.48){G.evPid=undefined;G.ev=P(EV2);return showEvent('SON DAKİKA · KULÜP GÜNDEMİ')}
  endWeek();
}

function computeSeasonAwards(userRank){
  const activePl=DB.pl.filter(x=>x.c>=0&&x.c<12);
  const topScorer=activePl.slice().sort((a,b)=>(b.g||0)-(a.g||0)||b.o-a.o)[0];
  const youngPlayer=activePl.filter(x=>x.a<=22).sort((a,b)=>(b.o+(b.g||0)*1.5+b.f*0.1)-(a.o+(a.g||0)*1.5+a.f*0.1))[0]||activePl[0];
  const rk=rank();
  let bestMgrCid=rk[0],bestScore=-999;
  rk.forEach((cid,idx)=>{const sc=(powerRank(cid)-(idx+1))*2+(idx===0?5:0);if(sc>bestScore){bestScore=sc;bestMgrCid=cid}});
  const mgrOfYear=bestMgrCid===G.cid?`${CN(G.cid)} (Sen)`:`${CN(bestMgrCid)} T.D.`;
  const perf=x=>x.o+(x.g||0)*1.2+x.f*0.08;
  const pickPos=(p,n)=>activePl.filter(x=>x.p===p).sort((a,b)=>perf(b)-perf(a)).slice(0,n);
  const xi=[...pickPos(0,1),...pickPos(1,4),...pickPos(2,3),...pickPos(3,3)];
  const trophies=[userRank===1?'Lig':null,G.cr===3?'Kupa':null,G.eurWon?'Avrupa':null].filter(Boolean).join(', ');
  const aw={
    season:G.season,club:CN(G.cid),rank:userRank,trophies,
    topScorer:topScorer?`${topScorer.n} (${topScorer.g||0}G)`:'-',
    youngPlayer:youngPlayer?`${youngPlayer.n} (${youngPlayer.o})`:'-',
    mgrOfYear,
    xi:xi.map(x=>({n:x.n,p:PN[x.p],o:x.o,g:x.g||0,mine:x.c===G.cid,club:CN(x.c)}))
  };
  G.hallOfFame=G.hallOfFame||[];
  G.hallOfFame.push({season:aw.season,club:aw.club,rank:aw.rank,trophies:aw.trophies,topScorer:aw.topScorer,youngPlayer:aw.youngPlayer,mgrOfYear:aw.mgrOfYear});
  return aw;
}

function endWeek(){
  const playedIds=new Set(G.lastPlayedIds||G.xi.filter(id=>id!==null&&id!==undefined));
  G.lastPlayedIds=null;
  advanceWeekInternals(playedIds,false);
  if(G.wk>=G.cal.length)return endSeason();
  render();
}

function buyLoanOption(id){
  const x=DB.pl[id];if(!x||!x.loan)return;
  const cost=x.loan.optPrice;
  if(G.cash<cost){toast('Satın alma opsiyonu için bütçe yetersiz.','bad');return}
  SFX.ok();G.cash-=cost;x.loan=null;x.ct=R(3,4);
  toast(`${x.n} ${cost} M bedelle bonservisiyle kadroya katıldı!`,'ok');esUI();
}
function returnLoan(id){
  const x=DB.pl[id];if(!x||!x.loan)return;
  SFX.tap();x.c=x.loan.from;x.loan=null;if(G.cap===x.id)G.cap=null;fixXI(true);
  toast(`${x.n} kiralık sözleşmesi bitince kulübüne döndü.`,'info');esUI();
}

function endSeason(){
  clearTimers();clearUiTimers();mdx();MatchCanvas.stop();TUT.stop(false);
  const k=rank().indexOf(G.cid)+1,ok=checkObj(k);
  const mult=ecoInf()*leagueTvMult(clubLeague(G.cid));
  if(k===1)G.stats.leagueCups++;

  const tags=[`${k}. sıra`,G.cr===3?'Kupa Şampiyonu':'',G.eurWon?'Avrupa Şampiyonu':'',`Hedef ${ok?'Başarılı':'Başarısız'}`].filter(Boolean).join(' · ');
  G.hist.push(`Sezon ${G.season} (${CN(G.cid)} · ${LEAGUE_META[DB.league||'tr'].short}): ${tags}`);

  const awards=computeSeasonAwards(k);
  const grossPrize=(G.spon===2&&k===1?Math.round(28*mult):0)+(ok?G.obj.rew:0);
  const squadBonusCut=+(grossPrize*0.25).toFixed(1);
  G.cash+=+(grossPrize-squadBonusCut).toFixed(1);

  let titleBonusPaid=0;
  if(k===1&&(G.titleBonusDue||0)>0){titleBonusPaid=G.titleBonusDue;G.cash-=titleBonusPaid}
  G.titleBonusDue=0;

  const capLimit=seasonReserveCap();
  let reserveCut=0;
  if(G.cash>capLimit){reserveCut=+((G.cash-capLimit)*0.18).toFixed(1);G.cash-=reserveCut}

  G.board=C(G.board+(k<=3?10:k<=8?2:-12)+(ok?10:-12),0,100);
  G.fans=C(G.fans+(k<=3?8:-3),0,100);
  G.ult=null;
  G.nextEuro=(k<=3||G.cr===3||G.eurWon===1)?1:0;

  const ythBonus=(G.scen==='rising'?2:0)+(G.campBonus?3:0);
  const risingStars=[],loanReturns=[];
  DB.pl.forEach(x=>{
    if(x.c===-99)return;
    if(x.c===-1){x.a++;if(x.a>=33&&x.o<62)x.c=-99;return}
    const oldO=x.o;x.a++;if(!x.loan)x.ct--;
    x.bnStrk=0;x.prom=0;x.sus=0;x.injRisk=0;
    if(x.pot===undefined)x.pot=calcPot(x.c,x.o,x.a,x.tp);
    if(x.loanOut&&x.loanOut.from===G.cid){
      const boost=R(2,4);x.o=C(Math.min(x.pot||90,x.o+boost),48,94);x.c=G.cid;x.loanOut=null;x.k=100;x.i=0;getAttrs(x);
      loanReturns.push(`${x.n} (${oldO} → ${x.o})`);return;
    }
    let prog=0;
    if(x.a<=24){const gap=Math.max(0,x.pot-x.o);prog=gap>0?Math.min(gap,R(1,3)+(gap>=10?1:0)+(x.tp===4?1:0)+(x.c===G.cid?ythBonus:0)):R(0,1)}
    else if(x.a<=29)prog=x.o<x.pot?R(0,2):R(-1,1);
    else if(x.a<=32)prog=-R(0,1);
    else prog=-R(1,3);
    x.o=C(x.o+prog,42,94);x.i=0;x.k=100;getAttrs(x);
    if(x.c===G.cid&&x.o>oldO&&x.a<=25)risingStars.push({n:x.n,oldO,newO:x.o,pot:x.pot,xp:x.xp||0,p:PN[x.p]});
    if(x.a>36)regenPlayer(x);
  });

  updateClubStrengths();
  if(G.board<scenCfg().fireTh)return fired(ok?'Yönetim güvenini kaybetti.':'Sezon hedefi tutmadı, yönetim yollarını ayırdı.');

  const domOffers=(k<=4||G.board>=75)?DB.clubs.filter(c=>c.id!==G.cid&&c.s>=DB.clubs[G.cid].s-2).sort(()=>Math.random()-0.5).slice(0,1).map(c=>c.id):[];
  const crossOffers=(k<=2||G.cr===3||G.eurR>=2||G.eurWon===1)?DB.allClubs.slice(12).filter(c=>c.s>=DB.clubs[G.cid].s-5).sort(()=>Math.random()-0.5).slice(0,2).map(c=>c.id):[];
  G.es={k,ok,o:[...domOffers,...crossOffers],nextEuro:G.nextEuro,awards,grossPrize,squadBonusCut,reserveCut,capLimit,titleBonusPaid,loanReturns,risingStars:risingStars.sort((a,b)=>(b.newO-b.oldO)-(a.newO-a.oldO)).slice(0,4)};
  esUI();
}

function rn(id){
  const x=DB.pl[id],c=renewCost(x);
  if(G.cash<c){toast('Bütçe yetersiz.','bad');return}
  SFX.ok();G.cash-=c;x.ct=R(2,3);
  toast(`${x.n} ile ${x.ct} yıllık yeni sözleşme imzalandı (-${c} M).`,'ok');esUI();
}
function rnAll(){
  const ex=DB.pl.filter(x=>x.c===G.cid&&x.ct<=0&&!x.loan).sort((a,b)=>b.o-a.o);
  let cnt=0,spent=0;
  for(const x of ex){const c=renewCost(x);if(G.cash>=c){G.cash-=c;x.ct=R(2,3);cnt++;spent+=c}}
  if(cnt>0){SFX.ok();toast(`${cnt} oyuncunun sözleşmesi yenilendi (-${spent.toFixed(1)} M).`,'ok')}
  else toast('Bütçeye uygun yenilenecek oyuncu yok.','warn');
  esUI();
}

function esUI(){
  const{k,ok,o,nextEuro,awards,grossPrize,squadBonusCut,reserveCut,capLimit,titleBonusPaid,loanReturns,risingStars}=G.es;
  const ex=DB.pl.filter(x=>x.c===G.cid&&x.ct<=0&&!x.loan).sort((a,b)=>b.o-a.o);
  const loanIns=DB.pl.filter(x=>x.c===G.cid&&x.loan);
  const canAny=ex.some(x=>G.cash>=renewCost(x));
  S(`
    <div class="hd">
      <div class="r">
        <span class="bd">SEZON ${G.season} TAMAMLANDI</span>
        <span class="bd num" style="background:rgba(16,185,129,.28);border-color:rgba(16,185,129,.6)">${ico('cash',12)} Bütçe: ${G.cash.toFixed(1)} M</span>
      </div>
      <div class="big" style="margin-top:6px">${k}. Sırada Bitirdin</div>
      <p style="margin:6px 0 0">Hedef: ${E(G.obj.label)} — ${ok?'Başarılı (+10 Yönetim)':'Başarısız (-12 Yönetim)'}</p>
      ${grossPrize>0?`<p class="m" style="margin:4px 0 0">Sezon Ödülleri: +${grossPrize} M · Kadro Primi (%25): -${squadBonusCut} M</p>`:''}
      ${titleBonusPaid>0?`<p class="m" style="margin:2px 0 0">Transfer Şampiyonluk Bonusu Ödemesi: -${titleBonusPaid} M</p>`:''}
      ${reserveCut>0?`<p class="m" style="margin:2px 0 0">Hissedar/Vergi Kesintisi (${capLimit} M üzeri %18): -${reserveCut} M</p>`:''}
      ${nextEuro?`<div style="margin-top:6px"><span class="pill euro">${ico('globe',11)} Gelecek Sezon Avrupa Kupası'na Katılım Hakkı!</span></div>`:''}
    </div>
    ${(loanReturns&&loanReturns.length)?`<div class="growth-card"><span class="lbl" style="color:var(--ok)">${ico('globe',13)} KİRADAN GELİŞEREK DÖNEN GENÇLER</span>${loanReturns.map(s=>`<div style="font-size:12.5px;font-weight:700;margin-top:3px">• ${E(s)}</div>`).join('')}</div>`:''}
    ${loanIns.length?`<div class="c"><span class="lbl">${ico('swap',13)} Kiralık Oyuncu Satın Alma Opsiyonları (${loanIns.length})</span>${loanIns.map(x=>`<div class="c2"><div class="r"><b>${E(x.n)} (${PN[x.p]}, OVR ${x.o})</b><span class="pill euro num">Opsiyon: ${x.loan.optPrice} M</span></div><div class="g2" style="margin-top:6px"><button class="ok-btn sm" style="width:100%" ${G.cash<x.loan.optPrice?'disabled':''} onclick="buyLoanOption(${x.id})">Bonservisini Al (${x.loan.optPrice} M)</button><button class="x center sm" style="width:100%" onclick="returnLoan(${x.id})">Kulübüne Gönder</button></div></div>`).join('')}</div>`:''}
    ${(risingStars&&risingStars.length)?`<div class="growth-card"><span class="lbl" style="color:var(--ok)">${ico('trend',13)} SEZONUN PARLAYAN GENÇLERİ (OVR ARTIŞI)</span>${risingStars.map(rs=>`<div class="r" style="padding:4px 0;border-bottom:1px solid rgba(16,185,129,.22)"><span><b>${E(rs.n)}</b> <span class="m">${rs.p} · Pot ${rs.pot} · XP ${rs.xp}/10</span></span><span class="pill pos num" style="margin:0">${rs.oldO} → ${rs.newO} (+${rs.newO-rs.oldO})</span></div>`).join('')}</div>`:''}
    ${awards?`<div class="c"><span class="lbl">${ico('crown',13)} Sezon Ödülleri & Yılın 11'i</span><div class="c2" style="margin:6px 0"><div class="r"><span>Gol Kralı</span><b>${E(awards.topScorer)}</b></div><div class="r"><span>Yılın Genç Oyuncusu</span><b>${E(awards.youngPlayer)}</b></div><div class="r"><span>Yılın Menajeri</span><b>${E(awards.mgrOfYear)}</b></div></div><span class="lbl" style="margin-top:8px">${ico('star',12)} Yılın 11'i (Senin Oyuncuların Vurgulu)</span><div>${awards.xi.map(p=>`<span class="chip ${p.mine?'sel':''}" style="cursor:default"><b>${p.p}</b> ${E(p.n)} <b>${p.o}</b> <span class="m">${E(p.club.slice(0,6))}</span></span>`).join('')}</div></div>`:''}
    ${ex.length?`<div class="c"><div class="r"><span class="lbl" style="margin:0">${ico('clock',13)} Sözleşmesi Biten Oyuncular (${ex.length})</span><span class="pill info num" style="margin:0">Bütçe: ${G.cash.toFixed(1)} M</span></div><p class="m" style="margin:4px 0 8px">Yenilemezsen yeni sezon başında serbest kalırlar.</p><button class="ok-btn" style="margin-bottom:8px" ${canAny?'':'disabled'} onclick="rnAll()">${ico('check',14)} Uygun Olanların Tümünü Yenile</button>${ex.map(x=>{const cost=renewCost(x),poor=G.cash<cost;return`<button class="x r" ${poor?'disabled':''} onclick="rn(${x.id})"><span><b>${E(x.n)}</b> · ${PN[x.p]} · ${x.a} yaş · <b>OVR ${x.o}</b></span><span class="pill ${poor?'neg':'pos'} num" style="margin:0">${poor?`Bütçe Yetersiz (${cost} M)`:`Yenile · ${cost} M`}</span></button>`}).join('')}</div>`:''}
    ${o.length?`<div class="c"><span class="lbl">${ico('globe',13)} Yeni İş Teklifleri (Yurtiçi & Avrupa Ligleri)</span>${o.map(i=>{const cl=DB.allClubs[i],lgM=LEAGUE_META[cl.league]||LEAGUE_META.tr;return`<button class="x r" onclick="job(${i})"><span class="row">${clubCrestSVG(i,22)} <span><b>${E(cl.name)}</b> (Güç ${Math.round(cl.s)})</span></span><span class="pill ${lgM.cls}" style="margin:0">${lgM.short}</span></button>`}).join('')}</div>`:''}
    <button onclick="SFX.tap();newSeason()">${ico('play',14)} ${E(CN(G.cid))} ile Yeni Sezona Başla</button>
  `);
}

function balanceAISquads(){
  DB.allClubs.forEach(c=>{
    if(c.id===G.cid)return;
    let list=DB.pl.filter(x=>x.c===c.id);
    if(list.length>22){
      list.sort((a,b)=>(a.o-a.a*0.5)-(b.o-b.a*0.5));
      for(let i=0;i<list.length-22;i++)list[i].c=-1;
      list=DB.pl.filter(x=>x.c===c.id);
    }
    while(list.length<16){
      const baseS=c.baseS||c.s||65;
      const ovr=baseS>=78?R(63,75):baseS>=68?R(57,68):R(52,61);
      const hasGK=list.some(x=>x.p===0);
      list.push(mk(nm(c.league||'tr'),c.id,hasGK?P([1,2,3]):0,ovr,R(18,21)));
    }
  });
  ensureFreeAgents();
}

function newSeason(){
  G.season++;G.wk=0;G.tb=newTb();G.cup=1;G.cr=0;
  G.euro=G.nextEuro?1:0;G.eurR=0;G.eurWon=0;G.nextEuro=0;
  G.eurOps=[];ensureEuroOps();
  G.pr=0;G.strk=0;G.spon=null;G.cal=mkCal();G.s1=null;G.mktRef=0;G.dlOfferDone=0;
  G.ffpApplied=0;G.campBonus=0;G.invCamp=0;G.invScout=0;G.scoutStarId=null;G.spCashUsed=0;
  G.microObjs=genMicroObjs();

  DB.pl.forEach(x=>{
    if(x.c<0)return;
    if(x.c===G.cid&&x.loan){x.c=x.loan.from;x.loan=null;if(G.cap===x.id)G.cap=null}
    else if(x.ct<=0){
      if(x.c===G.cid){x.c=-1;if(G.cap===x.id)G.cap=null}
      else if(DB.pl.filter(q=>q.c===x.c).length>16&&Math.random()<0.40)x.c=-1;
      else x.ct=R(1,3);
    }
    x.k=100;x.g=0;x.ast=0;x.apps=0;x.ratSum=0;x.ratCnt=0;x.sus=0;x.injRisk=0;
  });

  balanceAISquads();ensureMinSquad(G.cid,true);updateClubStrengths();
  G.obj=newObj();genMkt();genYth();
  G.xi=autoSlots(G.cid,G.f,false);
  if(G.cap===null||!DB.pl[G.cap]||DB.pl[G.cap].c!==G.cid){
    const best=DB.pl.filter(x=>x.c===G.cid).sort((a,b)=>(b.tp===0?1:0)-(a.tp===0?1:0)||b.o-a.o)[0];
    G.cap=best?best.id:null;
  }
  ensureSetPieces();render();
}

function switchActiveLeagueInDB(targetLeague){
  if(!DB||DB.league===targetLeague)return;
  const oldClubs=DB.allClubs.slice();
  const reordered=[...oldClubs.filter(c=>c.league===targetLeague),...oldClubs.filter(c=>c.league!==targetLeague)];
  const idMap={};
  reordered.forEach((c,newId)=>{idMap[c.id]=newId;c.id=newId});
  DB.allClubs=reordered;DB.clubs=DB.allClubs.slice(0,12);
  DB.league=targetLeague;activeLeague=targetLeague;
  DB.pl.forEach(x=>{
    if(x.c>=0&&idMap[x.c]!==undefined)x.c=idMap[x.c];
    if(x.loan&&idMap[x.loan.from]!==undefined)x.loan.from=idMap[x.loan.from];
    if(x.loanOut){if(idMap[x.loanOut.from]!==undefined)x.loanOut.from=idMap[x.loanOut.from];if(idMap[x.loanOut.to]!==undefined)x.loanOut.to=idMap[x.loanOut.to]}
  });
  return idMap;
}

function job(c){
  syncClubInfraToDB();
  const targetClub=DB.allClubs[c];if(!targetClub)return;
  const targetLg=targetClub.league;
  let newCid=c,nextEuroForNew=0;
  if(targetLg!==DB.league){
    const idMap=switchActiveLeagueInDB(targetLg);newCid=idMap[c];
    nextEuroForNew=(targetClub.baseS>=80)?1:0;G.fx=fix(12);
  }else nextEuroForNew=rank().indexOf(c)<3?1:0;

  DB.pl.forEach(x=>{if(x.c===newCid&&x.ct<=0)x.ct=1});
  G.cid=newCid;G.scen='free';G.board=65;G.fans=65;G.sq=65;
  G.cash=Math.round(DB.clubs[newCid].s*0.55*leagueTvMult(targetLg));
  G.f='4-3-3';G.fac=DB.clubs[newCid].fac.slice();G.stf=DB.clubs[newCid].stf.slice();G.tp=DB.clubs[newCid].tp;
  G.later=[];G.mods=[];G.ult=null;G.derby=null;G.scd={};G.news=[];G.s1=null;G.nextEuro=nextEuroForNew;

  const myPl=DB.pl.filter(x=>x.c===newCid).sort((a,b)=>(b.tp===0?2:0)-(a.tp===0?2:0)||b.o-a.o);
  G.cap=myPl[0]?myPl[0].id:null;ensureSetPieces();
  toast(`${CN(newCid)} (${LEAGUE_META[targetLg].short}) kulübünde göreve başladın! Bütçe: ${G.cash} M`,'ok',3600);
  newSeason();
}

function fired(m){
  clearTimers();clearUiTimers();mdx();MatchCanvas.stop();TUT.stop(false);
  try{localStorage.removeItem('mfc_v8')}catch(e){}
  S(`
    <div class="hd" style="background:linear-gradient(135deg,#991b1b,#3b0a0a)">
      <span class="bd">KARİYER SONA ERDİ</span>
      <div class="big" style="margin-top:6px">Görevden Alındın</div>
      <p style="margin:6px 0 0">${E(m)}</p>
    </div>
    <div class="c">
      <span class="lbl">${ico('medal',13)} Kariyer Özeti</span>
      <div class="m">${G.hist.map(E).join('<br>')||'İlk sezonda veda ettin.'}</div>
    </div>
    <button onclick="gen(activeLeague);menu()">Ana Sayfaya Dön</button>
  `);
}

/* ==================== BOOTSTRAP ==================== */
if(typeof document!=='undefined'){
  gen(activeLeague);
  menu();
}
</script>
